# gremlins (github.com/go-gremlins/gremlins) configuration — pinned so mutation
# runs are reproducible between a developer's machine and CI, and so the
# test-quality sensor can FAIL the build when it regresses.
#
# Discovered automatically: gremlins looks for `.gremlins.yaml` at the Go module
# root. Both CI mutation jobs pick it up:
#   - `mutation-fast` (every push/PR) -> gremlins unleash ./internal/domain/order
#   - `mutation`      (schedule/dispatch) -> gremlins unleash ./internal/domain
#
# Re-measured on 2026-09-13 with gremlins v0.6.0 (workers 1,
# timeout-coefficient 30), after ADR-0014's promise_policy.go/promise_basis.go
# domain additions shifted the mutant population from the original
# 2026-09-07 baseline (53 mutants -> 67 mutants):
#   ./internal/domain/order -> 67 mutants, killed 50 / lived 6 / not covered 11,
#   efficacy 89.29%, mutant-coverage 83.58%, ~35s
# 6 lived + 11 uncovered are boundary conditionals in promise.go's lead-time
# fallbacks and promise_policy.go's basis-selection branches — killing them
# is tracked as follow-up domain-test hardening; the gate below locks in
# TODAY's re-measured score so neither number can silently regress further.
#
# Re-measured and RATCHETED UP on 2026-10-04 (gremlins v0.6.0, workers 1,
# timeout-coefficient 30) after ADR-0031 added internal/domain/order/
# planned_capacity.go (planned-capacity window overlap / last-writer-wins /
# validation / order constraint). Every mutant in that file is killed by the
# exact-boundary tests in planned_capacity_test.go; the pre-existing
# survivors above are unchanged:
#   ./internal/domain/order -> 117 mutants, killed 100 / lived 7 / not covered 10,
#   efficacy 93.46%, mutant-coverage 91.45%, ~87s
# (the 2026-09-13 baseline of 89.29% / 83.58% re-measured at 91.76% / 89.47%
# on origin/develop on 2026-10-04, before this change). Thresholds below are
# ratcheted to 93 / 91 — strictly below the measured values — never lowered.
#
# NOTE on the comparison: gremlins fails when the MEASURED value is <= the
# threshold (a run measuring 100.00% against a threshold of 100 exits with
# "ERROR: below efficacy-threshold"), so the threshold must sit strictly
# below what we can meet today. 89/83 is therefore the tightest useful
# value pair: it locks in the measured 89.29/83.58 and goes red the moment
# a previously-killed mutant survives, the same "gate just under what we
# already achieve" approach as the 90% coverage gate in ci.yml. Ratchet
# the thresholds upward alongside any test-quality improvement work.

silent: false

unleash:
  # Matches the flags the CI mutation job uses for the weekly deep run.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # efficacy = KILLED / (KILLED + LIVED)
    efficacy: 93
    # mutant-coverage = (KILLED + LIVED) / TOTAL mutants
    mutant-coverage: 91
