asyncapi: 2.6.0

info:
  title: Order Management — Domain & Analytics Events
  version: "1.0.0"
  description: |
    Asynchronous event contract for the **Order Management** bounded context,
    the generic/supporting context that owns the Order and OrderLine
    aggregates: order intake, per-line stock allocation (via
    inventory-storage's reservation API), promise-date calculation, and
    choreographed release of allocated work (announced to
    wes-work-planning as facts on Kafka — see ADR 0005).

    ## Message format: CloudEvents 1.0 (mandatory)

    Every message on every channel below — produced AND consumed,
    integration AND analytics — is a **CloudEvents 1.0** event in Kafka
    structured content mode (ADR 0030, the fleet-wide standard). There is
    no flat envelope, no dual-write/dual-read, and no envelope toggle.

    * Kafka message value: the CloudEvents JSON event format
      (`application/cloudevents+json`); Kafka header
      `content-type: application/cloudevents+json; charset=UTF-8`.
    * Required attributes: `specversion` (`1.0`), `id` (UUID, minted once
      and persisted with the outbox row), `source`
      (`/warehouse/order-management` for everything this service
      publishes), `type`
      (`com.warehouse.wes.order-management.order.<EventName>`), `subject`
      (the order id), `time` (occurred-at, UTC), `datacontenttype`
      (`application/json`), `dataschema`
      (`urn:warehouse:order-management:<events|analytics>:<EventName>:v1`).
    * The same `type` names an occurrence on both topics; `dataschema`
      distinguishes the integration payload from the analytics payload.
    * `data` is the event payload, unchanged by the envelope migration.
    * Messages on both topics are keyed by the `OrderId` (Hash balancer),
      preserving per-order ordering. W3C trace context stays in the
      `traceparent`/`tracestate` headers.

    Delivery is at-least-once: consumers dispatch on the FULL `type`,
    ignore unknown types, and de-duplicate on `id` (the projector does
    exactly that via its `analytics_processed_events` table). A message
    that is not a valid CloudEvent is dead-lettered (repromise consumer)
    or logged at WARN and skipped (local-cache consumers, projector).

    ## Integration contract (frozen for OrderAllocated/OrderPartiallyAllocated;
    additive for OrderRepromised)

    `OrderAllocated`, `OrderPartiallyAllocated`, and — since ADR 0014 §5 /
    ADR 0018 — `OrderRepromised` are published to
    `warehouse.order-management.events` — mirroring
    inventory-storage's precedent of forwarding a minimal subset of domain
    events cross-context. The `data.lines[]` entry shape on the first two
    is shared verbatim with wes-work-planning's Kafka consumer and MUST
    NOT change without coordinating both sides. `fulfillment_class` is
    additive (ADR 0008). `OrderRepromised` is the fleet's "your delivery
    is delayed" trigger, raised by the new `RepromiseOrder` consumer
    (ADR 0018) reacting to fulfillment-execution's `TaskCPTMissed`/
    `PackageManifested` on `warehouse.fulfillment.events`.
  contact:
    name: Order Management Team
    url: https://warehouse-systems.internal/teams/order-management
    email: order-management@warehouse-systems.internal
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

tags:
  - name: order-management
    description: >-
      The Order Management bounded context — order intake, allocation via
      inventory-storage, promise-date calculation, and choreographed
      release to wes-work-planning.
  - name: analytics
    description: >-
      The analytics data product's event stream (ADR 0006) — every domain
      event fanned out to the projector-driven analytical read side.
  - name: order
    description: Events raised by the Order aggregate.
  - name: order-line
    description: Events raised about a single OrderLine.

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >-
      Production Kafka cluster shared by every warehouse-systems bounded
      context. Locally, a broker is available at localhost:9092 via this
      repo's docker-compose.kafka.yml.

defaultContentType: application/cloudevents+json

channels:
  warehouse.order-management.events:
    description: >-
      The outbound integration topic owned by the Order Management bounded
      context (`kafka.Topic` in the code). `OrderAllocated`/
      `OrderPartiallyAllocated` and — since ADR 0018 — `OrderRepromised`
      are forwarded here; since ADR 0035 the additive, PII-free
      `SiteSkuDemandChanged` projection is too (keyed by the line-scoped
      `<order_id>/line/<line_no>`, not the bare order id). Every other
      domain event is a local concern. wes-work-planning's Kafka consumer
      derives each line's work unit id from the frozen formula
      `{orderID}-line-{lineNo}`.
    subscribe:
      operationId: consumeOrderManagementEvents
      summary: Consume order allocation-outcome, re-promise, and site/SKU demand integration events.
      description: >-
        Subscribe to this channel to learn that an order's
        allocation-then-release pass concluded, that its promise moved,
        or that one source order line's site/SKU demand changed.
        `OrderAllocated` means every line was allocated (and every
        eligible line released in the same pass); `OrderPartiallyAllocated`
        means some lines allocated and some backordered on a
        partial-shipment order. `OrderRepromised` (ADR 0018) means the
        promise for a shipment group moved, discovered by reacting to a
        fulfillment-execution fact (a missed CPT or a SLAM pass) — the
        fleet's "your delivery is delayed" trigger. `data.lines[]` on the
        first two carries exactly the lines released in this pass.
        `SiteSkuDemandChanged` (ADR 0035) is keyed by
        `<source_order_id>/line/<line_no>` so one line's demand stream is
        ordered on its own partition; it is emitted only while
        `DEMAND_PROJECTION_SITE_ID` is configured, and `state` is
        `ACTIVE` (line demand exists at the site) or `REMOVED`
        (cancellation removed it). Consumers must be idempotent (dedupe
        on `id`) and should ignore CloudEvents `type` values they do not
        recognise.
      tags:
        - name: order-management
      message:
        oneOf:
          - $ref: "#/components/messages/OrderAllocatedIntegration"
          - $ref: "#/components/messages/OrderPartiallyAllocatedIntegration"
          - $ref: "#/components/messages/OrderRepromisedIntegration"
          - $ref: "#/components/messages/SiteSkuDemandChangedIntegration"

  warehouse.fulfillment.events:
    description: >-
      fulfillment-execution's shared/fan-out integration topic — the SAME
      one labor-performance already consumes for `TaskCompleted`. This
      context consumes it ONLY for `TaskCPTMissed`/`PackageManifested`
      (ADR 0018, reacting to fulfillment-execution's own ADR 0025); every
      other event type on this topic is silently skipped. order-management
      does not import fulfillment-execution's Go code — this channel's
      messages below are this context's own independently-declared copy
      of that service's real, shipped wire shape.
    subscribe:
      operationId: consumeFulfillmentEvents
      summary: React to a missed CPT or a SLAM pass to re-promise the affected order.
      description: >-
        `order_ref` on both message types is shaped like this context's
        own `WorkUnitID` formula (`{orderId}-line-{lineNo}`) — NOT a bare
        OrderId — because fulfillment-execution populates it from
        wes-work-planning's `WorkUnitId`, itself derived from this
        context's formula at release time. The `RepromiseOrder` consumer
        parses it back apart via `usecases.ParseWorkUnitID`.
      tags:
        - name: order-management
      message:
        oneOf:
          - $ref: "#/components/messages/TaskCPTMissedInbound"
          - $ref: "#/components/messages/PackageManifestedInbound"

  warehouse.process-path-management.events:
    description: >-
      process-path-management's integration topic. Replayed from
      FirstOffset under per-process-unique consumer groups by two local
      caches: the process-path catalogue (ProcessPath*) and the CPT
      schedule cache (CPTScheduleChanged). Every other CloudEvents `type`
      is ignored; a non-CloudEvents message is logged at WARN and skipped.
    subscribe:
      operationId: consumeProcessPathEvents
      summary: Maintain the local process-path catalogue and CPT schedule caches.
      description: >-
        Dispatch is on the FULL CloudEvents type:
        com.warehouse.wes.process-path-management.processpath.ProcessPathCreated/Updated/Deactivated
        feed the catalogue (ADR 0013/0016), and
        com.warehouse.wes.process-path-management.cptschedule.CPTScheduleChanged
        feeds the CPT schedule cache (ADR 0014). Each event is a
        last-write-wins snapshot, so re-applying one is idempotent.
      tags:
        - name: order-management
      message:
        oneOf:
          - $ref: "#/components/messages/ProcessPathCreatedInbound"
          - $ref: "#/components/messages/ProcessPathUpdatedInbound"
          - $ref: "#/components/messages/ProcessPathDeactivatedInbound"
          - $ref: "#/components/messages/CPTScheduleChangedInbound"

  warehouse.work-planning.events:
    description: >-
      wes-work-planning's integration topic. Replayed from FirstOffset by
      the path-capacity local cache (ADR 0015), which acts only on
      PathCapacityChanged; every other CloudEvents `type` is ignored and a
      non-CloudEvents message is logged at WARN and skipped.
    subscribe:
      operationId: consumeWorkPlanningEvents
      summary: Maintain the local remaining-capacity cache.
      description: >-
        Dispatch is on the FULL CloudEvents type
        com.warehouse.wes.work-planning.workpool.PathCapacityChanged; the
        cache is keyed by (path_id, cutoff_at) and each event is a
        last-write-wins observation.
      tags:
        - name: order-management
      message:
        $ref: "#/components/messages/PathCapacityChangedInbound"

  warehouse.warehouse-planning.events:
    description: >-
      warehouse-planning's integration topic (key and CloudEvents subject =
      the capacity plan id). Consumed under a STABLE shared consumer group
      (env `PLANNED_CAPACITY_CONSUMER_GROUP`, ADR 0031) — a normal
      process-and-commit consumer, not a full-replay cache. Every other
      CloudEvents `type` is ignored; a message that is not a valid
      CloudEvent, or whose payload cannot be applied, is dead-lettered to
      `warehouse.warehouse-planning.events.dlq` and committed past.
    subscribe:
      operationId: consumeWarehousePlanningEvents
      summary: Maintain the local planned-capacity read model.
      description: >-
        Dispatch is on the FULL CloudEvents type. CapacityPlanCreated
        stores a DRAFT row; CapacityPlanPublished and
        CapacityShortageDetected store a PUBLISHED row; BottleneckDetected
        is recognised and ignored (its bottleneck_step is already carried by
        CapacityShortageDetected). The row is keyed by plan id with
        last-writer-wins on the CloudEvents `time` (a DRAFT never replaces a
        PUBLISHED row). The idempotency claim on the CloudEvents `id` and
        the upsert commit in ONE database transaction; the Kafka offset is
        committed only afterwards. Only a PUBLISHED plan with `shortage > 0`
        ever influences an order (ADR 0031). These contracts are
        warehouse-planning's own — see its apis/asyncapi.yaml — decoded
        independently here, never imported.
      tags:
        - name: order-management
      message:
        oneOf:
          - $ref: "#/components/messages/CapacityPlanCreatedInbound"
          - $ref: "#/components/messages/CapacityPlanPublishedInbound"
          - $ref: "#/components/messages/CapacityShortageDetectedInbound"
          - $ref: "#/components/messages/BottleneckDetectedInbound"

  warehouse.product-master.events:
    description: >-
      product-master's integration topic (key and CloudEvents subject = the
      SKU). Consumed under a STABLE shared consumer group (env
      `PRODUCT_CLASSIFICATION_CONSUMER_GROUP`, ADR 0036) when
      `PRODUCT_CLASSIFICATION_MODE=kafka` — a normal process-and-commit
      consumer feeding a durable local copy, not a full-replay cache. Only
      ProductClassified is applied; every other CloudEvents `type` on the
      topic (ProductRegistered, ProductDescriptionChanged,
      ProductDimensionsDeclared, ProductMeasured, anything new) is ignored.
      A message that is not a valid CloudEvent, or whose payload cannot be
      applied, is logged at WARN and committed past (no DLQ: the payload is
      a full-state replacement).
    subscribe:
      operationId: consumeProductMasterEvents
      summary: Maintain the local product-classification copy read at order intake.
      description: >-
        Dispatch is on the FULL CloudEvents type
        com.warehouse.wms.product-master.product.ProductClassified. The copy
        keeps one row per SKU with the classification and product-master's
        aggregate `version`; a message is applied only when its `version`
        is greater than the stored one (inserted when absent). The
        idempotency claim on the CloudEvents `id` and the upsert commit in
        ONE database transaction; the Kafka offset is committed only
        afterwards, and a transient failure is retried on the same message.
        ReceiveOrder reads the copy through ports.ProductClassificationLookup
        to evaluate path eligibility (ADR 0016); an unknown SKU stays
        "no derived attributes" (fail-open). This contract is
        product-master's own — see its apis/asyncapi.yaml — decoded
        independently here, never imported.
      tags:
        - name: order-management
      message:
        $ref: "#/components/messages/ProductClassifiedInbound"

  warehouse.order-management.analytics:
    description: >-
      The analytics fan-out topic (`kafka.AnalyticsTopic` in the code),
      separate from the integration topic so the OLTP integration contract
      and the analytical read-model stream evolve independently (ADR
      0006). order-management publishes every analytics-relevant domain
      event here; cmd/order-projector is the sole consumer and the only
      writer of the analytical store.
    publish:
      operationId: publishOrderAnalytics
      summary: Fan out order domain events for the analytics data product.
      description: >-
        order-management publishes each domain event (enriched with its
        process path via an OrderRepo lookup) as a CloudEvents 1.0 event
        whose dataschema is
        urn:warehouse:order-management:analytics:<EventName>:v1. Unrecognised event types are skipped by the
        publisher, so this channel only ever carries the ten types listed
        under subscribe below. Since ADR 0019, OrderAllocated/
        OrderPartiallyAllocated additionally carry promise_basis/
        promise_cutoff_at/split_shipment (ADR 0014 §6's promise KPIs), and
        OrderRepromised (ADR 0018) is published here too, deliberately
        WITHOUT a path_id — see OrderRepromisedAnalytics below.
      tags:
        - name: order-management
        - name: analytics
    subscribe:
      operationId: projectOrderAnalytics
      summary: Project order events into the analytical store.
      description: >-
        cmd/order-projector consumes this topic from FirstOffset and is the
        ONLY writer of the analytical Postgres. It is idempotent on
        the CloudEvents id; a redelivery is always a no-op. The report keyed per
        path x hour (Order Funnel & Allocation Health) reads what this
        projection writes; since ADR 0019 it also derives promise basis
        distribution, re-promise rate, split-shipment rate, and
        promise-to-cutoff gap from this same stream.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/OrderReceivedAnalytics"
          - $ref: "#/components/messages/OrderLineAllocatedAnalytics"
          - $ref: "#/components/messages/OrderLineBackorderedAnalytics"
          - $ref: "#/components/messages/OrderAllocatedAnalytics"
          - $ref: "#/components/messages/OrderPartiallyAllocatedAnalytics"
          - $ref: "#/components/messages/OrderAllocationPartiallyFailedAnalytics"
          - $ref: "#/components/messages/OrderLineReleasedAnalytics"
          - $ref: "#/components/messages/OrderReleasedAnalytics"
          - $ref: "#/components/messages/OrderCancelledAnalytics"
          - $ref: "#/components/messages/OrderRepromisedAnalytics"

components:
  messages:
    OrderAllocatedIntegration:
      name: OrderAllocated
      title: Order Allocated (integration)
      summary: Every line allocated — and eligible lines released in the same pass.
      description: >-
        The whole order is allocated and, per the choreographed-release
        redesign (ADR 0005), every eligible line was released as part of
        this same fact. `data.lines[]` carries the released lines; each
        line's work unit id is derived, never transmitted, as
        `{order_id}-line-{line_no}`.
      tags:
        - name: order
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/order-management }
              type: { const: com.warehouse.wes.order-management.order.OrderAllocated }
              dataschema: { const: "urn:warehouse:order-management:events:OrderAllocated:v1" }
              data:
                $ref: "#/components/schemas/AllocationData"
      examples:
        - name: orderAllocated
          summary: A two-line ship-complete order allocated and released.
          payload:
            specversion: "1.0"
            id: 4f1c2a7e-9d31-4a6b-8f0e-6b2c1d5e7a90
            source: /warehouse/order-management
            type: com.warehouse.wes.order-management.order.OrderAllocated
            subject: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
            time: "2026-09-07T10:01:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:order-management:events:OrderAllocated:v1"
            data:
              order_id: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
              promise_date: "2026-09-09T10:01:00Z"
              lines:
                - line_no: 1
                  sku: SKU-BOOK-0001
                  path_id: pick
                  gift_wrap: false
                  fulfillment_class: SAME_SKU_MULTI
                - line_no: 2
                  sku: SKU-BOOK-0002
                  path_id: pick
                  gift_wrap: true
                  fulfillment_class: SAME_SKU_MULTI

    OrderPartiallyAllocatedIntegration:
      name: OrderPartiallyAllocated
      title: Order Partially Allocated (integration)
      summary: Some lines allocated, some backordered, on a partial-shipment order.
      description: >-
        An order with AllowPartialShipment=true concluded its pass with
        some lines allocated (and released in this same pass —
        `data.lines[]` carries exactly those) and some lines Backordered.
        A ship-complete order NEVER emits this event: under BR3 its whole
        status stays Backordered until RetryAllocation succeeds.
      tags:
        - name: order
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/order-management }
              type: { const: com.warehouse.wes.order-management.order.OrderPartiallyAllocated }
              dataschema: { const: "urn:warehouse:order-management:events:OrderPartiallyAllocated:v1" }
              data:
                $ref: "#/components/schemas/AllocationData"
      examples:
        - name: orderPartiallyAllocated
          summary: One line released, one line backordered.
          payload:
            specversion: "1.0"
            id: 8a3d6c11-52b7-4f0d-9c14-3e7a5b8d2f46
            source: /warehouse/order-management
            type: com.warehouse.wes.order-management.order.OrderPartiallyAllocated
            subject: ord-1b2f1e0a-5f4f-4a67-9c1e-6e2f3a4b5c6d
            time: "2026-09-07T10:02:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:order-management:events:OrderPartiallyAllocated:v1"
            data:
              order_id: ord-1b2f1e0a-5f4f-4a67-9c1e-6e2f3a4b5c6d
              promise_date: "2026-09-09T10:02:00Z"
              lines:
                - line_no: 1
                  sku: SKU-TOY-0042
                  path_id: pick
                  gift_wrap: false
                  fulfillment_class: MULTI_LINE_MULTI

    OrderRepromisedIntegration:
      name: OrderRepromised
      title: Order Repromised (integration)
      summary: >-
        The promise for a shipment group moved — the fleet's "your
        delivery is delayed" trigger (ADR 0014 §5 / ADR 0018).
      description: >-
        Raised by the RepromiseOrder use case when reacting to
        fulfillment-execution's TaskCPTMissed (a task still open past its
        CPT) or PackageManifested (a SLAM pass) reveals that the affected
        PromiseGroup's fresh recompute differs from its current promise.
        `cpt_id_old`/`cpt_id_new` are both absent (omitempty) for a
        LeadTime-basis promise on that side — a LeadTime-basis promise has
        no CPT departure identity, only a computed cutoff instant. This
        event does not itself contact a customer: it is the trigger, not
        the notification.
      tags:
        - name: order
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/order-management }
              type: { const: com.warehouse.wes.order-management.order.OrderRepromised }
              dataschema: { const: "urn:warehouse:order-management:events:OrderRepromised:v1" }
              data:
                $ref: "#/components/schemas/RepromisedData"
      examples:
        - name: orderRepromised
          summary: A missed CPT pushed the promise to a later cutoff.
          payload:
            specversion: "1.0"
            id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            source: /warehouse/order-management
            type: com.warehouse.wes.order-management.order.OrderRepromised
            subject: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
            time: "2026-09-14T12:00:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:order-management:events:OrderRepromised:v1"
            data:
              order_id: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
              cpt_id_old: sp1-1200
              cpt_id_new: sp1-1800
              reason: TaskCPTMissed

    SiteSkuDemandChangedIntegration:
      name: SiteSkuDemandChanged
      title: Site SKU Demand Changed (integration)
      summary: >-
        One source order line's site/SKU demand became ACTIVE or REMOVED —
        the PII-free demand projection for site-level planning (ADR 0035).
      description: >-
        Raised inside the same order-save/outbox transaction as the
        allocation, re-allocation, re-promise, or cancellation that
        produced the line state, derived purely from the Order aggregate's
        line (SKU, quantity) plus the explicitly versioned static
        demand-site scope configured for the deployment
        (`DEMAND_PROJECTION_SITE_ID`, assignment_version
        `static-site-v1`). The site is application configuration, never an
        Order field, and Phase-1 performs no dynamic assignment. subject
        and the Kafka key are `<source_order_id>/line/<line_no>` — the
        LINE is the stream identity here, so one line's demand history is
        totally ordered on its own partition (deliberately not the bare
        order id every Order* event uses). `due_at` is the line's own
        promise-group cutoff (ADR 0017) where one is recorded, else the
        order-level promise date. `demanded_units` is the line quantity;
        `state` is `ACTIVE` (create / allocate / re-promise) or `REMOVED`
        (cancellation). No customer PII ever appears on this event.
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/order-management }
              type: { const: com.warehouse.wes.order-management.siteskudemand.SiteSkuDemandChanged }
              dataschema: { const: "urn:warehouse:order-management:events:SiteSkuDemandChanged:v1" }
              subject:
                type: string
                pattern: '^.+/line/[1-9][0-9]*$'
                examples: ["ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2/line/3"]
              data:
                $ref: "#/components/schemas/SiteSkuDemandData"
      examples:
        - name: siteSkuDemandChangedActive
          summary: A line's demand becomes ACTIVE at the configured site.
          payload:
            specversion: "1.0"
            id: 7c2d9e1f-3a4b-4c5d-8e9f-0a1b2c3d4e5f
            source: /warehouse/order-management
            type: com.warehouse.wes.order-management.siteskudemand.SiteSkuDemandChanged
            subject: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2/line/3
            time: "2026-10-06T12:00:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:order-management:events:SiteSkuDemandChanged:v1"
            data:
              source_order_id: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
              line_no: 3
              site_id: SIM1
              sku: SKU-TOY-0042
              demanded_units: 7
              due_at: "2026-10-08T18:00:00Z"
              state: ACTIVE
              assignment_version: static-site-v1
        - name: siteSkuDemandChangedRemoved
          summary: Cancellation removes a line's demand at the site.
          payload:
            specversion: "1.0"
            id: 8d3e0f2a-4b5c-4d6e-9f0a-1b2c3d4e5f6a
            source: /warehouse/order-management
            type: com.warehouse.wes.order-management.siteskudemand.SiteSkuDemandChanged
            subject: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2/line/3
            time: "2026-10-06T15:30:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:order-management:events:SiteSkuDemandChanged:v1"
            data:
              source_order_id: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
              line_no: 3
              site_id: SIM1
