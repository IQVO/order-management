      description: >-
        Published on the analytics topic since ADR 0019, closing a gap
        left when ADR 0018 shipped the RepromiseOrder consumer: this
        event was raised on the integration topic
        (warehouse.order-management.events) but never reached the
        analytics publisher's marshalData switch. Deliberately carries
        NO path_id, unlike every other analytics message on this
        channel — OrderRepromised itself has no process-path dimension
        in its domain event, and this data product tracks the
        re-promise-rate KPI fleet-wide rather than adding an OrderRepo
        lookup for a dimension nothing asked for (see ADR 0019's
        Decision §2 for the full reasoning). cpt_id_old/cpt_id_new are
        both omitempty for a LeadTime-basis promise on that side, same
        as the integration-topic message.
