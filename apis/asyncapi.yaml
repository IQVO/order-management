            properties:
              source: { const: /warehouse/order-management }
              type: { const: com.warehouse.wes.order-management.order.OrderRepromised }
              dataschema: { const: "urn:warehouse:order-management:analytics:OrderRepromised:v1" }
              data:
                $ref: "#/components/schemas/OrderRepromisedAnalyticsData"
