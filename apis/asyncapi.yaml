              type: { const: com.warehouse.wes.work-planning.workpool.PathCapacityChanged }
              dataschema: { const: "urn:warehouse:wes-work-planning:events:PathCapacityChanged:v1" }
              data:
                $ref: "#/components/schemas/PathCapacityData"

    CapacityPlanCreatedInbound:
      name: CapacityPlanCreated
      title: CapacityPlanCreated (inbound, warehouse-planning)
      summary: "A DRAFT capacity plan exists (stored as DRAFT; never influences an order)."
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/warehouse-planning }
              type: { const: com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated }
              dataschema: { const: "urn:warehouse:warehouse-planning:events:CapacityPlanCreated:v1" }
              data:
                $ref: "#/components/schemas/CapacityPlanData"

    CapacityPlanPublishedInbound:
      name: CapacityPlanPublished
      title: CapacityPlanPublished (inbound, warehouse-planning)
      summary: A capacity plan was published (stored as PUBLISHED).
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/warehouse-planning }
              type: { const: com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished }
              dataschema: { const: "urn:warehouse:warehouse-planning:events:CapacityPlanPublished:v1" }
              data:
                $ref: "#/components/schemas/CapacityPlanData"

    CapacityShortageDetectedInbound:
      name: CapacityShortageDetected
      title: CapacityShortageDetected (inbound, warehouse-planning)
      summary: "A published plan's demand exceeds its capacity over the window (stored as PUBLISHED with its shortage)."
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/warehouse-planning }
              type: { const: com.warehouse.wes.warehouse-planning.capacityplan.CapacityShortageDetected }
              dataschema: { const: "urn:warehouse:warehouse-planning:events:CapacityShortageDetected:v1" }
              data:
                $ref: "#/components/schemas/CapacityPlanData"

    BottleneckDetectedInbound:
      name: BottleneckDetected
      title: BottleneckDetected (inbound, warehouse-planning)
      summary: "The path step limiting a plan with a shortage (recognised and ignored: CapacityShortageDetected carries bottleneck_step)."
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/warehouse-planning }
              type: { const: com.warehouse.wes.warehouse-planning.capacityplan.BottleneckDetected }
              dataschema: { const: "urn:warehouse:warehouse-planning:events:BottleneckDetected:v1" }
              data:
                $ref: "#/components/schemas/BottleneckData"

    ProductClassifiedInbound:
      name: ProductClassified
      title: ProductClassified (inbound, product-master)
      summary: "A product's handling classification was set or replaced (full state; applied when version > stored)."
      description: >-
        Consumed from warehouse.product-master.events (ADR 0036). Subject and
        Kafka key = the SKU. Full-state replacement of the classification;
        `temperature_class` and `dot_hazard_class` are omitted when unset.
        Tags come in product-master's stable order (Hazmat, Fragile,
        TemperatureSensitive, Oversized, HighValue). There is no
        "unclassify" event in v1.
      tags:
        - name: order-management
      traits:
        - $ref: "#/components/messageTraits/CloudEventsStructured"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              source: { const: /warehouse/product-master }
              type: { const: com.warehouse.wms.product-master.product.ProductClassified }
              dataschema: { const: "urn:warehouse:product-master:events:ProductClassified:v1" }
              data:
                $ref: "#/components/schemas/ProductClassifiedData"
      examples:
        - name: hazmatFrozen
          summary: SKU-1 classified Hazmat + TemperatureSensitive (Frozen), DOT class 3.
          payload:
            specversion: "1.0"
            id: 0f6d8a2b-3c4e-4d5f-8a9b-7c6d5e4f3a2b
            source: /warehouse/product-master
            type: com.warehouse.wms.product-master.product.ProductClassified
            subject: SKU-1
            time: "2026-10-06T21:02:00Z"
            datacontenttype: application/json
            dataschema: "urn:warehouse:product-master:events:ProductClassified:v1"
            data:
              sku: SKU-1
              handling_tags: [Hazmat, TemperatureSensitive]
              temperature_class: Frozen
              dot_hazard_class: 3
              classification_source: native
              version: 3

  messageTraits:
    CloudEventsStructured:
      contentType: application/cloudevents+json
      headers:
        type: object
        required: [content-type]
        properties:
          content-type:
            type: string
            const: "application/cloudevents+json; charset=UTF-8"
          traceparent:
            type: string
            description: W3C trace context of the producing span.
          tracestate:
            type: string
      bindings:
        kafka:
          key:
            type: string
            description: The aggregate id (also the CloudEvents subject); Hash-partitioned.

  schemas:
    CloudEvent:
      type: object
      description: >-
        CloudEvents 1.0 structured-mode event (JSON event format), the ONLY
        envelope on every channel this service produces or consumes (ADR
        0030, fleet standard). Every attribute below is REQUIRED in this
        fleet. Kafka header `content-type` is
        `application/cloudevents+json; charset=UTF-8`; W3C trace context
        stays in the `traceparent`/`tracestate` headers. Consumers dispatch
        on the FULL `type`, ignore unknown types, and dedupe on `id`.
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
          description: >-
            Minted once per domain event and persisted with the outbox row,
            so a redelivery carries the same id. `(source, id)` is the
            consumer idempotency key.
        source:
          type: string
          format: uri-reference
          description: /warehouse/<repo-name>, e.g. /warehouse/order-management.
        type:
          type: string
          pattern: '^com\.warehouse\.[a-z]+\.[a-z-]+\.[a-z]+\.[A-Z][A-Za-z]+(\.v[0-9]+)?$'
          description: com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>
        subject:
          type: string
          minLength: 1
          description: Id of the aggregate instance the event is about (order id for every event this service publishes).
        time:
          type: string
          format: date-time
          description: The domain event's occurred-at instant, UTC, RFC 3339.
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          format: uri
          description: urn:warehouse:<repo-name>:<events|analytics>:<EventName>:v<N>
        data:
          type: object
          description: The event payload — see each message's own data schema.
    RepromisedData:
      type: object
      description: >-
        The `data` payload shape for OrderRepromised (ADR 0014 §5 / ADR
        0018). cpt_id_old/cpt_id_new are both omitempty for a
        LeadTime-basis promise on that side.
      additionalProperties: false
      required: [order_id, reason]
      properties:
        order_id:
          type: string
          pattern: '^ord-[0-9a-f-]{36}$'
        cpt_id_old:
          type: string
          description: The CPT identity the affected group targeted BEFORE the recompute. Absent for a LeadTime-basis previous promise.
        cpt_id_new:
          type: string
          description: The CPT identity the affected group targets AFTER the recompute. Absent for a LeadTime-basis new promise.
        reason:
          type: string
          enum: [TaskCPTMissed, PackageManifested]
          description: The name of the fulfillment-execution event that triggered this recompute (the last segment of its CloudEvents type).

    SiteSkuDemandData:
      type: object
      description: >-
        The `data` payload shape for SiteSkuDemandChanged (ADR 0035): a
        PII-free snapshot of one source order line's demand at the
        explicitly configured static site. Deliberately does NOT reuse
        the frozen allocationData shape shared with wes-work-planning —
        this is a new, additive consumer contract.
      additionalProperties: false
      required: [source_order_id, line_no, site_id, sku, demanded_units, due_at, state, assignment_version]
      properties:
        source_order_id:
          type: string
          pattern: '^ord-[0-9a-f-]{36}$'
          description: The order whose line this demand derives from.
        line_no:
          type: integer
          minimum: 1
          description: The 1-based line number within the source order.
        site_id:
          type: string
          description: The static demand site this deployment projects every line to (`DEMAND_PROJECTION_SITE_ID`) — application configuration, never an Order field.
        sku:
          type: string
          description: The line's SKU. No product attributes, no customer data.
        demanded_units:
          type: integer
          minimum: 1
          description: The line's quantity.
        due_at:
          type: string
          format: date-time
          description: The line's own promise-group cutoff (ADR 0017) where one is recorded, else the order-level promise date. RFC 3339, UTC.
        state:
          type: string
          enum: [ACTIVE, REMOVED]
          description: ACTIVE — the line's demand exists at the site (create / allocate / re-promise). REMOVED — cancellation took it away.
        assignment_version:
          type: string
          enum: [static-site-v1]
          description: The assignment regime that produced this fact. Phase-1 is the static `static-site-v1`; dynamic assignment must introduce a NEW value, never change this one's meaning.


    TaskCPTMissedData:
      type: object
      description: >-
        fulfillment-execution's real, shipped TaskCPTMissed payload
        (its own ADR 0025 §7) — decoded independently here, never
        imported.
      additionalProperties: false
      required: [task_id, order_ref, cpt]
      properties:
        task_id: { type: string }
        order_ref:
          type: string
          description: A WorkUnitId-shaped reference (`{orderId}-line-{lineNo}`), NOT a bare OrderId.
        task_type: { type: string, enum: [PICK, PACK, SLAM, REBIN] }
        cpt: { type: string, format: date-time }

    PackageManifestedData:
      type: object
      description: >-
        fulfillment-execution's real, shipped PackageManifested payload
        (its own ADR 0025 §7) — decoded independently here, never
        imported.
      additionalProperties: false
      required: [package_id, order_ref]
      properties:
        package_id: { type: string }
        order_ref:
          type: string
          description: A WorkUnitId-shaped reference (`{orderId}-line-{lineNo}`), NOT a bare OrderId.

    AllocationData:
      type: object
      description: >-
        Frozen wire shape shared verbatim with wes-work-planning's Kafka
        consumer (see CLAUDE.md's Kafka integration section).
        promise_cpt_id/promise_basis are ADR 0014's additive fields (the
        CPT identity a Capability-basis promise targets, and which
        policy produced the promise) -- optional, since a LeadTime-basis
        promise has no CPT identity and older consumers may ignore both.
      additionalProperties: false
      required: [order_id, promise_date, lines]
      properties:
        order_id:
          type: string
          pattern: '^ord-[0-9a-f-]{36}$'
          description: The OrderId this context owns and mints.
        promise_date:
          type: string
          format: date-time
          description: >-
            The promise's cutoff instant. Computed by order.PromisePolicy
            (ADR 0014): a real CPT window's cutoff when promise_basis is
            "Capability", or the per-path lead-time policy's computed
            instant when promise_basis is "LeadTime" (or absent, for
            events predating ADR 0014).
        promise_cpt_id:
          type: string
          description: >-
            The CPT identity (e.g. "sp1-1800") this promise targets.
            Present only when promise_basis is "Capability" -- a
            LeadTime-basis promise has no departure identity.
        promise_basis:
          type: string
          enum: [Capability, LeadTime, Network]
          description: >-
            Which policy produced promise_date (ADR 0014). "Network"
            (ADR 0020) means the date was DICTATED by an external
            party's deadline (requiredShipBy) rather than chosen by this
            service, and is a separate bucket in the analytics promise-
            basis distribution (ADR 0019). Absent on events published
            before this ADR.
        lines:
          type: array
          description: Exactly the lines released in this pass (may be empty).
          items:
            $ref: "#/components/schemas/ReleasedLine"

    ReleasedLine:
      type: object
      additionalProperties: false
      required: [line_no, sku, path_id, gift_wrap, fulfillment_class]
      properties:
        line_no:
          type: integer
          minimum: 1
        sku:
          type: string
        path_id:
          type: string
          description: The process path the line was released onto (default "pick").
        gift_wrap:
          type: boolean
        fulfillment_class:
          type: string
          enum: [SINGLE, SAME_SKU_MULTI, MULTI_LINE_MULTI]
          description: Classifies the whole order (ADR 0008); additive field.
        promise_cpt_id:
          type: string
          description: >-
            ADR 0017's additive per-line promise field: the CPT identity
            (e.g. "sp1-1200") the PromiseGroup this line belongs to
            targets. Present only when that group's basis is
            "Capability" and the group has a CPT identity. Absent when
            the order's promise has no per-group breakdown to attribute
            this line to (a promise set via the legacy, pre-ADR-0017
            single-Promise path). Older consumers can safely ignore it.
        promise_basis:
          type: string
          enum: [Capability, LeadTime, Network]
          description: >-
            ADR 0017's additive per-line promise field: which policy
            produced the PromiseGroup this line belongs to. Absent under
            the same condition as promise_cpt_id.
        promise_cutoff_at:
          type: string
          format: date-time
          description: >-
            ADR 0017's additive per-line promise field: the cutoff
            instant of the PromiseGroup this line belongs to -- may
            differ from the order-level promise_date on a
            partial-shipment order whose lines split across multiple
            groups (promise_date is always the LATEST group's cutoff;
            an individual line's own group may cut off earlier). Absent
            under the same condition as promise_cpt_id.

    OrderReceivedAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, path_id, line_count]
      properties:
        order_id: { type: string }
        path_id: { type: string }
        line_count: { type: integer, minimum: 1 }

    OrderAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, path_id]
      properties:
        order_id: { type: string }
        path_id: { type: string }
        promise_basis:
          type: string
          enum: [Capability, LeadTime, Network]
          description: >-
            ADR 0014 §6 / ADR 0019's additive promise-basis-
            distribution field, mirrored from the OrderAllocated
            domain event's own promise_basis. Absent on events
            published before this ADR, or when the underlying
            promise had no basis recorded.
        promise_cutoff_at:
          type: string
          format: date-time
          description: >-
            ADR 0014 §6 / ADR 0019's additive promise-to-cutoff-gap
            source field: the promise's cutoff instant. Present
            ONLY when promise_basis is "Capability" — a
            LeadTime-basis promise's "cutoff" is just
            now-plus-a-configured-duration, not a real departure,
            and is deliberately excluded from the gap KPI.
        split_shipment:
          type: boolean
          description: >-
            ADR 0014 §6 / ADR 0019's additive split-shipment-rate
            source field: true when the order had more than one
            order.PromiseGroup at allocation time (ADR 0014 §3 /
            ADR 0017), derived via an OrderRepo lookup at publish
            time.

    OrderLineAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, line_no, path_id, sku]
      properties:
        order_id: { type: string }
        line_no: { type: integer, minimum: 1 }
        path_id: { type: string }
        sku: { type: string }

    OrderLineReleasedAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, line_no, path_id, work_unit_id]
      properties:
        order_id: { type: string }
        line_no: { type: integer, minimum: 1 }
        path_id: { type: string }
        work_unit_id:
          type: string
          description: '{order_id}-line-{line_no} — deterministic, derived by BOTH sides.'

    OrderPartiallyAllocatedAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, path_id, allocated_lines, backordered_lines]
      properties:
        order_id: { type: string }
        path_id: { type: string }
        allocated_lines: { type: integer, minimum: 0 }
        backordered_lines: { type: integer, minimum: 0 }
        promise_basis:
          type: string
          enum: [Capability, LeadTime, Network]
          description: Same ADR 0014 §6 / ADR 0019 field as OrderAnalyticsEvent's.
        promise_cutoff_at:
          type: string
          format: date-time
          description: Same ADR 0014 §6 / ADR 0019 field as OrderAnalyticsEvent's.
        split_shipment:
          type: boolean
          description: Same ADR 0014 §6 / ADR 0019 field as OrderAnalyticsEvent's.

    OrderAllocationPartiallyFailedAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, path_id, allocated_lines, remaining_lines]
      properties:
        order_id: { type: string }
        path_id: { type: string }
        allocated_lines: { type: integer, minimum: 0 }
        remaining_lines: { type: integer, minimum: 0 }

    OrderCancelledAnalyticsData:
      type: object
      additionalProperties: false
      required: [order_id, path_id, revoked_reservations]
      properties:
        order_id: { type: string }
        path_id: { type: string }
        revoked_reservations: { type: integer, minimum: 0 }

    OrderRepromisedAnalyticsData:
      type: object
      description: >-
        Deliberately has NO path_id property, unlike every other
        analytics event's data object on this channel — see
        OrderRepromisedAnalytics' own description for why (ADR
        0014 §6 / ADR 0019).
      additionalProperties: false
      required: [order_id, reason]
      properties:
        order_id: { type: string }
        cpt_id_old:
          type: string
          description: The CPT identity the affected group targeted BEFORE the recompute. Absent for a LeadTime-basis previous promise.
        cpt_id_new:
          type: string
          description: The CPT identity the affected group targets AFTER the recompute. Absent for a LeadTime-basis new promise.
        reason:
          type: string
          enum: [TaskCPTMissed, PackageManifested]
          description: The name of the fulfillment-execution event that triggered this recompute (the last segment of its CloudEvents type).

    ProcessPathData:
      type: object
      description: >-
        process-path-management's ProcessPath* payload, decoded
        independently here (only the fields this service reads).
        eligibility is absent on ProcessPathDeactivated.
      required: [path_id]
      properties:
        path_id: { type: string }
        match_prefix: { type: string }
        cycle_time_p95: { type: string, description: "Go time.Duration string, e.g. 45m0s." }
        eligibility:
          type: object
          properties:
            max_units_per_line: { type: integer }
            required_product_attributes: { type: array, items: { type: string } }
            excluded_product_attributes: { type: array, items: { type: string } }
            non_sortable: { type: boolean }
        destination_location_role: { type: string }

    CPTScheduleData:
      type: object
      description: Full per-site CPT schedule snapshot (replaces the site's prior schedule).
      required: [site_id, timezone, cutoffs]
      properties:
        site_id: { type: string }
        timezone: { type: string }
        cutoffs:
          type: array
          items:
            type: object
            required: [cpt_id, local_time]
            properties:
              cpt_id: { type: string }
              local_time: { type: string, description: "HH:MM in the site timezone." }
              days_of_week: { type: array, items: { type: string } }
              ship_method: { type: string }
              eligible_path_ids: { type: array, items: { type: string } }

    PathCapacityData:
      type: object
      description: wes-work-planning's PathCapacityChanged payload (ADR 0015).
      required: [path_id, cutoff_at, remaining_units, known]
      properties:
        path_id: { type: string }
        cutoff_at: { type: string, format: date-time }
        remaining_units: { type: integer }
        known: { type: boolean }
    CapacityPlanData:
      type: object
      description: >-
        The fields order-management reads from warehouse-planning's
        CapacityPlanCreated / CapacityPlanPublished / CapacityShortageDetected
        payloads (its own apis/asyncapi.yaml; extra fields such as
        path_capacity, status and published_at are ignored). Quantities are
        orders; times are RFC 3339 UTC; window_end is exclusive.
      required: [plan_id, location, window_start, window_end, shortage]
      properties:
        plan_id: { type: string, description: "The CapacityPlan id; equals the CloudEvents subject." }
        warehouse_id: { type: string }
        location: { type: string, description: "Site/building code, e.g. SIM1." }
        path_id: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        assigned_demand: { type: number, format: double }
        capacity_over_window: { type: number, format: double }
        shortage: { type: number, format: double, minimum: 0 }
        bottleneck_step: { type: string }
    BottleneckData:
      type: object
      description: warehouse-planning's BottleneckDetected payload (recognised, not applied).
      properties:
        plan_id: { type: string }
        bottleneck_step: { type: string }
        path_capacity: { type: number, format: double }
    ProductClassifiedData:
      type: object
      description: >-
        product-master's ProductClassified payload (its apis/asyncapi.yaml,
        ADR 0004 there). order-management stores sku, handling_tags,
        temperature_class, dot_hazard_class and version;
        classification_source is decoded and ignored. A payload with an
        empty sku, a version below 1, or a sku that disagrees with the
        CloudEvents subject is skipped.
      required: [sku, handling_tags, classification_source, version]
      properties:
        sku: { type: string, description: "Equals the CloudEvents subject." }
        handling_tags:
          type: array
          items:
            type: string
            enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]
        temperature_class: { type: string, enum: [Ambient, Chilled, Frozen] }
        dot_hazard_class: { type: integer, minimum: 1, maximum: 9 }
        classification_source: { type: string, enum: [native, legacy-import] }
        version: { type: integer, format: int64, minimum: 1, description: "product-master's aggregate version after the change; applied only when greater than the stored one." }
