                  process_type: "PICK"
                - path_id: "REBIN"
                  process_type: "REBIN"
                - path_id: "PACK"
                  process_type: "PACK"
              status: "ACTIVE"
              version: 2

    ProcessFlowRetired:
      name: ProcessFlowRetired
      title: Process flow retired (consumed)
      summary: process-path-management retired a process flow.
      description: |
        CONSUMED from `warehouse.process-path-management.events`. The FULL state with status RETIRED
        at the next version. A RETIRED flow does not resolve a path id: the locally declared path of
