    ShiftPlanCommitted:
      name: ShiftPlanCommitted
      title: Shift plan committed (consumed)
      summary: workforce-management committed a headcount split for a path.
      description: |
        CONSUMED from `warehouse.workforce.events` (producer: workforce-management;
        one message per PathPlan line). Becomes a LABOR `CapacityConstraint` on the
        ProcessCapacity of ProcessType = upper-case(`path_id`), location =
        `site_code`, or the deprecated `building_id` when `site_code` is absent
        (ADR 0021): rate = `planned_heads * planned_rate` (UNIT/HOUR), window =
        `[time, time + planned_hours)`. Deduped on the CloudEvents `id`.
        A line with a `shift_id` then records its committed heads (`planned_heads`)
        for (site, `shift_id`, `path_id`) and, when a labour plan exists for that key
        and the drift is news, raises `LabourPlanDriftDetected`, in the same unit of
        work as the claim and the LABOR constraint (ADR 0023 decision 3). `path_id` is
        matched case-insensitively: the committed heads are keyed on its canonical
        form (trimmed, upper case), the form the labour plan is keyed on, so a line
        for `pack` meets the plan PUT as `PACK`. A line without `shift_id` records no
        committed heads.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/ShiftPlanCommittedEvent"
      examples:
        - name: packLine
          summary: One fanned-out line of a plan committed for site BLD1.
