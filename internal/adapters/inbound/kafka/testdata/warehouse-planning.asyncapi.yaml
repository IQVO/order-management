        Fields this service reads from dock-scheduling's DockAppointmentBooked `data`
        (hand-mirrored, never imported). door_code, carrier, carrier_scac, cpt_id,
        shipment_refs, expected_seal_number and provenance are ignored.
      required: [appointment_id, site_id, direction, window_start, window_end, asn_numbers, version]
      properties:
        appointment_id:
          type: string
          description: Must equal the CloudEvents `subject`.
        site_id:
          type: string
          description: The facility-layout siteCode the demand is attributed to.
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
          description: Only INBOUND appointments are demand.
        window_start:
          type: string
          format: date-time
          description: Door window start; the window predicate (ADR 0003) is applied to it.
        window_end:
          type: string
          format: date-time
          description: Must be after window_start.
        asn_numbers:
          type: array
          description: >-
            Only its length is read (the ASN count that `minutes_per_asn` multiplies); at least
            one for an INBOUND booking, empty for an OUTBOUND one.
          items:
            type: string
        version:
          type: integer
          minimum: 1
          description: The aggregate version; the ordering key.
