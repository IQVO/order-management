              window_end: "2026-10-09T10:00:00Z"
              version: 2

    TaskCompleted:
      name: TaskCompleted
      title: Task completed (consumed)
      summary: fulfillment-execution reports that a station completed a task.
      description: |
        CONSUMED from `warehouse.fulfillment.events` (producer: fulfillment-execution, its own
        `apis/asyncapi.yaml`). Adds the completion to the local `observed_capacity` read model:
        one row per (location, process_type = upper-cased `data.task_type`, minute of the
        CloudEvents `time`) with the task count and the duration total. Site = the configured
        `DEMAND_SITE_ID`. The idempotency claim on the CloudEvents `id` and the additive upsert
        commit in ONE transaction, so a redelivered `id` adds nothing. A completion without
        `task_type` or `task_id` is dead-lettered. Only the fields below are read; the
        enrichment fields fulfillment-execution adds (`work_unit_id`, `associate_id`,
        relocation fields) are ignored. `type` =
        `com.warehouse.wes.fulfillment-execution.task.TaskCompleted`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/TaskCompletedEvent"
      examples:
        - name: pickCompleted
          summary: A PICK task completed after 245 s.
          payload:
            specversion: "1.0"
            id: "a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
            source: "/warehouse/fulfillment-execution"
            type: "com.warehouse.wes.fulfillment-execution.task.TaskCompleted"
            subject: "task-7c9e6679"
            time: "2026-10-05T09:14:30Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:fulfillment-execution:events:TaskCompleted:v1"
            data:
              task_id: "task-7c9e6679"
              task_type: "PICK"
              duration_seconds: 245

    LaborStandardDefined:
      name: LaborStandardDefined
      title: Labour standard defined (consumed)
      summary: labor-performance defined an engineered labour standard for a task type.
      description: |
        CONSUMED from `warehouse.labor-performance.events` (producer: labor-performance, its own
        `apis/asyncapi.yaml`, ADR 0038: the same payload as its analytics copy). Recorded in the
        local `labor_standards` copy under `standard_id`; `as_of` = the CloudEvents `time`.
        `site_code` absent = every site. A standard with a `handling_unit` is stored but not
        used to price a plan (plan demand has no handling-unit split). `type` =
        `com.warehouse.wes.labor-performance.standard.LaborStandardDefined`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/LaborStandardDefinedEvent"
      examples:
        - name: packStandardDefined
          summary: A fleet-wide PACK standard of 90 s per task.
          payload:
            specversion: "1.0"
            id: "4d1f6a3e-2b7c-4c5d-9e8f-1a2b3c4d5e6f"
            source: "/warehouse/labor-performance"
            type: "com.warehouse.wes.labor-performance.standard.LaborStandardDefined"
            subject: "std-pack-1"
            time: "2026-10-01T00:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:labor-performance:events:LaborStandardDefined:v1"
            data:
              standard_id: "std-pack-1"
              task_type: "PACK"
              expected_seconds: 90
              travel_component_seconds: 15
              effective_from: "2026-10-01T00:00:00Z"

    LaborStandardRevised:
      name: LaborStandardRevised
      title: Labour standard revised (consumed)
      summary: labor-performance revised a labour standard (a new record under a new standard_id).
      description: |
        CONSUMED from `warehouse.labor-performance.events`. A revision closes the prior record in
        labor-performance and opens a new one, so it is recorded like a definition: a new row,
        and the latest `effective_from` before a plan's window start is the standard in force.
        `previous_expected_seconds` and the team-lift fields are ignored. `type` =
        `com.warehouse.wes.labor-performance.standard.LaborStandardRevised`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/LaborStandardRevisedEvent"
      examples:
        - name: pickStandardRevisedForASite
          summary: SIM1's own PICK standard revised to 12 s per task.
          payload:
            specversion: "1.0"
            id: "8a7b6c5d-4e3f-4a2b-9c1d-0e9f8a7b6c5d"
            source: "/warehouse/labor-performance"
            type: "com.warehouse.wes.labor-performance.standard.LaborStandardRevised"
            subject: "std-pick-sim1-2"
            time: "2026-10-02T06:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:labor-performance:events:LaborStandardRevised:v1"
            data:
              standard_id: "std-pick-sim1-2"
              task_type: "PICK"
              expected_seconds: 12
              previous_expected_seconds: 14
              site_code: "SIM1"
              effective_from: "2026-10-02T06:00:00Z"

    ProcessFlowDefined:
      name: ProcessFlowDefined
      title: Process flow defined (consumed)
      summary: process-path-management defined a process flow (version 1).
      description: |
        CONSUMED from `warehouse.process-path-management.events` (producer: process-path-management,
        its own `apis/asyncapi.yaml`, ADR 0042). The FULL state of the flow at its version; applied to
        the local `process_flows` copy only when `version` is greater than the stored one (a first
        message for an unknown flow is stored). `type` =
        `com.warehouse.wes.process-path-management.processflow.ProcessFlowDefined`, `subject` and Kafka
        key = `flow_id`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/ProcessFlowDefinedEvent"
      examples:
        - name: singleUnitDefined
          summary: The flow single-unit at version 1.
          payload:
            specversion: "1.0"
            id: "7a1e5c32-6b04-4d58-9e3f-2c8d1f0a4b66"
            source: "/warehouse/process-path-management"
            type: "com.warehouse.wes.process-path-management.processflow.ProcessFlowDefined"
            subject: "single-unit"
            time: "2026-11-20T08:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:process-path-management:events:ProcessFlowDefined:v1"
            data:
              flow_id: "single-unit"
              name: "Single unit"
              stages:
                - path_id: "PICK"
                  process_type: "PICK"
                - path_id: "PACK"
                  process_type: "PACK"
              status: "ACTIVE"
              version: 1

    ProcessFlowRevised:
      name: ProcessFlowRevised
      title: Process flow revised (consumed)
      summary: process-path-management revised a process flow, or republished it at its start.
      description: |
        CONSUMED from `warehouse.process-path-management.events`. The FULL new state at the next
        version; also the producer's startup republish of every ACTIVE flow at its CURRENT version,
        which a caught-up copy ignores (equal version) and a fresh one learns. `type` =
        `com.warehouse.wes.process-path-management.processflow.ProcessFlowRevised`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
