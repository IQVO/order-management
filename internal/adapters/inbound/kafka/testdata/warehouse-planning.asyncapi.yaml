    ShiftPlanCommittedData:
      type: object
      description: >-
        Fields this service reads from one fanned-out ShiftPlanCommitted message (one per PathPlan line).
        A message with a blank building_id or path_id is skipped (WARN). The LABOR constraint is
        planned_heads x planned_rate UNIT per HOUR at location building_id for the window
        [CloudEvents time, time + planned_hours); heads, rate and hours are not range-checked here (a
        value the domain rejects is skipped). shift_id is not read.
      required: [building_id, path_id]
      properties:
        building_id:
          type: string
          example: "BLD1"
        shift_id:
          type: string
          example: "SHIFT1"
        path_id:
          type: string
          description: Becomes the ProcessType (upper-cased) of the LABOR constraint.
          example: "pack"
        planned_heads:
          type: integer
          example: 3
        planned_rate:
          type: number
          format: double
          example: 50
        planned_hours:
          type: number
          format: double
          example: 8
    LocationSlotRegisteredData:
      type: object
      description: >-
        Fields this service reads from LocationSlotRegistered. A message with a blank locationCode or
        zoneId, an unrecognized role, a Storage slot with a blank locationType or a WorkCenter slot with no
        activities is skipped (WARN); an already-tallied locationCode is a no-op.
      required: [locationCode, zoneId]
      properties:
        locationCode:
          type: string
          example: "A-01-01"
        zoneId:
          type: string
          example: "ZONE-A"
        locationType:
          type: string
          description: Required (non-blank) when role is Storage or absent; not read for WorkCenter.
          example: "BULK"
        role:
          type: string
          enum: [Storage, WorkCenter]
          description: Storage (default when absent or empty) tallies storage positions per locationType; WorkCenter tallies stations per activity. Any other value is skipped.
          example: "Storage"
        activities:
          type: array
          description: Required (at least one) when role is WorkCenter; each is upper-cased to form the station tally key.
          items:
            type: string
