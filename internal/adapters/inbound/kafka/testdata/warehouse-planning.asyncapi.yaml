asyncapi: 2.6.0

info:
  title: warehouse-planning Domain Events
  version: "0.9.0"
  contact:
    name: warehouse-planning maintainers
    url: https://github.com/IQVO/warehouse-planning
    email: warehouse-planning@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **warehouse-planning** bounded context (WES
    subdomain): *can this warehouse process the demand assigned to it?*

    **Published (Phase 4).** The `CapacityPlan` aggregate raises four events,
    published to `warehouse.warehouse-planning.events` through a
    **transactional outbox**: the plan and its already-encoded events are
    written in ONE database transaction, and a relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is persisted with the outbox row, so
    a retry republishes the same `id` -- consumers dedupe on it). Per plan:
    `CapacityPlanCreated` on creation; on publication
    `CapacityPlanPublished`, plus `CapacityShortageDetected` and
    `BottleneckDetected` only when the plan has a shortage. Publishing a plan
    supersedes the plan published before it for the same site, location,
    path and window (ADR 0024 decision 3): `CapacityPlanSuperseded` of that
    OLDER plan is queued first, in the same transaction.
    The `ProcessCapacity` aggregate publishes on the same topic and the same
    outbox: `ProcessCapacityRegistered` when its first (native) constraint
    brings it into being, `ProcessCapacityChanged` when a registration
    moves the effective rate (the minimum rate value, the binding
    constraint, or both); a registration the effective rate does not notice
    raises nothing. ProcessCapacity events are integration-stream only: the
    analytics fanout carries plan facts only (ADR 0005).

    **Published (ADR 0023).** The workload forecast and the shift labour plan
    moved here from wes-work-planning. `WorkloadForecastReceived` (entity
    `workloadforecast`, key `site_id/path_id`) is raised by every receipt that
    changed a forecast; `LabourPlanCommitted` (entity `labourplan`, key
    `site_id/shift_id/path_id`) by every commit that changed a labour plan,
    carrying every field of the plan (workforce-management keeps a copy and
    applies a message only when its `version` is greater than the stored
    one); `LabourPlanDriftDetected` (same entity and key) when the heads
    workforce-management committed differ from the plan's and the drift is
    new. A PUT that changes nothing raises nothing. All three are written to
    BOTH topics through the same outbox, with the same payload on each.

    **Consumed (Phase 3).** `ShiftPlanCommitted` (workforce-management) and
    `LocationSlotRegistered`/`LocationSlotDecommissioned` (facility-layout) keep
    local ProcessCapacity read models current; this context never makes a
    live cross-context call.

    **Consumed (ADR 0004).** `OrderAllocated` and
    `OrderPartiallyAllocated` (order-management, topic
    `warehouse.order-management.events`) keep a local expected-demand read
    model current under the REQUIRED consumer group `DEMAND_CONSUMER_GROUP`.
    Each order is counted once, at its latest promise cutoff, and attributed to
    the event's own optional `site_id` (order-management ADR 0050), or to the
    configured fallback site (`DEMAND_SITE_ID`) when the event carries none
    (ADR 0021). `OrderRepromised` and every other type are ignored.

    **Consumed (ADR 0017, source switched by ADR 0020).** dock-scheduling's
    `DockAppointmentBooked`, `DockAppointmentRescheduled`,
    `DockAppointmentCancelled` and `DockAppointmentNoShow` (topic
    `warehouse.dock-scheduling.events`, group `DOCK_APPOINTMENT_CONSUMER_GROUP`)
    keep a local inbound-demand read model current: a capacity plan carries the
    INBOUND dock appointments of its window and the labour the operator-declared
    inbound standard attributes to them. Each appointment is attributed to the
    `site_id` of its events; the producer's aggregate `version` orders them (a
    Cancelled that arrives before its Booked wins). inbound-receiving's
    appointment events are NO LONGER consumed, and a deployment that still sets
    `INBOUND_DEMAND_CONSUMER_GROUP` is refused at boot. `TaskCompleted`
    (fulfillment-execution, topic `warehouse.fulfillment.events`, group
    `OBSERVED_CAPACITY_CONSUMER_GROUP`) keeps a local observed-capacity read
    model current that feeds an ADVISORY planned-versus-observed variance; it
    never changes a planned capacity and is attributed to the configured site
    (`DEMAND_SITE_ID`). Both consumers dead-letter unusable payloads to
    `<topic>.dlq`.

    **Consumed (ADR 0022).** labor-performance's `LaborStandardDefined` and
    `LaborStandardRevised` (topic `warehouse.labor-performance.events`, its
    INTEGRATION topic per its ADR 0038; group `LABOR_STANDARD_CONSUMER_GROUP`)
    keep a local copy of the engineered labour standards, one record per
    `standard_id`. A capacity plan prices each step of its path with the
    standard of its task type in force for the plan's site at the window start
    (`labour_requirement`, REST and MCP only: no event this service publishes
    carries it). Every other type on that topic is ignored, the producer's
    analytics topic is never read, and an unusable payload is dead-lettered to
    `warehouse.labor-performance.events.dlq`.

    **Consumed (ADR 0025).** process-path-management's `ProcessFlowDefined`,
    `ProcessFlowRevised` and `ProcessFlowRetired` (topic
    `warehouse.process-path-management.events`, its INTEGRATION topic; group
    `PROCESS_FLOW_CONSUMER_GROUP`) keep a local copy of the process flows, one
    row per `flow_id`. Every message is the FULL state of the flow and carries
    its `version`; it is applied only when its version is greater than the
    stored one, so a redelivery, the producer's startup republish and a
    reordered message are harmless. The path capacity resolves a `path_id` from
    an ACTIVE flow first (its steps are the stages' `process_type` values in
    order) and falls back to the locally declared path; the REST and MCP reads
    of a path carry a read-only `source` (`flow` or `local`). Every other type
    on that topic is ignored, the producer's analytics topic is never read, and
    an unusable payload (an unknown `process_type`, no stages, a bad status or
    version) is dead-lettered to `warehouse.process-path-management.events.dlq`.

    **Analytics stream (ADR 0005).** The same four events are ALSO written to
    `warehouse.warehouse-planning.analytics` in the SAME outbox transaction
    (two outbox rows per event, one per topic), as CloudEvents 1.0 with the
    SAME `type` and the SAME `id` per occurrence but
    `dataschema=urn:warehouse:warehouse-planning:analytics:<EventName>:v1`.
    The three ADR 0023 events get the same analytics copy, with the
    integration payload unchanged; the projector does not project them yet
    (it acknowledges and ignores them).
    The integration messages are byte-identical to what they were before the
    stream existed. The analytics payloads are the integration payloads plus
    additive, analytics-only fields: today `binding_constraint` on
    `CapacityPlanPublished` (the constraint type -- LABOR, STATION, ... --
    binding the bottleneck step; `""` for a plan created before it was
    recorded). Only this service's own `planning-projector` consumes it (fixed
    consumer group, at-least-once, offsets committed after the projection
    committed), into a SEPARATE analytical database that
    `planning-reports` serves read-only. Poison messages go to
    `warehouse.warehouse-planning.analytics.dlq`.

    **Envelope (mandatory).** Every message is a CloudEvents 1.0 event in
    *structured content mode* (Kafka value = JSON event format) with the Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    Optional W3C trace-context headers (`traceparent`, and `tracestate` /
    `baggage` when present) carry the trace of the request that wrote the
    outbox row (ADR 0014); consumers may extract them, and must not require
    them. All of
    `specversion` (`1.0`), `id`, `source` (`/warehouse/warehouse-planning`),
    `type`, `subject`, `time`, `datacontenttype` (`application/json`) and
    `dataschema` are required; the payload sits under `data`. No flat
    envelope, no toggle.

    **Type naming.** `com.warehouse.wes.warehouse-planning.<entity>.<EventName>`
    where `<entity>` is the aggregate that raised the event, lowercase, no
    separators -- `capacityplan`, `processcapacity`, `workloadforecast` or
    `labourplan`. **dataschema** =
    `urn:warehouse:warehouse-planning:events:<EventName>:v1`. **subject** and
    the Kafka message key = the aggregate's id: the capacity plan id,
    `<processType>/<location>/<windowStart>/<windowEnd>` for a
    ProcessCapacity, `<site_id>/<path_id>` for a WorkloadForecast, or
    `<site_id>/<shift_id>/<path_id>` for a LabourPlan (one aggregate's events
    stay ordered on one partition).
    A breaking payload change gets a new `.v2` type and dataschema, never a
    mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: warehouse-planning
    description: The warehouse-planning bounded context (WES subdomain).
  - name: capacity-plan
    description: Events raised by the CapacityPlan aggregate (published, Phase 4).
  - name: process-capacity
    description: Events raised by the ProcessCapacity aggregate on constraint registration (published).
  - name: workload-forecast
    description: Events raised by the WorkloadForecast aggregate (published, ADR 0023).
  - name: labour-plan
    description: Events raised by the LabourPlan aggregate and its drift check (published, ADR 0023).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (Phase 3).
  - name: analytics
    description: "The analytics stream (ADR 0005): the same capacity-plan events on this service's own analytics topic, consumed only by planning-projector."

channels:
  warehouse.warehouse-planning.events:
    description: |
      This service's integration topic (`Topic` in
      `internal/adapters/outbound/kafka/encoder.go`). Written by the outbox
      relay; key = the raising aggregate's id (plan id,
      processType/location/window for a ProcessCapacity, site_id/path_id for a
      WorkloadForecast, site_id/shift_id/path_id for a LabourPlan); every message
      carries the `content-type: application/cloudevents+json; charset=UTF-8`
      header (plus the optional W3C `traceparent` of the writing request,
      ADR 0014). Dispatch on the full `type`, ignore unknown types, dedupe
      on `id`.
    subscribe:
      operationId: receiveWarehousePlanningEvents
      summary: Receive CapacityPlan, ProcessCapacity, WorkloadForecast and LabourPlan events.
      description: |
        Subscribe to this service's event stream. Route on the full `type`:
        `com.warehouse.wes.warehouse-planning.capacityplan.<EventName>` for
        CapacityPlan events,
        `com.warehouse.wes.warehouse-planning.processcapacity.<EventName>`
        for ProcessCapacity events,
        `com.warehouse.wes.warehouse-planning.workloadforecast.<EventName>`
        for WorkloadForecast events and
        `com.warehouse.wes.warehouse-planning.labourplan.<EventName>` for
        LabourPlan events.
      tags:
        - name: capacity-plan
        - name: process-capacity
        - name: workload-forecast
        - name: labour-plan
      message:
        oneOf:
          - $ref: "#/components/messages/CapacityPlanCreated"
          - $ref: "#/components/messages/CapacityPlanPublished"
          - $ref: "#/components/messages/CapacityShortageDetected"
          - $ref: "#/components/messages/BottleneckDetected"
          - $ref: "#/components/messages/CapacityPlanSuperseded"
          - $ref: "#/components/messages/ProcessCapacityRegistered"
          - $ref: "#/components/messages/ProcessCapacityChanged"
          - $ref: "#/components/messages/WorkloadForecastReceived"
          - $ref: "#/components/messages/LabourPlanCommitted"
          - $ref: "#/components/messages/LabourPlanDriftDetected"

  warehouse.warehouse-planning.analytics:
    description: |
      This service's analytics topic (`AnalyticsTopic` in
      `internal/adapters/outbound/kafka/analytics_encoder.go`; ADR 0005). Written by
      the SAME outbox relay, from rows inserted in the same transaction as the
      integration rows; key = the raising aggregate's id, as on the integration
      topic. Consumed ONLY by this service's
      `planning-projector` under a fixed consumer group read from env
      `ANALYTICS_CONSUMER_GROUP` (at-least-once; the offset is committed after the
      projection and the dedupe mark committed together in the analytical database).
      The projector dedupes on `id`, ignores unknown types, skips (with a rate-limited
      WARN) anything that is not CloudEvents 1.0, and dead-letters a known type with an
      unusable payload to `warehouse.warehouse-planning.analytics.dlq` (raw bytes plus
      `x-dlq-*` headers). Not an integration contract: other contexts consume the
      integration topic.
    subscribe:
      operationId: receiveCapacityPlanAnalyticsEvents
      summary: Receive the CapacityPlan, WorkloadForecast and LabourPlan analytics events.
      description: |
        Route on the full `type`; the payloads are the integration payloads plus
        the additive analytics-only fields documented per message (none on the
        WorkloadForecast and LabourPlan copies). The projector folds the four
        CapacityPlan types and acknowledges every other type unprojected
        (CapacityPlanSuperseded included).
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/CapacityPlanCreatedAnalytics"
          - $ref: "#/components/messages/CapacityPlanPublishedAnalytics"
          - $ref: "#/components/messages/CapacityShortageDetectedAnalytics"
          - $ref: "#/components/messages/BottleneckDetectedAnalytics"
          - $ref: "#/components/messages/CapacityPlanSupersededAnalytics"
          - $ref: "#/components/messages/WorkloadForecastReceivedAnalytics"
          - $ref: "#/components/messages/LabourPlanCommittedAnalytics"
          - $ref: "#/components/messages/LabourPlanDriftDetectedAnalytics"

  warehouse.workforce.events:
    description: |
      workforce-management's integration topic (`LaborTopic`). This service
      consumes it with its own consumer group (env `LABOR_CAPACITY_CONSUMER_GROUP`).
      Only `ShiftPlanCommitted` is acted on; every other `type`, a message that is not
      CloudEvents 1.0, or an unusable payload is skipped (WARN) and its offset committed. A
      transient failure is retried up to 5 attempts, then the message is published to
      `warehouse.workforce.events.dlq` (raw bytes plus `x-dlq-*` headers).
    publish:
      operationId: consumeShiftPlanCommitted
      summary: Consume workforce-management's ShiftPlanCommitted.
      description: |
        Consumed by this service: one message per PathPlan line becomes a
        LABOR capacity constraint. Offsets are committed only after the
        effect and its idempotency claim committed atomically.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/ShiftPlanCommitted"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic (`FacilityTopic`). This service
      consumes it with its own consumer group (env `STORAGE_CAPACITY_CONSUMER_GROUP`).
      Only `LocationSlotRegistered` and `LocationSlotDecommissioned` are acted on; every other
      `type`, a message that is not CloudEvents 1.0, or an unusable payload is skipped (WARN)
      and its offset committed. A transient failure is retried up to 5 attempts, then the
      message is published to `warehouse.facility.events.dlq` (raw bytes plus `x-dlq-*` headers).
    publish:
      operationId: consumeLocationSlotEvents
      summary: Consume facility-layout's location slot events.
      description: |
        Consumed by this service: storage positions (per zone + locationType) and
        work-center stations (per zone + activity) are tallied. The consumer only
        maintains that tally -- it registers no ProcessCapacity constraint.
        Station counts are composed with labor and the operator-declared station
        standard at read time, and positions are a read model
        (`GET /storage-capacity`); see docs/adr/0002-station-capacity-composition.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/LocationSlotRegistered"
          - $ref: "#/components/messages/LocationSlotDecommissioned"

  warehouse.order-management.events:
    description: |
      order-management's integration topic (`OrderTopic`). This service consumes
      it with a STABLE consumer group read from env `DEMAND_CONSUMER_GROUP` (REQUIRED,
      no default; ADR 0016). Only
      `OrderAllocated` and `OrderPartiallyAllocated` are acted on; every other
      CloudEvents `type` -- `OrderRepromised` included -- is ignored, and a
      message that is not a valid CloudEvent is skipped (WARN), never blocking
      the partition.
    publish:
      operationId: consumeOrderAllocationEvents
      summary: Consume order-management's order allocation events.
      description: |
        Consumed by this service into a LOCAL expected-demand read model
        (`order_demand`, one row per order id; `GET /demand`,
        `get_expected_demand`, and the default of `POST /capacity-plans`
        `assigned_demand`). An order is demand in a window [start, end) when its
        `promise_date` (the promise cutoff) is at or after start and strictly
        before end. Last writer wins per order id on the CloudEvents `time`
        (a later or equal time replaces, an older one is a no-op). The
        idempotency claim on the CloudEvents `id` and the upsert commit in ONE
        database transaction; the offset is committed only afterwards. order-
        management's events carry no quantities and no cancellations
        (OrderCancelled is analytics-topic only), so demand is counted in
        ORDERS and not netted; see
        docs/adr/0004-demand-ingestion-from-order-management.md. An order is
        attributed to the event's optional `site_id`, or to the configured
        fallback site `DEMAND_SITE_ID` when it carries none
        (docs/adr/0021-order-demand-and-labour-read-the-events-own-site.md).
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/OrderAllocated"
          - $ref: "#/components/messages/OrderPartiallyAllocated"

  warehouse.dock-scheduling.events:
    description: |
      dock-scheduling's integration topic (`DockSchedulingTopic`, key = appointment id for
      appointment events). This service consumes it with a STABLE consumer group read from
      env `DOCK_APPOINTMENT_CONSUMER_GROUP` (REQUIRED, no default; ADR 0016/0020). Only
      `DockAppointmentBooked`, `DockAppointmentRescheduled`, `DockAppointmentCancelled` and
      `DockAppointmentNoShow` are acted on, dispatched on the FULL `type` string; every other
      `type` on the topic (door calendar events, and the retired
      `com.warehouse.wms.inbound-receiving.dockappointment.*` types) is ignored. The
      analytics-only appointment events (checked-in, door reassigned, completed, at risk) are
      published to the producer's analytics topic and never reach this one. A message that is
      not CloudEvents 1.0, or a known type with an unusable payload, is published to
      `warehouse.dock-scheduling.events.dlq` (raw bytes plus `x-dlq-*` headers).

      The previous source, inbound-receiving's `warehouse.inbound-receiving.events` and the
      env `INBOUND_DEMAND_CONSUMER_GROUP`, is retired by ADR 0020: setting that variable is a
      boot error naming `DOCK_APPOINTMENT_CONSUMER_GROUP`.
    publish:
      operationId: consumeDockAppointmentEvents
      summary: Consume dock-scheduling's dock appointment events.
      description: |
        Consumed by this service into a LOCAL inbound-demand read model
        (`inbound_appointments`, one row per appointment id; `GET /inbound-demand`,
        `get_inbound_demand`, the inbound figures on a capacity plan). Only INBOUND
        appointments (`data.direction`) are demand; OUTBOUND ones are stored and never
        counted. An appointment is demand in a window [start, end) when it is BOOKED and its
        door window STARTS at or after start and strictly before end. A Rescheduled moves the
        window; a Cancelled and a NoShow remove the demand (both are terminal on the
        producer). Each appointment is attributed to the `data.site_id` of its events (a
        facility-layout siteCode): there is no configured site on this path.

        Ordering: every event carries the aggregate `data.version` (starts at 1, +1 per
        accepted change). The state (status, window, version) changes only when the event's
        version is GREATER than the stored one, so a redelivery, a duplicate or an older event
        changes nothing. The booking facts only a Booked carries (direction, ASN count) are
        filled in whenever they arrive, so a Cancelled or Rescheduled that arrives before its
        Booked is stored as a partial row (a tombstone) that the Booked then completes
        without resurrecting it or moving the window back. Rows written by the retired
        inbound-receiving source are INBOUND at version 0, so any dock-scheduling event for
        the same appointment id supersedes them.

        The idempotency claim on the CloudEvents `id` and the upsert commit in ONE database
        transaction; the offset is committed only afterwards. This consumer raises no event
        of its own. The labour minutes are NOT in the event: they come from the
        operator-declared inbound labour standard. See
        docs/adr/0017-inbound-labour-demand-and-observed-capacity-feedback.md and
        docs/adr/0020-inbound-demand-from-dock-scheduling.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/DockAppointmentBooked"
          - $ref: "#/components/messages/DockAppointmentRescheduled"
          - $ref: "#/components/messages/DockAppointmentCancelled"
          - $ref: "#/components/messages/DockAppointmentNoShow"

  warehouse.fulfillment.events:
    description: |
      fulfillment-execution's integration topic (`FulfillmentTopic`, key = task id). This
      service consumes it with a STABLE consumer group read from env
      `OBSERVED_CAPACITY_CONSUMER_GROUP` (REQUIRED, no default; ADR 0016/0017). Only
      `TaskCompleted` is acted on; every other `type` is ignored. A message that is not
      CloudEvents 1.0, or a TaskCompleted without `task_id`/`task_type`, is published to
      `warehouse.fulfillment.events.dlq` (raw bytes plus `x-dlq-*` headers).
    publish:
      operationId: consumeTaskCompletedEvents
      summary: Consume fulfillment-execution's TaskCompleted.
      description: |
        Consumed by this service into a LOCAL observed-capacity read model
        (`observed_capacity`, one row per location + process type + minute; additive).
        It feeds the ADVISORY planned-versus-observed variance
        (`GET /capacity-plans/{id}/variance`, `get_capacity_plan_variance`); it never
        changes a planned capacity and never republishes a plan. The idempotency claim on
        the CloudEvents `id` and the upsert commit in ONE transaction, so a redelivered
        event adds nothing. See
        docs/adr/0017-inbound-labour-demand-and-observed-capacity-feedback.md.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/TaskCompleted"

  warehouse.labor-performance.events:
    description: |
      labor-performance's integration topic (`LaborPerformanceTopic`; the standard events are
      keyed by task type, labor-performance ADR 0038). This service consumes it with a STABLE consumer group read from
      env `LABOR_STANDARD_CONSUMER_GROUP` (REQUIRED, no default; ADR 0016/0022). Only the
      full types `com.warehouse.wes.labor-performance.standard.LaborStandardDefined` and
      `...standard.LaborStandardRevised` are acted on; every other `type`
      (`TaskPerformanceRecorded`, ...) is ignored. A message that is not CloudEvents 1.0, or
      a standard without `standard_id`/`task_type`/`effective_from`/event `time`, with
      `expected_seconds <= 0`, a negative `travel_component_seconds` or an unknown
      `handling_unit`, is published to `warehouse.labor-performance.events.dlq` (raw bytes
      plus `x-dlq-*` headers).
    publish:
      operationId: consumeLaborStandardEvents
      summary: Consume labor-performance's LaborStandardDefined / LaborStandardRevised.
      description: |
        Consumed by this service into a LOCAL copy of the engineered labour standards
        (`labor_standards`, one row per `standard_id`; additive). The copy stores facts, not
        a current value: a redelivered or replayed `standard_id` changes nothing, and the
        standard that applies to a plan of site S, task type T and window W is resolved at
        READ time among task-type-only rows (`handling_unit` absent) with
        `effective_from <= W.start`: S's own `site_code` over a site-less row, then the latest
        `effective_from`, then the latest event `time`. The idempotency claim on the
        CloudEvents `id` and the write commit in ONE transaction. See
        docs/adr/0022-labour-standards-from-labor-performance.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/LaborStandardDefined"
          - $ref: "#/components/messages/LaborStandardRevised"

  warehouse.process-path-management.events:
    description: |
      process-path-management's integration topic (`ProcessPathManagementTopic`; the flow events
      are keyed by `flow_id`, its ADR 0042). This service consumes it with a STABLE consumer
      group read from env `PROCESS_FLOW_CONSUMER_GROUP` (REQUIRED, no default; ADR 0016/0025).
      Only the full types `com.warehouse.wes.process-path-management.processflow.ProcessFlowDefined`,
      `...processflow.ProcessFlowRevised` and `...processflow.ProcessFlowRetired` are acted on;
      every other `type` (`ProcessPathCreated`, `ProcessPathUpdated`, `ProcessPathDeactivated`,
      `CPTScheduleChanged`) is acknowledged and ignored. A message that is not CloudEvents 1.0,
      or a flow without `flow_id`, without stages, with a stage without `path_id` or with a
      `process_type` outside PICK, REBIN, PACK, SLAM, DISPATCH, ARRIVAL, RELOCATE, REPLENISH,
      a `status` other than ACTIVE or RETIRED, a `version` below 1 or no event `time`, is
      published to `warehouse.process-path-management.events.dlq` (raw bytes plus `x-dlq-*`
      headers) and never applied.
    publish:
      operationId: consumeProcessFlowEvents
      summary: Consume process-path-management's ProcessFlowDefined / ProcessFlowRevised / ProcessFlowRetired.
      description: |
        Consumed by this service into a LOCAL copy of the process flows (`process_flows`, one
        row per `flow_id`; additive). Each message is the full state of the flow; it is applied
        ONLY when its `version` is greater than the stored one (equal or lower is acknowledged
        and changes nothing; a first message of any of the three types for an unknown flow is
        stored, a Retired one as a RETIRED row). The idempotency claim on the CloudEvents `id`
        and the write commit in ONE transaction. See
        docs/adr/0025-process-flows-from-process-path-management.md.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/ProcessFlowDefined"
          - $ref: "#/components/messages/ProcessFlowRevised"
          - $ref: "#/components/messages/ProcessFlowRetired"

components:
  messages:
    CapacityPlanCreated:
      name: CapacityPlanCreated
      title: Capacity plan created
      summary: A DRAFT CapacityPlan was created with its computed shortage.
      description: |
        Raised by the `CapacityPlan` aggregate on `POST /capacity-plans` and queued
        in the transactional outbox in the same transaction as the plan. `type` =
