      title: Dock appointment cancelled (consumed)
      summary: dock-scheduling cancelled a booked appointment.
      description: |
        CONSUMED from `warehouse.dock-scheduling.events`. Removes the appointment's demand:
        the row flips to CANCELLED and stops counting (terminal on the producer). A Cancelled
        that arrives BEFORE its Booked is stored as a tombstone (no window) that no Booked of
        an older version can resurrect. Idempotent: a redelivered `id` or a version that is not
        greater than the stored one is a no-op. `type` =
        `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentCancelled`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/DockAppointmentCancelledEvent"
      examples:
        - name: cancelled
          summary: Cancelled at the carrier's request.
          payload:
            specversion: "1.0"
            id: "b2c4d6e8-1f3a-4b5c-9d7e-8f0a1b2c3d4e"
