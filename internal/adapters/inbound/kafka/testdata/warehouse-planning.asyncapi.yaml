    ShiftPlanCommittedData:
      type: object
      description: >-
        Fields this service reads from one fanned-out ShiftPlanCommitted message (one per PathPlan line).
        A message with no site (blank site_code and building_id) or a blank path_id is skipped (WARN).
        The LABOR constraint is planned_heads x planned_rate UNIT per HOUR at location site_code (or
        building_id when site_code is absent, ADR 0021) for the window [CloudEvents time, time +
        planned_hours); heads, rate and hours are not range-checked here (a value the domain rejects is
        skipped). A line with a shift_id also records its committed heads for the labour plan drift
        (ADR 0023 decision 3), keyed on (site, shift_id, path_id in upper case).
      required: [path_id]
      properties:
        site_code:
          type: string
          description: The canonical site (workforce-management's site_code); the constraint's location.
          example: "BLD1"
        building_id:
          type: string
          description: DEPRECATED twin of site_code (same value); read only when site_code is absent.
          example: "BLD1"
        shift_id:
          type: string
          description: The shift the committed heads are for; absent or blank records no committed heads.
          example: "SHIFT1"
        path_id:
          type: string
          description: >-
            Case-insensitive. Becomes the ProcessType (upper-cased) of the LABOR constraint and, trimmed
            and upper-cased, the path of the committed heads.
          example: "pack"
        planned_heads:
          type: integer
          example: 3
        planned_rate:
          type: number
          format: double
          example: 50
        planned_hours:
          type: number
          format: double
          example: 8
    LocationSlotRegisteredData:
      type: object
      description: >-
        Fields this service reads from LocationSlotRegistered. A message with a blank locationCode or
        zoneId, an unrecognized role, a Storage slot with a blank locationType or a WorkCenter slot with no
        activities is skipped (WARN); an already-tallied locationCode is a no-op.
      required: [locationCode, zoneId]
      properties:
        locationCode:
          type: string
          example: "A-01-01"
        zoneId:
          type: string
          example: "ZONE-A"
        locationType:
          type: string
          description: Required (non-blank) when role is Storage or absent; not read for WorkCenter.
          example: "BULK"
        role:
          type: string
          enum: [Storage, WorkCenter]
          description: Storage (default when absent or empty) tallies storage positions per locationType; WorkCenter tallies stations per activity. Any other value is skipped.
          example: "Storage"
        activities:
          type: array
          description: Required (at least one) when role is WorkCenter; each is upper-cased to form the station tally key.
          items:
            type: string
    LocationSlotDecommissionedData:
      type: object
      description: Fields this service reads from LocationSlotDecommissioned.
      required: [locationCode]
