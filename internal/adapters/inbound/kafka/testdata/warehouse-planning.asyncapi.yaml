            source: "/warehouse/process-path-management"
            type: "com.warehouse.wes.process-path-management.processflow.ProcessFlowRetired"
            subject: "single-unit"
            time: "2026-11-20T09:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:process-path-management:events:ProcessFlowRetired:v1"
            data:
              flow_id: "single-unit"
              name: "Single unit"
              stages:
                - path_id: "PICK"
                  process_type: "PICK"
                - path_id: "REBIN"
                  process_type: "REBIN"
                - path_id: "PACK"
                  process_type: "PACK"
              status: "RETIRED"
              version: 3

  schemas:
    CloudEventEnvelope:
      type: object
      description: >
        CloudEvents 1.0 structured-mode envelope. Every attribute below is
        required; the context's own payload sits under data.
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: UUID v4, minted once per domain event and persisted with the outbox row, so a redelivery repeats it. Dedupe on it.
        source:
          type: string
          example: "/warehouse/warehouse-planning"
        type:
          type: string
          description: Full reverse-DNS type; dispatch on the whole string.
        subject:
          type: string
          description: Aggregate instance id (never empty).
        time:
          type: string
          format: date-time
          description: Domain occurred-at, UTC.
        datacontenttype:
          type: string
          const: "application/json"
        dataschema:
          type: string
          description: urn:warehouse:<repo>:events:<EventName>:v<N>.
        data:
          type: object
    CapacityPlanCreatedData:
      type: object
      description: Payload of CapacityPlanCreated.
      required:
        - plan_id
        - warehouse_id
        - location
        - path_id
        - window_start
        - window_end
        - assigned_demand
        - path_capacity
        - capacity_over_window
        - shortage
        - bottleneck_step
        - status
      properties:
        plan_id:
          type: string
          description: The CapacityPlan id (UUID); equals the CloudEvents subject.
          example: "0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10"
        warehouse_id:
          type: string
          description: Warehouse the plan is for.
          example: "WH-1"
        location:
          type: string
          description: ProcessCapacity location the plan evaluates.
          example: "PATH-ZONE-A"
        path_id:
          type: string
          description: ProcessPath evaluated.
          example: "pick-rebin-pack"
        window_start:
          type: string
          format: date-time
          description: Planning window start (RFC 3339, UTC).
          example: "2026-10-05T08:00:00Z"
        window_end:
          type: string
          format: date-time
          description: Planning window end, exclusive (RFC 3339, UTC).
          example: "2026-10-05T16:00:00Z"
        assigned_demand:
          type: number
          format: double
          description: Orders assigned to the window.
          example: 12000
        path_capacity:
          type: number
          format: double
          description: Normalized path capacity, ORDER per HOUR.
          example: 1000
    ProcessCapacityRegisteredEvent:
      description: CloudEvents 1.0 envelope of ProcessCapacityRegistered.
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.warehouse-planning.processcapacity.ProcessCapacityRegistered"
            dataschema:
              const: "urn:warehouse:warehouse-planning:events:ProcessCapacityRegistered:v1"
            data:
              $ref: "#/components/schemas/ProcessCapacityRegisteredData"
    ProcessCapacityRegisteredData:
      type: object
      description: Payload of ProcessCapacityRegistered -- the native constraint that created the aggregate.
      required:
        - process_type
        - location
        - window_start
        - window_end
        - constraint_type
        - quantity
        - unit
        - period_seconds
      properties:
        process_type:
          type: string
          description: The warehouse process (PICK, PACK, REBIN, ...).
          example: "PICK"
        location:
          type: string
          description: ProcessCapacity location.
          example: "PATH-ZONE-A"
        window_start:
          type: string
          format: date-time
          description: Capacity window start (RFC 3339, UTC).
          example: "2026-10-05T08:00:00Z"
        window_end:
          type: string
          format: date-time
          description: Capacity window end, exclusive (RFC 3339, UTC).
          example: "2026-10-05T09:00:00Z"
        constraint_type:
          type: string
          description: "The native constraint type (LABOR, LOCATION, EQUIPMENT, STATION, CONVEYOR, BUFFER, REPLENISHMENT)."
          example: "LABOR"
        quantity:
          type: number
          format: double
          description: The constraint's rate quantity; also the effective rate at registration.
          example: 4000
        unit:
          type: string
          description: "The aggregate's native unit (UNIT, LINE, ORDER, PACKAGE)."
          example: "UNIT"
        period_seconds:
          type: number
          format: double
          description: The rate's time base in seconds.
          example: 3600
    ProcessCapacityChangedEvent:
      description: CloudEvents 1.0 envelope of ProcessCapacityChanged.
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.warehouse-planning.processcapacity.ProcessCapacityChanged"
            dataschema:
              const: "urn:warehouse:warehouse-planning:events:ProcessCapacityChanged:v1"
            data:
              $ref: "#/components/schemas/ProcessCapacityChangedData"
    ProcessCapacityChangedData:
      type: object
      description: Payload of ProcessCapacityChanged -- the effective rate before and after the causing registration.
      required:
        - process_type
        - location
        - window_start
        - window_end
        - constraint_type
        - previous_quantity
        - previous_unit
        - previous_period_seconds
        - previous_binding_constraint
        - effective_quantity
        - effective_unit
        - effective_period_seconds
        - effective_binding_constraint
      properties:
        process_type:
          type: string
          description: The warehouse process (PICK, PACK, REBIN, ...).
          example: "PICK"
        location:
          type: string
          description: ProcessCapacity location.
          example: "PATH-ZONE-A"
        window_start:
          type: string
          format: date-time
          description: Capacity window start (RFC 3339, UTC).
          example: "2026-10-05T08:00:00Z"
        window_end:
          type: string
          format: date-time
          description: Capacity window end, exclusive (RFC 3339, UTC).
          example: "2026-10-05T09:00:00Z"
        constraint_type:
          type: string
          description: The constraint whose registration caused the change.
          example: "LOCATION"
        previous_quantity:
          type: number
          format: double
          description: Effective rate quantity before the registration.
          example: 4000
        previous_unit:
          type: string
          description: Native unit (identical across constraints of one aggregate).
          example: "UNIT"
        previous_period_seconds:
          type: number
          format: double
          description: Effective rate time base before the registration, in seconds.
          example: 3600
        previous_binding_constraint:
          type: string
          description: The binding constraint before the registration.
          example: "LABOR"
        effective_quantity:
          type: number
          format: double
          description: Effective rate quantity after the registration.
          example: 3500
        effective_unit:
          type: string
          description: Native unit (identical across constraints of one aggregate).
          example: "UNIT"
        effective_period_seconds:
          type: number
          format: double
          description: Effective rate time base after the registration, in seconds.
          example: 3600
        effective_binding_constraint:
          type: string
          description: The binding constraint after the registration.
          example: "LOCATION"
        capacity_over_window:
          type: number
          format: double
          description: path_capacity x window hours, in orders.
          example: 8000
        shortage:
          type: number
          format: double
          description: max(0, assigned_demand - capacity_over_window), in orders. Never negative.
          example: 4000
        bottleneck_step:
          type: string
          description: The ProcessPath step limiting end-to-end flow.
          example: "REBIN"
        status:
          type: string
          enum: [DRAFT]
          description: Always DRAFT at creation.
          example: DRAFT
