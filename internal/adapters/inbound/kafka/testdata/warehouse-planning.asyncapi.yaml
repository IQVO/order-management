      type: object
      description: >-
        Fields this service reads from labor-performance's LaborStandardDefined /
        LaborStandardRevised `data` (hand-mirrored, never imported; docs/adr/0022 decision 2).
        Everything else (previous_expected_seconds, team_lift_threshold_g,
        team_lift_expected_seconds) is ignored.
      required: [standard_id, task_type, expected_seconds, effective_from]
      properties:
        standard_id:
          type: string
          description: labor-performance's standard id; one row per id in the local copy, the same id again changes nothing.
        task_type:
          type: string
          description: The task type the standard measures (PICK, PACK, SLAM on the producer); it names the plan step of the same process type.
          example: "PACK"
        expected_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Engineered seconds per task; 0 or negative is dead-lettered.
        travel_component_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Optional part of expected_seconds attributed to travel; stored, not used to price a plan.
        handling_unit:
          type: string
          enum: [EACH, CASE, PALLET]
          description: Optional; absent = a task-type-only standard, the only kind that prices a plan step.
        site_code:
          type: string
          description: Optional (labor-performance ADR 0038); a facility-layout site code. Absent = every site.
          example: "SIM1"
        effective_from:
          type: string
          format: date-time
          description: When the standard came into force (RFC 3339).
    LaborStandardDefinedEvent:
      description: CloudEvents 1.0 envelope of labor-performance's LaborStandardDefined (consumed).
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.labor-performance.standard.LaborStandardDefined"
            data:
              $ref: "#/components/schemas/LaborStandardData"
    LaborStandardRevisedEvent:
      description: CloudEvents 1.0 envelope of labor-performance's LaborStandardRevised (consumed).
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.labor-performance.standard.LaborStandardRevised"
            data:
              $ref: "#/components/schemas/LaborStandardData"
    ProcessFlowData:
      type: object
      description: >-
        The FULL state of one process flow at one version, as this service reads it from
        process-path-management's ProcessFlowDefined / ProcessFlowRevised / ProcessFlowRetired `data`
        (hand-mirrored, never imported; docs/adr/0025 decision 1). Applied only when `version` is
        greater than the stored one.
      required: [flow_id, name, stages, status, version]
      properties:
        flow_id:
          type: string
          description: The flow's identity, also the `path_id` plans and path-capacity reads use.
          example: "single-unit"
        name:
          type: string
          example: "Single unit"
        stages:
          type: array
          minItems: 1
          description: The ordered stages; the array order IS the flow's order and the steps of a plan.
          items:
            type: object
            required: [path_id, process_type]
            properties:
              path_id:
                type: string
                example: "PICK"
              process_type:
                type: string
                enum: [PICK, REBIN, PACK, SLAM, DISPATCH, ARRIVAL, RELOCATE, REPLENISH]
                description: A value outside the closed set is dead-lettered and never applied.
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        version:
          type: integer
          format: int64
          minimum: 1
    ProcessFlowDefinedEvent:
      description: CloudEvents 1.0 envelope of process-path-management's ProcessFlowDefined (consumed).
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.process-path-management.processflow.ProcessFlowDefined"
            data:
              $ref: "#/components/schemas/ProcessFlowData"
    ProcessFlowRevisedEvent:
      description: CloudEvents 1.0 envelope of process-path-management's ProcessFlowRevised (consumed).
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.process-path-management.processflow.ProcessFlowRevised"
            data:
              $ref: "#/components/schemas/ProcessFlowData"
    ProcessFlowRetiredEvent:
      description: CloudEvents 1.0 envelope of process-path-management's ProcessFlowRetired (consumed).
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wes.process-path-management.processflow.ProcessFlowRetired"
            data:
              $ref: "#/components/schemas/ProcessFlowData"
