            time: "2026-10-08T18:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:dock-scheduling:events:DockAppointmentCancelled:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
