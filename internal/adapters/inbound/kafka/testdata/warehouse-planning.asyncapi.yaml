              version: 2

    TaskCompleted:
      name: TaskCompleted
      title: Task completed (consumed)
      summary: fulfillment-execution reports that a station completed a task.
      description: |
        CONSUMED from `warehouse.fulfillment.events` (producer: fulfillment-execution, its own
        `apis/asyncapi.yaml`). Adds the completion to the local `observed_capacity` read model:
        one row per (location, process_type = upper-cased `data.task_type`, minute of the
        CloudEvents `time`) with the task count and the duration total. Site = the configured
        `DEMAND_SITE_ID`. The idempotency claim on the CloudEvents `id` and the additive upsert
        commit in ONE transaction, so a redelivered `id` adds nothing. A completion without
        `task_type` or `task_id` is dead-lettered. Only the fields below are read; the
        enrichment fields fulfillment-execution adds (`work_unit_id`, `associate_id`,
        relocation fields) are ignored. `type` =
        `com.warehouse.wes.fulfillment-execution.task.TaskCompleted`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
        - name: warehouse-planning
      payload:
        $ref: "#/components/schemas/TaskCompletedEvent"
      examples:
        - name: pickCompleted
          summary: A PICK task completed after 245 s.
          payload:
            specversion: "1.0"
            id: "a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
            source: "/warehouse/fulfillment-execution"
            type: "com.warehouse.wes.fulfillment-execution.task.TaskCompleted"
            subject: "task-7c9e6679"
            time: "2026-10-05T09:14:30Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:fulfillment-execution:events:TaskCompleted:v1"
            data:
              task_id: "task-7c9e6679"
              task_type: "PICK"
              duration_seconds: 245

  schemas:
    CloudEventEnvelope:
      type: object
      description: >
        CloudEvents 1.0 structured-mode envelope. Every attribute below is
        required; the context's own payload sits under data.
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: UUID v4, minted once per domain event and persisted with the outbox row, so a redelivery repeats it. Dedupe on it.
        source:
          type: string
          example: "/warehouse/warehouse-planning"
        type:
          type: string
          description: Full reverse-DNS type; dispatch on the whole string.
        subject:
          type: string
          description: Aggregate instance id (never empty).
        time:
          type: string
          format: date-time
          description: Domain occurred-at, UTC.
        datacontenttype:
          type: string
          const: "application/json"
        dataschema:
          type: string
          description: urn:warehouse:<repo>:events:<EventName>:v<N>.
        data:
          type: object
