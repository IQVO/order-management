    TrailerDeparted:
      name: TrailerDeparted
      title: TrailerDeparted (consumed, pinned)
      summary: The trailer physically left; the seal number and departure trigger ship-confirm (ADR 0002).
      description: |
        Pinned from yard-management's merged AsyncAPI. ConfirmOnDeparture
        policy: a departure for a CLOSED load confirms the shipment (seal
        from this event) and issues the BOL. FlagDepartureWithoutClose: a
        departure for a LOADING load NEVER confirms — every package not
        loaded raises `PackageMissedLoad` once and the load is left for a
        supervisor. A re-delivered departure confirms nothing twice.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: '#/components/schemas/TrailerDepartedEvent'
      examples:
