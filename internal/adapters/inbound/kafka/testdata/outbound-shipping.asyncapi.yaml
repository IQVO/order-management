            dataschema: urn:warehouse:outbound-shipping:events:PackageMissedLoad:v1
            data:
              package_id: pkg-2055
              load_id: load-7f3a
              site_id: SITE-1
              source_order_id: order-88423
              cutoff: '2026-11-06T16:00:00Z'
              detected_at: '2026-11-06T16:00:00Z'
              version: 2

