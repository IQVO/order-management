asyncapi: 2.6.0

info:
  title: outbound-shipping Domain Events
  version: 1.0.0
  contact:
    name: outbound-shipping maintainers
    url: https://github.com/IQVO/outbound-shipping
    email: outbound-shipping@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event contract for the **outbound-shipping** bounded context (WMS
    subdomain): staging, the outbound load, ship-confirm on the trailer's
    physical departure, and the bill of lading (ADR 0001, ADR 0002, ADR
    0005).

    **Published.** Three aggregates raise thirteen events, published to
    `warehouse.outbound-shipping.events` through a **transactional outbox**:
    the aggregate row and its already-encoded events are written in ONE
    database transaction and a relay drains them to Kafka (at-least-once; the
    CloudEvents `id` is stored with the outbox row, so a retry republishes
    the same `id`). Every payload carries the aggregate `version` AFTER the
    change, so consumers can reject out-of-order deliveries.

    **Analytics.** Every published event is ALSO written, in the same
    transaction and under the same `id`, to
    `warehouse.outbound-shipping.analytics` with
    `dataschema urn:warehouse:outbound-shipping:analytics:<EventName>:v1`.
    That stream is not an integration contract: only this service's own
    projector consumes it. Other contexts keep reading
    `warehouse.outbound-shipping.events`.

    **Consumed (ADR 0003, ADR 0005).** `PackageManifested` and
    `PackageDiverted` from fulfillment-execution; `CPTScheduleChanged` from
    process-path-management; `ZoneRegistered` and `LocationSlotRegistered`
    from facility-layout; `DockAppointmentBooked` from dock-scheduling
    (pinned from its `origin/feature/service` until that contract merges);
    `TrailerDocked`, `DoorWorkCompleted` and `TrailerDeparted` from
    yard-management (pinned to its merged contract,
    `contracts/yard-management.asyncapi.yaml`, ADR 0010 there). Each feeds a durable local copy. The consumed
    messages below are the producers' own contracts, decoded independently
    here and never imported.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `type` = `com.warehouse.wms.outbound-shipping.<entity>.<EventName>`
    where `<entity>` is the raising aggregate lowercase with no separators:
    `outboundload`, `shippingpackage`, `billoflading`. Kafka key = aggregate
    id. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.

servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092

tags:
  - name: outbound-shipping
    description: The outbound-shipping bounded context (WMS subdomain).
  - name: outboundload
    description: Events raised by the OutboundLoad aggregate.
  - name: shippingpackage
    description: Events raised by the ShippingPackage aggregate.
  - name: billoflading
    description: Events raised by the BillOfLading aggregate.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003, ADR 0005).
  - name: analytics
    description: This service's own analytics stream (every published event, same id).

defaultContentType: application/json

channels:
  warehouse.outbound-shipping.events:
    description: |
      This service's integration topic. Written by the outbox relay; key =
      aggregate id, so all events of one load (or package, or BOL) stay
      ordered on one partition. Every message carries the CloudEvents
      content-type header. Dispatch on the full `type`, ignore unknown
      types, dedupe on `id`.
    subscribe:
      operationId: receiveOutboundShippingEvents
      summary: Receive outbound-shipping events.
      description: |
        Subscribe to the outbound shipping facts. Route on the full `type`
        (`com.warehouse.wms.outbound-shipping.<entity>.<EventName>`).
        `ShipmentConfirmed` is the fleet's "this actually shipped" fact
        (ADR 0002, ADR 0004); `PackageMissedLoad` drives exception cases and
        re-promising.
      tags:
        - name: outbound-shipping
      message:
        oneOf:
          - $ref: '#/components/messages/LoadPlanned'
          - $ref: '#/components/messages/LoadDoorAssigned'
          - $ref: '#/components/messages/LoadingStarted'
          - $ref: '#/components/messages/LoadClosed'
          - $ref: '#/components/messages/LoadReopened'
          - $ref: '#/components/messages/LoadCancelled'
          - $ref: '#/components/messages/ShipmentConfirmed'
          - $ref: '#/components/messages/PackageStaged'
          - $ref: '#/components/messages/PackageLoaded'
          - $ref: '#/components/messages/PackageUnloaded'
          - $ref: '#/components/messages/PackageMissedLoad'
          - $ref: '#/components/messages/BillOfLadingIssued'
          - $ref: '#/components/messages/BillOfLadingVoided'

  warehouse.outbound-shipping.analytics:
    description: |
      This service's own analytics stream, written by the SAME transactional
      outbox as the integration topic: every published event appears here
      too, under the SAME CloudEvents id and `type`, with only the
      `dataschema` stream segment different
      (`urn:warehouse:outbound-shipping:analytics:<EventName>:v1`). It is
      NOT an integration contract: the only consumer is this service's own
      projector. Other contexts keep reading
      `warehouse.outbound-shipping.events`.
    subscribe:
      operationId: receiveOutboundShippingAnalytics
      summary: Receive the analytics twin of every outbound-shipping event.
      description: |
        Payloads are byte-for-byte the integration payloads; only the
        `dataschema` stream segment differs. Consumed by this service's
        projector (fixed consumer group) to fold the load funnel and
        adherence read models.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: '#/components/messages/LoadPlanned'
          - $ref: '#/components/messages/LoadDoorAssigned'
          - $ref: '#/components/messages/LoadingStarted'
          - $ref: '#/components/messages/LoadClosed'
          - $ref: '#/components/messages/LoadReopened'
          - $ref: '#/components/messages/LoadCancelled'
          - $ref: '#/components/messages/ShipmentConfirmed'
          - $ref: '#/components/messages/PackageStaged'
          - $ref: '#/components/messages/PackageLoaded'
          - $ref: '#/components/messages/PackageUnloaded'
          - $ref: '#/components/messages/PackageMissedLoad'
          - $ref: '#/components/messages/BillOfLadingIssued'
          - $ref: '#/components/messages/BillOfLadingVoided'

  warehouse.fulfillment.events:
    description: |
      fulfillment-execution's integration topic. This service consumes ONLY
      `PackageManifested` and `PackageDiverted` (keyed by package id, so one
      package's stream is totally ordered), under a stable consumer group.
      Every other type on the topic is ignored.
    publish:
      operationId: consumeFulfillmentPackageEvents
      summary: Consume package manifestation and diversion.
      description: |
        `PackageManifested` plans the load (PlanLoadFromCutoff policy) and
        records the package as EXPECTED on it (AssignPackageToLoad). The
        additive correlation fields `site_id`, `source_order_id`, `cpt`,
        `weight_g` (ADR 0003) are optional and omitted by the producer when
        unknown — this consumer tolerates both shapes. `PackageDiverted`
        short-ships an EXPECTED package with reason DIVERTED (DropDiverted
        policy). The CloudEvents `id` claim and the effect commit in one
        transaction; the offset is committed afterwards.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: '#/components/messages/PackageManifested'
          - $ref: '#/components/messages/PackageDiverted'

  warehouse.process-path-management.events:
    description: |
      process-path-management's integration topic. This service consumes
      ONLY `CPTScheduleChanged` (keyed by site id), which feeds the local
      CPT copy the load planner reads. Every other type on the topic is
      ignored.
    publish:
      operationId: consumeCptSchedule
      summary: Consume the cutoff (CPT) schedule.
      description: |
        Last writer wins per site: the local copy keeps each cutoff's id,
        local time, days of week and ship method — the (site, cpt, date,
        ship method) key a load is planned for. A cutoff that disappears
        from the schedule leaves the local copy stale until the next change;
        that is recorded, not guessed.
      tags:
        - name: consumed
      message:
        $ref: '#/components/messages/CPTScheduleChanged'

  warehouse.facility.events:
    description: |
      facility-layout's integration topic. This service consumes ONLY
      `ZoneRegistered` (zone to site mapping) and `LocationSlotRegistered`
      (staging locations). Every other type on the topic is ignored.
    publish:
      operationId: consumeFacilityLayout
      summary: Consume zones and staging locations.
      description: |
        Feeds the staging-location local copy: a package stages only at a
        location whose `role` is Staging in a zone of its site
        (`ErrNotStagingLocation`). A location maps to a site through its
        `zoneId`, never by parsing its code. `role` is absent on events
        emitted before the field existed (treated as Storage, so never
        Staging).
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: '#/components/messages/ZoneRegistered'
          - $ref: '#/components/messages/LocationSlotRegistered'

  warehouse.dock-scheduling.events:
    description: |
      dock-scheduling's integration topic. This service consumes ONLY
      `DockAppointmentBooked` with `direction=OUTBOUND` (DoorFromAppointment
      policy: an appointment naming the load's cpt assigns the door).
      `cpt_id` and `carrier_scac` are nullable — an appointment without a
      cpt names no load. PINNED from the producer's
      `origin/feature/service` (campaign spike Q5): re-verify against the
      producer's `origin/develop` AsyncAPI before fleet wiring lands.
    publish:
      operationId: consumeDockAppointments
      summary: Consume outbound dock appointments.
      description: |
        INBOUND appointments are ignored. An OUTBOUND appointment carrying a
        `cpt_id` assigns the door to the open load of that (site, cpt,
        date, ship method), if one exists when the event arrives; a later
        appointment for the same cpt re-assigns and the change is published
        as `LoadDoorAssigned` again.
      tags:
        - name: consumed
      message:
        $ref: '#/components/messages/DockAppointmentBooked'

  warehouse.yard-management.events:
    description: |
      yard-management's integration topic. This service consumes ONLY
      `TrailerDocked`, `DoorWorkCompleted` and `TrailerDeparted`
      (StartOnDock, ConfirmOnDeparture and FlagDepartureWithoutClose
      policies, ADR 0002). The three messages are validated against the
      producer's merged AsyncAPI, pinned in `contracts/yard-management.asyncapi.yaml`
      (kept equal to its `develop` by `scripts/harness/pinned_contract_gate.py`);
      `TestConsumedYardTypesMatchTheProducersIntegrationContract` fails when a
      consumed type is not on the producer's integration channel.
    publish:
      operationId: consumeYardTrailerEvents
      summary: Consume trailer dock, door-work and departure facts.
      description: |
        `TrailerDocked` at the load's door attaches the trailer (loading may
        then start). `TrailerDeparted` for a CLOSED load confirms the
        shipment with the event's seal number and issues the BOL; for a
        LOADING load it never confirms — every package not loaded raises
        `PackageMissedLoad` and the load is left for a supervisor. `time`
        and `subject` are read from the envelope attributes, the payload via
        `DataAs`, and the consumer dedupes on `id`: a re-delivered departure
        confirms nothing twice.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: '#/components/messages/TrailerDocked'
          - $ref: '#/components/messages/DoorWorkCompleted'
          - $ref: '#/components/messages/TrailerDeparted'

components:
  messages:
    LoadPlanned:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: LoadPlanned
      title: Load planned
      summary: A load was planned for one cutoff and ship method.
      description: |
        `type` = `com.warehouse.wms.outbound-shipping.outboundload.LoadPlanned`;
        subject and key = the load id. Raised automatically when the first
        package of a (site, cpt, date, ship method) manifests and no open
        load exists for that key (PlanLoadFromCutoff policy).
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadPlannedEvent'
      examples:
        - name: planned
          summary: The first package of the 16:00 ground cutoff plans load load-7f3a.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e01
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadPlanned
            subject: load-7f3a
            time: '2026-11-06T13:02:11Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadPlanned:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              cpt_id: cpt-1600
              operating_date: '2026-11-06'
              ship_method: STDOUT-2DAY
              cutoff: '2026-11-06T16:00:00Z'
              version: 1

    LoadDoorAssigned:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: LoadDoorAssigned
      title: Load door assigned
      summary: An outbound dock appointment assigned the load's door.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.LoadDoorAssigned`;
        subject and key = the load id. DoorFromAppointment policy: the
        appointment names the cpt; `appointment_id` is that appointment.
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadDoorAssignedEvent'
      examples:
        - name: assigned
          summary: Appointment appt-2211 assigns door D04 to load-7f3a.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e02
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadDoorAssigned
            subject: load-7f3a
            time: '2026-11-06T13:20:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadDoorAssigned:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              door_code: D04
              appointment_id: appt-2211
              version: 2

    LoadingStarted:
      x-no-consumer-reason: "pending: ADR 0005 names yard-management as the integration consumer, but yard-management declares no such consumer and has no handler for it on develop."
      name: LoadingStarted
      title: Loading started
      summary: Loading began at the assigned door with the docked trailer.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.LoadingStarted`;
        subject and key = the load id. Requires a door AND a docked trailer
        (`ErrTrailerNotDocked`). yard-management starts its outbound door
        work on it (wave 6.4, deferred until the yard contract merges).
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadingStartedEvent'
      examples:
        - name: started
          summary: Trailer trl-91 docks at D04 and loading starts.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e03
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadingStarted
            subject: load-7f3a
            time: '2026-11-06T14:05:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadingStarted:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              door_code: D04
              trailer_id: trl-91
              started_at: '2026-11-06T14:05:00Z'
              version: 3

    LoadClosed:
      x-no-consumer-reason: "pending: ADR 0005 names yard-management as the integration consumer, but yard-management declares no such consumer and has no handler for it on develop."
      name: LoadClosed
      title: Load closed
      summary: Every package is loaded or short-shipped; the load is closed.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.LoadClosed`;
        subject and key = the load id. `package_count` is the loaded count,
        `short_shipped_count` the deliberate left-offs with reasons.
        yard-management completes its outbound door work on it.
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadClosedEvent'
      examples:
        - name: closed
          summary: Load-7f3a closes with 40 loaded packages and one short-ship.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e04
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadClosed
            subject: load-7f3a
            time: '2026-11-06T15:41:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadClosed:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              door_code: D04
              trailer_id: trl-91
              package_count: 40
              short_shipped_count: 1
              closed_at: '2026-11-06T15:41:00Z'
              version: 4

    LoadReopened:
      x-no-consumer-reason: "pending: ADR 0005 names yard-management as the integration consumer, but yard-management declares no such consumer and has no handler for it on develop."
      name: LoadReopened
      title: Load reopened
      summary: A supervisor reopened a closed load for more loading.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.LoadReopened`;
        subject and key = the load id. A SHIP_CONFIRMED load is never
        reopened (`ErrLoadConfirmed`). yard-management reopens the door work
        on it.
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadReopenedEvent'
      examples:
        - name: reopened
          summary: Load-7f3a reopens for a late package.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e05
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadReopened
            subject: load-7f3a
            time: '2026-11-06T15:44:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadReopened:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              reopened_at: '2026-11-06T15:44:00Z'
              version: 5

    LoadCancelled:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: LoadCancelled
      title: Load cancelled
      summary: A planned load was cancelled before loading.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.LoadCancelled`;
        subject and key = the load id. Only a PLANNED load can be cancelled.
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/LoadCancelledEvent'
      examples:
        - name: cancelled
          summary: The cutoff was withdrawn before any package loaded.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e06
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.LoadCancelled
            subject: load-9c2b
            time: '2026-11-06T12:10:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:LoadCancelled:v1
            data:
              load_id: load-9c2b
              site_id: SITE-1
              cancelled_at: '2026-11-06T12:10:00Z'
              version: 2

    ShipmentConfirmed:
      name: ShipmentConfirmed
      title: Shipment confirmed
      summary: The trailer left with a closed load; the shipment is a fact.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.outboundload.ShipmentConfirmed`;
        subject and key = the load id. Raised on `TrailerDeparted` for a
        CLOSED load (ADR 0002): the goods physically left. `orders` lists
        every distinct `source_order_id` of the shipped packages (ADR 0003);
        a package manifested without one is excluded. order-management marks
        orders Shipped/PartiallyShipped (D7) and network-fulfillment joins
        `localOrderId` (ADR 0004).
      contentType: application/cloudevents+json
      tags:
        - name: outboundload
      payload:
        $ref: '#/components/schemas/ShipmentConfirmedEvent'
      examples:
        - name: confirmed
          summary: Trailer trl-91 departs with load-7f3a, seal SL-4471, two orders.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e07
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.outboundload.ShipmentConfirmed
            subject: load-7f3a
            time: '2026-11-06T16:02:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:ShipmentConfirmed:v1
            data:
              load_id: load-7f3a
              site_id: SITE-1
              cpt_id: cpt-1600
              carrier: STDOUT
              trailer_id: trl-91
              seal_number: SL-4471
              departed_at: '2026-11-06T16:01:30Z'
              orders:
                - order_id: order-88421
                - order_id: order-88422
              version: 6

    PackageStaged:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: PackageStaged
      title: Package staged
      summary: A manifested package was staged at a Staging location.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.shippingpackage.PackageStaged`;
        subject and key = the package id. The location is a facility-layout
        Staging location of the package's site.
      contentType: application/cloudevents+json
      tags:
        - name: shippingpackage
      payload:
        $ref: '#/components/schemas/PackageStagedEvent'
      examples:
        - name: staged
          summary: pkg-1029 stages at STG-D04-A.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e08
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.shippingpackage.PackageStaged
            subject: pkg-1029
            time: '2026-11-06T14:20:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:PackageStaged:v1
            data:
              package_id: pkg-1029
              load_id: load-7f3a
              site_id: SITE-1
              staging_location: STG-D04-A
              staged_at: '2026-11-06T14:20:00Z'
              version: 2

    PackageLoaded:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: PackageLoaded
      title: Package loaded
      summary: A package was loaded onto its load through the load's door.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.shippingpackage.PackageLoaded`;
        subject and key = the package id.
      contentType: application/cloudevents+json
      tags:
        - name: shippingpackage
      payload:
        $ref: '#/components/schemas/PackageLoadedEvent'
      examples:
        - name: loaded
          summary: pkg-1029 loads through door D04 onto load-7f3a.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e09
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.shippingpackage.PackageLoaded
            subject: pkg-1029
            time: '2026-11-06T14:48:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:PackageLoaded:v1
            data:
              package_id: pkg-1029
              load_id: load-7f3a
              site_id: SITE-1
              loaded_at: '2026-11-06T14:48:00Z'
              version: 3

    PackageUnloaded:
      x-no-consumer-reason: "No integration consumer by design: the ADR 0005 type catalogue lists this type as analytics only; the service's own projector folds it from the analytics stream."
      name: PackageUnloaded
      title: Package unloaded
      summary: A loaded package came back off the load before ship-confirm.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.shippingpackage.PackageUnloaded`;
        subject and key = the package id. `reason` is the operator's reason,
        omitted when none was given. Impossible after ship-confirm
        (`ErrAlreadyShipped`).
      contentType: application/cloudevents+json
      tags:
        - name: shippingpackage
      payload:
        $ref: '#/components/schemas/PackageUnloadedEvent'
      examples:
        - name: unloaded
          summary: pkg-1029 comes back off with a damaged carton.
          payload:
            specversion: '1.0'
            id: 3f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e0a
            source: /warehouse/outbound-shipping
            type: com.warehouse.wms.outbound-shipping.shippingpackage.PackageUnloaded
            subject: pkg-1029
            time: '2026-11-06T15:00:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:outbound-shipping:events:PackageUnloaded:v1
            data:
              package_id: pkg-1029
              load_id: load-7f3a
              site_id: SITE-1
              unloaded_at: '2026-11-06T15:00:00Z'
              reason: damaged-carton
              version: 4

    PackageMissedLoad:
      name: PackageMissedLoad
      title: Package missed its load
      summary: A package was not loaded by its cutoff or by departure.
      description: |
        `type` =
        `com.warehouse.wms.outbound-shipping.shippingpackage.PackageMissedLoad`;
        subject and key = the package id. Raised at most ONCE per package and
        load (the flagged fact is remembered: a re-run sweep or a repeated
        departure publishes nothing new). `source_order_id` is omitted when
        the manifest carried none (ADR 0003). exception-management opens a
        case; order-management re-promises.
      contentType: application/cloudevents+json
      tags:
        - name: shippingpackage
      payload:
        $ref: '#/components/schemas/PackageMissedLoadEvent'
      examples:
        - name: missed
