              visit_id: visit-551
              departed_at: '2026-11-06T16:01:30Z'
              dwell_minutes: 121
              load_state: FULL
              seal_number: SL-4471
              version: 9

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          description: UUID minted once per occurrence and persisted with the outbox row; consumers dedupe on it.
        source:
          type: string
          const: /warehouse/outbound-shipping
        type:
          type: string
          description: com.warehouse.wms.outbound-shipping.<entity>.<EventName>.
        subject:
          type: string
          description: Aggregate root id; also the Kafka partition key.
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          description: urn:warehouse:outbound-shipping:<events|analytics>:<EventName>:v1.

    LoadPlannedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
