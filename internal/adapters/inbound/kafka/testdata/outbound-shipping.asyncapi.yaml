    PackageManifested:
      name: PackageManifested
      title: PackageManifested (consumed)
      summary: fulfillment-execution's package manifestation; plans the load and expects the package.
      description: |
        Producer contract (fulfillment-execution, `origin/develop`). The four
        ship-correlation fields are ADDITIVE per ADR 0003, pinned from the
        producer's wave-2 branch and optional (`omitempty`): `site_id` is
        omitted today (no source in the chain yet), `source_order_id`,
        `cpt` and `weight_g` flow once the producer stamps them. This
        consumer tolerates both shapes and never parses `order_ref`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: '#/components/schemas/PackageManifestedEvent'
      examples:
        - name: manifested
          summary: pkg-1029 manifests with its order correlation.
          payload:
            specversion: '1.0'
            id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
            source: /warehouse/fulfillment-execution
