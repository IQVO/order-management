      summary: A package passed its SLAM weigh-check (the "SLAM pass").
      description: Raised alongside `LabelApplied` when the SLAM weigh-check passes (ADR-0025); a diverted
        package does not raise it. Published on `warehouse.fulfillment.events`, keyed by package id. Consumed
        by order-management.
      contentType: application/cloudevents+json
