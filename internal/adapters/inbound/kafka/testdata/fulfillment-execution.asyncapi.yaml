            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.package.PackageManifested
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:PackageManifested:v1
            data:
              type: object
              required:
              - package_id
              - order_ref
              properties:
                package_id:
                  type: string
                  description: Manifested package id.
                order_ref:
                  type: string
                  description: The package's order reference.
                site_id:
                  type: string
                  description: >-
                    Optional facility-layout siteCode the package ships from (ADR-0061).
                    No source exists in the order-work chain yet, so this is omitted until
                    a later wave lands one; never an empty string.
                source_order_id:
                  type: string
                  description: >-
                    Optional order-management OrderId the package ships for (ADR-0061).
                    The correlated task's Task.SourceOrderId when stamped (WorkReleased.ref
                    on release-created work, the posted orderRef on rebin-created PACK
                    tasks); otherwise the package's order_ref by rebin caller convention,
                    with a trailing "-line-N" work-unit suffix stripped. Omitted when
                    unknown.
                cpt:
                  type: string
                  format: date-time
                  description: >-
                    Optional RFC3339 Critical Pull Time of the manifest's SLAM task
                    (ADR-0061) — the same SLAM-leg correlation as the on-time-to-CPT
                    KPI. Omitted when no SLAM task correlates.
                weight_g:
                  type: number
                  format: double
                  description: >-
                    Optional actual SLAM weigh-check measurement in grams (ADR-0061),
                    the same unit discipline as WeightDiscrepancyDetected.actual_g.
                    Omitted when not recorded.
      examples:
      - name: packageManifested
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
