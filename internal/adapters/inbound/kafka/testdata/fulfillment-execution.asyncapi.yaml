    ProductPackLevelDeclared:
      name: ProductPackLevelDeclared
      title: ProductPackLevelDeclared
      summary: product-master declared or revised a pack level of a SKU (consumed).
      description: Published by product-master on `warehouse.product-master.events` (its AsyncAPI is the
        source of truth); consumed here into the local PackView read per scanned GTIN at scan time (ADR 0054),
        by the always-on consumer under the required `PACK_VIEW_CONSUMER_GROUP`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wms.product-master.product.ProductPackLevelDeclared
            source:
              type: string
              const: /warehouse/product-master
            dataschema:
              type: string
              const: urn:warehouse:product-master:events:ProductPackLevelDeclared:v1
            data:
              type: object
              required:
              - sku
              - level
              - gtin
              - units_per_pack
              - effective_from
              - version
              properties:
                sku:
                  type: string
                  description: The SKU (also the Kafka key and the CloudEvents `subject`). Must not be blank.
                level:
                  type: string
                  enum:
                  - EACH
                  - INNER
                  - CASE
                  - PALLET
                  description: Any other level makes the payload invalid.
                gtin:
                  type: string
                  description: Must parse as a GTIN (normalised to 14 digits).
                child_gtin:
                  type: string
                  description: Optional; must parse as a GTIN when present.
                qty_of_child:
                  type: integer
                  minimum: 2
                  description: Absent for EACH.
                units_per_pack:
                  type: integer
                  minimum: 1
                  description: Direct factor to eaches; 1 for EACH.
                is_orderable:
                  type: boolean
                  description: Carried by the producer; ignored by this consumer.
                is_despatch_unit:
                  type: boolean
                  description: Carried by the producer; ignored by this consumer.
                dims:
                  type: object
                  description: Optional DECLARED dimensions and weight of the level, used by ship-in-own-container
                    (ADR 0056). Kept only when all four measures are positive; otherwise dropped (the level is
                    still applied, but cannot ship in its own container).
                  properties:
                    length_mm:
                      type: integer
                      description: Length in millimetres.
                    width_mm:
                      type: integer
                      description: Width in millimetres.
                    height_mm:
                      type: integer
                      description: Height in millimetres.
                    weight_g:
                      type: integer
                      description: Weight in grams.
                effective_from:
                  type: string
                  format: date-time
                version:
                  type: integer
                  minimum: 1

