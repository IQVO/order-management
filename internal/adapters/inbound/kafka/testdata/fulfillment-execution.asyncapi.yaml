    TaskClaimed:
      name: TaskClaimed
      title: TaskClaimed
      summary: A station claimed a task; it left the open-task pool.
      description: 'Raised in the same transaction as the claim, through the transactional outbox (ADR-0020),
        for every task type. Never raised when the claim is rejected or loses the at-most-once race.
        Published on `warehouse.fulfillment.events` (the richer integration row), keyed by task id; the
        analytics-topic TaskClaimed `{task_id, task_type, station_id}` is unchanged. Consumed by
        task-interleaving (removes the task from its pool copy and learns the station''s next position).'
