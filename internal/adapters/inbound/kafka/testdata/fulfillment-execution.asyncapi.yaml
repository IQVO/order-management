      name: InterleavingHintIssued
      title: InterleavingHintIssued
      summary: task-interleaving recommended which open tasks a station could work next (consumed).
      description: Published by task-interleaving on `warehouse.task-interleaving.events` (its AsyncAPI
        is the source of truth); consumed here into the local hint copy (ADR-0051). Kafka key and `subject`
        = the station id. `candidates` is non-empty and ranked from 1 by `detour_m` ascending then `task_id`.
        The hint is advisory and valid until `expires_at`; one ACTIVE hint per station, a newer hint
        supersedes; dedupe on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.task-interleaving.stationtrip.InterleavingHintIssued
            source:
              type: string
              const: /warehouse/task-interleaving
            dataschema:
              type: string
              const: urn:warehouse:task-interleaving:events:InterleavingHintIssued:v1
            data:
              type: object
              required:
              - hint_id
              - station_id
              - site_id
              - expires_at
              - candidates
              properties:
                hint_id:
                  type: string
                  description: The hint id.
                station_id:
                  type: string
                  description: The station the hint is for (also the Kafka key and the CloudEvents `subject`).
                site_id:
                  type: string
                  description: The site the station belongs to.
                after_task_id:
                  type: string
                  description: The task whose completion triggered the hint. Not used here.
                origin_location:
                  type: string
                  description: Where the operator finished `after_task_id`. Not used here.
                expires_at:
                  type: string
                  format: date-time
                  description: The hint is ignored at and after this instant (fail-open).
