    ProductClassified:
      name: ProductClassified
      title: ProductClassified
      summary: product-master set or replaced a SKU's handling classification (consumed).
      description: Published by product-master on `warehouse.product-master.events` (its AsyncAPI is the
        source of truth); consumed here into the local classification copy (ADR-0039). Full-state replacement
        of the classification; optional fields are omitted when unset. Applied only when `version` is greater
        than the stored version; dedupe on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wms.product-master.product.ProductClassified
            source:
              type: string
              const: /warehouse/product-master
            dataschema:
              type: string
              const: urn:warehouse:product-master:events:ProductClassified:v1
            data:
              type: object
              required:
              - sku
              - version
              properties:
                sku:
                  type: string
                  description: The SKU (also the Kafka key and the CloudEvents `subject`). An empty sku makes the payload invalid.
                handling_tags:
                  type: array
                  items:
                    type: string
                    enum:
                    - Hazmat
                    - Fragile
                    - TemperatureSensitive
                    - Oversized
                    - HighValue
                  description: Handling tags in stable order. Hazmat and Fragile feed ClassificationInfo; the
                    others are stored but unused here.
                temperature_class:
                  type: string
                  enum:
                  - Ambient
                  - Chilled
                  - Frozen
                  description: Omitted when unset.
                dot_hazard_class:
                  type: integer
                  minimum: 1
                  maximum: 9
                  description: DOT hazard class; omitted when unset. Drives SealPackage's same-package segregation
                    (ADR-0010).
                classification_source:
                  type: string
                  enum:
                  - native
                  - legacy-import
                  description: Migration artefact of product-master (its ADR 0003); optional and not used here.
                version:
                  type: integer
                  minimum: 1
                  format: int64
                  description: Product aggregate version after the change; the local copy's guard.
