    WorkReleased:
      name: WorkReleased
      title: WorkReleased
      summary: Work Planning released a work unit (consumed).
      description: Published by wes-work-planning on `warehouse.work-planning.events`; consumed here to
        create a Task via CreateTask. Dispatch is on the full `type`; dedupe is on the CloudEvents `id`.
        A message that is not a valid CloudEvents 1.0 event is dead-lettered to `warehouse.work-planning.events.dlq`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.work-planning.workunit.WorkReleased
            source:
              type: string
              const: /warehouse/wes-work-planning
            dataschema:
              type: string
              const: urn:warehouse:wes-work-planning:events:WorkReleased:v1
            data:
              type: object
              required:
              - path_id
              - work_unit_id
              - cpt
              properties:
                path_id:
                  type: string
                  description: Process path id, resolved against the process-path catalogue.
                work_unit_id:
                  type: string
                  description: Becomes the Task's order reference.
                cpt:
                  type: string
                  description: CPT deadline.
                  format: date-time
                ref:
                  type: string
                  description: Release reference. For order-originated work this is the order id; it is kept
                    on the Task and published as TaskCompleted.order_ref (ADR-0040). For transfer work it is the demand id.
                    For RELOCATE work it is the slot plan id and is not kept (ADR-0047); for REPLENISH work it
                    is the request id and is not kept either (ADR-0050).
                line_no:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: Optional (additive; the event stays v1). The 1-based order line this work
                    unit is for; wes-work-planning sets it for order-originated work (explicitly, not encoded
                    in work_unit_id). It is kept on the Task as source_line_no and published as
                    TaskCompleted.line_no (ADR-0041). Absent from producers that predate it, and never
                    honoured for transfer work. A value above 2147483647 (the 32-bit column width) is
                    ignored by this consumer rather than rejected, so the task is still created with its
                    line unknown.
                fragile:
                  type: boolean
                  description: Optional fragile packing hint (default false).
                gift_wrap:
                  type: boolean
                  description: Optional gift-wrap request (default false).
                transfer_ref:
                  type: string
                  description: Present only for inter-warehouse-transfer work (the transfer saga's
                    correlation id). Its presence turns the created Task into transfer work whose
                    completion publishes exactly one transfer fact.
                work_kind:
                  type: string
                  enum:
                  - TRANSFER_PICK
                  - TRANSFER_DISPATCH
                  - TRANSFER_ARRIVAL
                  description: Kind of transfer work; selects the completion fact. Required whenever
                    transfer_ref is present, unknown values are rejected.
                site_id:
                  type: string
                  description: Site the transfer fact is about (origin for pick/dispatch, destination
                    for arrival).
                sku:
                  type: string
                  description: SKU the transfer moves.
                quantity:
                  type: integer
                  description: Units of sku the transfer moves.
                relocation:
                  type: object
                  description: Present ONLY on work released on the RELOCATE process path (ADR-0047;
                    additive, the event stays v1). One move of an approved slot plan
                    (slotting-optimization SlotPlanApproved, planned by wes-work-planning). It turns the
                    created Task into a RELOCATE task whose completion takes the operator-confirmed
                    quantity and scanned bins and publishes them on TaskCompleted. A RELOCATE release
                    without this object, this object on any other path, or an object that is not a valid
                    move (missing move_seq, unknown kind, a bin the kind requires missing, from_bin equal
                    to to_bin, blank plan_id or sku) is rejected and dead-lettered; no task is created.
                  required:
                  - plan_id
                  - move_seq
                  - kind
                  - sku
                  properties:
                    plan_id:
                      type: string
                      minLength: 1
                      description: The approved slot plan's id (SlotPlanApproved.data.plan_id).
                    move_seq:
                      type: integer
                      format: int32
                      minimum: 0
                      description: The move's 0-based position in SlotPlanApproved.data.moves. With
                        plan_id it forms the move reference `<plan_id>:<move_seq>` published as
                        TaskCompleted.relocation_ref (keep plan_id + move_seq within 200 characters).
                    kind:
                      type: string
                      enum:
                      - Relocate
                      - Assign
                      - Vacate
                      description: The SlotPlanApproved move kind, exact case. Relocate needs from_bin and
                        to_bin; Assign needs to_bin (the source is scanned at completion); Vacate needs
                        from_bin (the reserve destination is scanned at completion).
                    sku:
                      type: string
                      minLength: 1
                      description: The SKU to move (SlotPlanApproved move sku).
                    from_bin:
                      type: string
                      minLength: 1
                      description: Source bin (SlotPlanApproved move from_slot). Omitted for an Assign
                        (the operator scans the source); if sent for an Assign it is fixed.
                    to_bin:
                      type: string
                      minLength: 1
                      description: Destination bin (SlotPlanApproved move to_slot). Omitted for a Vacate
                        (the operator scans a reserve bin); if sent for a Vacate it is fixed.
                replenishment:
                  type: object
                  description: Present ONLY on work released on the REPLENISH process path (ADR-0050;
                    additive, the event stays v1). One pick-face replenishment request of
                    pick-face-replenishment, planned by wes-work-planning. It turns the created Task into a
                    REPLENISH task whose completion takes the operator-confirmed quantity and publishes the
                    executed move on TaskCompleted with request_ref. A REPLENISH release without this
                    object, this object on any other path (the RELOCATE path included), a `relocation`
                    object on the REPLENISH path, or an object that is not a valid move (a blank request_id,
                    sku or bin, from_bin equal to to_bin, a missing or non-positive quantity, a priority other
                    than NORMAL or URGENT) is rejected and dead-lettered; no task is created.
                  required:
                  - request_id
                  - sku
                  - from_bin
                  - to_bin
                  - quantity
                  - priority
                  properties:
                    request_id:
                      type: string
                      minLength: 1
                      maxLength: 200
                      description: The replenishment request id (pick-face-replenishment). Published as
                        TaskCompleted.request_ref.
                    sku:
                      type: string
                      minLength: 1
                      description: The SKU to replenish.
                    from_bin:
                      type: string
                      minLength: 1
                      description: Source (reserve) bin.
                    to_bin:
                      type: string
                      minLength: 1
                      description: Destination bin (the pick face). Always different from from_bin.
                    quantity:
                      type: integer
                      format: int32
                      minimum: 1
                      description: The planned units to move. The operator confirms the actual count at
                        completion; it may differ.
                    priority:
                      type: string
                      enum:
                      - NORMAL
                      - URGENT
                      description: The request urgency. Recorded on the task and shown on its read model;
                        claimNext orders by CPT only (ADR-0050), so urgency is expressed upstream by an earlier CPT.
                pick:
                  type: object
                  description: Present ONLY on work released on the PICK path with scan confirmation
                    (ADR 0054; additive, the event stays v1). The pick plan the station scans against
                    (`POST /tasks/{id}/scans`). Absent on every other release and on a PICK released without
                    scan confirmation. A present object that is not a valid plan (blank sku, missing or
                    non-positive quantity, a unit other than EACH or CASE) is rejected and dead-lettered;
                    no task is created.
                  required:
                  - sku
                  - quantity
                  - unit
                  properties:
                    sku:
                      type: string
                      minLength: 1
                      description: The SKU to pick.
                    quantity:
                      type: integer
                      minimum: 1
                      description: The planned quantity in EACHES (the ledger unit), whatever the unit.
                    unit:
                      type: string
                      enum:
                      - EACH
                      - CASE
                      description: The unit the operator scans.
                    site_id:
                      type: string
                      description: 'Optional site the pick is worked at (ADR 0062; additive,
                        omit-when-unknown: the producer stamps it whenever it knows one). Together
                        with from_bin it is what makes the released PICK announcable to the
                        open-task pool: a pick missing either is not announced and completes
                        exactly as before.'
                    from_bin:
                      type: string
                      description: Optional source bin (the pick face).
                case_break:
                  type: object
                  description: Present ONLY on work released on the BREAK_CASE path (ADR 0054; additive,
                    the event stays v1). Break the sealed case `lpn` of `sku` into `loose_bin` for the EACH
                    pick `pick_task_id`. Absent on every other release. An object with a blank field or an
                    `lpn` that is not 1-64 characters of [A-Za-z0-9._-] is rejected and dead-lettered; no
                    task is created.
                  required:
                  - lpn
                  - sku
                  - loose_bin
                  - pick_task_id
                  properties:
                    lpn:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: '^[A-Za-z0-9._-]+$'
                      description: The sealed case's licence plate number.
                    sku:
                      type: string
                      minLength: 1
                    loose_bin:
                      type: string
                      minLength: 1
                      description: The bin the case is broken into.
                    pick_task_id:
                      type: string
                      minLength: 1
                      description: The EACH pick task this break serves.
      examples:
      - name: workReleased
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/wes-work-planning
          type: com.warehouse.wes.work-planning.workunit.WorkReleased
          subject: wu-8a1f
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:wes-work-planning:events:WorkReleased:v1
          data:
            path_id: pick-zone-a
            work_unit_id: wu-8a1f
            cpt: '2026-09-30T18:00:00Z'
            ref: release-1
            line_no: 2
      - name: workReleasedRelocate
        summary: RELOCATE work (ADR-0047) - one move of an approved slot plan; ref is the plan id and
          the relocation object carries the move (an Assign, so from_bin is omitted and scanned at
          completion).
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
