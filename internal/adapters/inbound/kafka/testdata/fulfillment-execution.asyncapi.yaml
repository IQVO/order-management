    WorkBatchFormed:
      x-no-consumer-reason: "pending: published only with PICK_BATCH_MODE on (ADR 0063); the contract names labor-performance (batch_size reporting) as the intended consumer, but labor-performance has no handler for it on develop."
      name: WorkBatchFormed
      title: WorkBatchFormed
      summary: A station's pick walk formed (ADR 0063).
      description: Raised when POST /stations/{stationId}/work-batches forms a walk, inside the
        same transaction that persists the batch. Published on `warehouse.fulfillment.events`,
        keyed (and `subject`-ed) by batch id. The anchor is exactly the task ClaimNext would
        have returned, so a consumer can treat the first member as today's dispatch and the
        rest as additions. Published only with PICK_BATCH_MODE on; with the fleet default off
        nothing is published. The intended consumer is labor-performance (batch_size reporting; no
        handler for it on its develop yet); also available to the warehouse console.
      contentType: application/cloudevents+json
      tags:
      - name: workbatch
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.workbatch.WorkBatchFormed
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:WorkBatchFormed:v1
            data:
              type: object
              required:
              - batch_id
              - station_id
              - cpt
              - formed_at
              - version
              - members
              properties:
                batch_id:
                  type: string
                  description: The formed batch's id.
                station_id:
                  type: string
                  description: The station holding the walk.
                cpt:
                  type: string
                  format: date-time
                  description: The batch's priority band — every member shares this CPT instant (D3).
                formed_at:
                  type: string
                  format: date-time
                  description: Formation instant; WorkBatchCompleted's walk_seconds is measured from it.
                version:
                  type: integer
                  format: int64
                  description: Aggregate version at formation (1).
                members:
                  type: array
                  minItems: 1
                  description: The stops in visit order (hint rank order, D6).
                  items:
                    type: object
                    required:
                    - task_id
                    - stop_seq
                    - compartment
                    properties:
                      task_id:
                        type: string
                        description: The member PICK task's id.
                      stop_seq:
                        type: integer
                        minimum: 1
                        description: The 1-based visit order of this stop.
                      compartment:
                        type: integer
                        minimum: 1
                        description: The cart position holding this task's items.
      examples:
      - name: workBatchFormed
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 7a2d3e4f-5a6b-7c80-9d0e-1f2a3b4c5d6e
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.workbatch.WorkBatchFormed
          subject: wb-20260930T150000.000000000
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:WorkBatchFormed:v1
          data:
            batch_id: wb-20260930T150000.000000000
            station_id: STN-07
            cpt: '2026-09-30T18:00:00Z'
            formed_at: '2026-09-30T15:00:00Z'
            version: 1
            members:
            - task_id: task-8a1f
              stop_seq: 1
              compartment: 1
            - task_id: task-9c2e
              stop_seq: 2
              compartment: 2
    WorkBatchCompleted:
      x-no-consumer-reason: "pending: published only with PICK_BATCH_MODE on (ADR 0063); the contract names labor-performance (batch_size reporting) as the intended consumer, but labor-performance has no handler for it on develop."
      name: WorkBatchCompleted
      title: WorkBatchCompleted
      summary: The walk's last open stop completed (ADR 0063).
      description: Raised when the last still-open member completes, in the same transaction
        that flips the batch to COMPLETED. Published on `warehouse.fulfillment.events`, keyed
        (and `subject`-ed) by batch id. walk_seconds is completion minus formation — the whole
        walk, not per-stop labor (per-stop durations stay on each member's own TaskCompleted,
        ADR 0064). Published only with PICK_BATCH_MODE on.
      contentType: application/cloudevents+json
      tags:
      - name: workbatch
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.workbatch.WorkBatchCompleted
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:WorkBatchCompleted:v1
            data:
              type: object
              required:
              - batch_id
              - station_id
              - member_count
              - walk_seconds
              - completed_at
              - version
              properties:
                batch_id:
                  type: string
                  description: The completed batch's id.
                station_id:
                  type: string
                  description: The station that walked it.
                member_count:
                  type: integer
                  minimum: 1
                  description: How many tasks the walk held at formation.
                walk_seconds:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Completion minus formation, whole seconds.
                completed_at:
                  type: string
                  format: date-time
                  description: When the last open member completed.
                version:
                  type: integer
                  format: int64
                  description: Aggregate version at completion.
      examples:
      - name: workBatchCompleted
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 8b3e4f5a-6b7c-8d90-0e1f-2a3b4c5d6e7f
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.workbatch.WorkBatchCompleted
          subject: wb-20260930T150000.000000000
          time: '2026-09-30T15:07:30Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:WorkBatchCompleted:v1
          data:
            batch_id: wb-20260930T150000.000000000
            station_id: STN-07
            member_count: 2
            walk_seconds: 450
            completed_at: '2026-09-30T15:07:30Z'
            version: 3
    WorkBatchAbandoned:
      x-no-consumer-reason: "pending: published only with PICK_BATCH_MODE on (ADR 0063); the contract names labor-performance (batch_size reporting) as the intended consumer, but labor-performance has no handler for it on develop."
      name: WorkBatchAbandoned
      title: WorkBatchAbandoned
      summary: Every member left the walk without completing (ADR 0063).
      description: Raised when the last still-open member detaches — its lease expired and the
        task returned to the pool through the existing sweep — in the same transaction that
        flips the batch to ABANDONED. The tasks themselves are NOT lost — each detaches through
        the ordinary lease-expiry path and stays claimable. Published on
        `warehouse.fulfillment.events`, keyed (and `subject`-ed) by batch id. Published only
        with PICK_BATCH_MODE on.
      contentType: application/cloudevents+json
      tags:
      - name: workbatch
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.workbatch.WorkBatchAbandoned
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:WorkBatchAbandoned:v1
            data:
              type: object
              required:
              - batch_id
              - station_id
              - member_count
              - abandoned_at
              - version
              properties:
                batch_id:
                  type: string
                  description: The abandoned batch's id.
                station_id:
                  type: string
                  description: The station that held it.
                member_count:
                  type: integer
                  minimum: 1
                  description: How many tasks the walk held at formation.
                abandoned_at:
                  type: string
                  format: date-time
                  description: When the last open member detached.
                version:
                  type: integer
                  format: int64
                  description: Aggregate version at abandonment.
      examples:
      - name: workBatchAbandoned
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
