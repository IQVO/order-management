asyncapi: 2.6.0
info:
  title: Fulfillment Execution Events API
  version: 2.0.0
  description: 'Kafka events produced and consumed by the **Fulfillment Execution** bounded context (WES
    subdomain).


    Every message — integration topic and analytics topic alike — is a **CloudEvents 1.0** event in the
    Kafka protocol binding''s *structured* content mode (ADR-0032): the Kafka message value is the JSON
    event, and every message carries the Kafka header `content-type: application/cloudevents+json; charset=UTF-8`
    plus W3C `traceparent`/`tracestate`. There is no other envelope.


    Required attributes: `specversion` (`1.0`), `id` (UUID v4, stable across outbox redelivery; the consumer
    idempotency key), `source` (`/warehouse/fulfillment-execution` for this service), `type` (`com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`),
    `subject` (aggregate id, equal to the Kafka key), `time` (occurred-at, UTC), `datacontenttype` (`application/json`)
    and `dataschema` (`urn:warehouse:<repo>:<events|analytics>:<EventName>:v<N>`). `data` uses snake_case
    keys.


    An event that is published on both the integration and analytics topics carries the same CloudEvents
    `type` attribute on each; `dataschema` names the payload shape. The `Analytics` prefix on the analytics
    message components below (for example `AnalyticsTaskCompleted`) is only the AsyncAPI component `name`
    (the `title` is the plain event name); the CloudEvents `type` const never carries it. A breaking payload
    change ships as a new `.v2` type with a new dataschema version.'
  contact:
    name: Fulfillment Execution Team
    url: https://github.com/claudioed/fulfillment-execution
    email: fulfillment-execution@warehouse-systems.internal
  license:
    name: Proprietary
    url: https://github.com/claudioed/fulfillment-execution
tags:
- name: fulfillment-execution
  description: The Fulfillment Execution bounded context (WES subdomain core).
- name: task
  description: Events raised by the Task aggregate.
- name: package
  description: Events raised by the Package aggregate.
- name: promise-feedback
  description: Events closing the promise feedback loop with order-management (ADR-0025).
- name: analytics
  description: Internal analytics stream for the throughput data product (ADR-0012).
- name: consumed
  description: Events published by sibling contexts and consumed by this service.
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Shared Kafka broker for warehouse-systems. Configured per service via KAFKA_BROKERS.
defaultContentType: application/cloudevents+json
channels:
  warehouse.fulfillment.events:
    description: Integration events published by Fulfillment Execution, keyed by aggregate id. Consumers
      dispatch on the full CloudEvents `type`.
    subscribe:
      operationId: consumeFulfillmentIntegrationEvents
      summary: Consume Fulfillment Execution integration events.
      description: Receive the TaskAvailable, TaskClaimed, TaskCompleted, TaskCPTMissed, PackageManifested,
        PackageDiverted, WeightDiscrepancyDetected, TransferPicked, TransferDispatched and TransferArrived
        CloudEvents this bounded context publishes — plus the pick-batching WorkBatchFormed,
        WorkBatchCompleted and WorkBatchAbandoned (ADR 0063, published only with PICK_BATCH_MODE on).
      tags:
      - name: fulfillment-execution
      message:
        oneOf:
        - $ref: '#/components/messages/TaskAvailable'
        - $ref: '#/components/messages/TaskClaimed'
        - $ref: '#/components/messages/TaskCompleted'
        - $ref: '#/components/messages/TaskCPTMissed'
        - $ref: '#/components/messages/PackageManifested'
        - $ref: '#/components/messages/PackageDiverted'
        - $ref: '#/components/messages/WeightDiscrepancyDetected'
        - $ref: '#/components/messages/TransferPicked'
        - $ref: '#/components/messages/TransferDispatched'
        - $ref: '#/components/messages/TransferArrived'
        - $ref: '#/components/messages/WorkBatchFormed'
        - $ref: '#/components/messages/WorkBatchCompleted'
        - $ref: '#/components/messages/WorkBatchAbandoned'
  warehouse.fulfillment.analytics:
    description: Internal analytics stream (ADR-0012), keyed by aggregate id; read by this service's own
      analytics projector.
    subscribe:
      operationId: consumeFulfillmentAnalyticsEvents
      summary: Consume Fulfillment Execution analytics events.
      description: Receive every analytics CloudEvent (dataschema `urn:warehouse:fulfillment-execution:analytics:*`).
      tags:
      - name: analytics
      message:
        oneOf:
        - $ref: '#/components/messages/AnalyticsTaskCreated'
        - $ref: '#/components/messages/AnalyticsTaskClaimed'
        - $ref: '#/components/messages/AnalyticsLeaseExpired'
        - $ref: '#/components/messages/AnalyticsTaskCompleted'
        - $ref: '#/components/messages/AnalyticsItemPicked'
        - $ref: '#/components/messages/AnalyticsPackageSealed'
        - $ref: '#/components/messages/AnalyticsWeightDiscrepancyDetected'
        - $ref: '#/components/messages/AnalyticsLabelApplied'
        - $ref: '#/components/messages/AnalyticsPackageDiverted'
        - $ref: '#/components/messages/AnalyticsPackageManifested'
        - $ref: '#/components/messages/AnalyticsWorkBatchFormed'
        - $ref: '#/components/messages/AnalyticsWorkBatchCompleted'
        - $ref: '#/components/messages/AnalyticsWorkBatchAbandoned'
  warehouse.work-planning.events:
    description: wes-work-planning's integration topic; this service consumes WorkReleased from it (consumer
      group `WORK_RELEASED_CONSUMER_GROUP`, default `fulfillment-execution`).
    publish:
      operationId: receiveWorkReleased
      summary: Receive WorkReleased from wes-work-planning.
      description: wes-work-planning publishes WorkReleased here; this service creates a Task for each
        new CloudEvents id.
      tags:
      - name: consumed
      message:
        $ref: '#/components/messages/WorkReleased'
  warehouse.process-path-management.events:
    description: process-path-management's integration topic; this service replays ProcessPath* events
      into its local catalogue only when `PATH_CATALOGUE_SOURCE=kafka` (default `file`). The consumer is
      group-less (it reads the whole topic from the earliest offset on every start to rebuild an in-memory
      cache), so it declares no consumer group.
    publish:
      operationId: receiveProcessPathEvents
      summary: Receive process-path catalogue events.
      description: process-path-management publishes ProcessPath* CloudEvents here; this service applies
        them to its in-memory catalogue.
      tags:
      - name: consumed
      message:
        oneOf:
        - $ref: '#/components/messages/ProcessPathCreated'
        - $ref: '#/components/messages/ProcessPathUpdated'
        - $ref: '#/components/messages/ProcessPathDeactivated'
  warehouse.product-master.events:
    description: product-master's integration topic (key and `subject` = SKU). This service runs two
      independent consumers on it, each under its own consumer group (the two must differ). ProductClassified
      feeds the local classification copy (ADR-0039) under `PRODUCT_CLASSIFICATION_CONSUMER_GROUP`, only
      when `PRODUCT_CLASSIFICATION_MODE=kafka`. ProductPackLevelDeclared and ProductPackLevelRetired feed the
      local PackView (ADR 0054) under the required `PACK_VIEW_CONSUMER_GROUP`, always on. Every other type
      on the topic (ProductRegistered, ProductDescriptionChanged, ProductDimensionsDeclared, ProductMeasured)
      is ignored.
    publish:
      operationId: receiveProductClassified
      summary: Receive ProductClassified, ProductPackLevelDeclared and ProductPackLevelRetired from product-master.
      description: product-master publishes the full classification of a SKU here. The CloudEvents `id` claim
        and the version-guarded upsert of `product_classification_copy` commit in one transaction; the offset
        is committed afterwards. A message is applied only when its `version` is greater than the stored one.
        A message that is not a valid CloudEvent, or whose payload breaks the contract, is logged at WARN
        and skipped. SealPackage reads the copy for its DOT hazard segregation check. The pack-level events
        follow the same delivery contract (CloudEvents `id` claim and version-guarded write in one
        transaction, offset committed afterwards; invalid payloads are logged at WARN and skipped).
      tags:
      - name: consumed
      message:
        oneOf:
        - $ref: '#/components/messages/ProductClassified'
        - $ref: '#/components/messages/ProductPackLevelDeclared'
        - $ref: '#/components/messages/ProductPackLevelRetired'
  warehouse.task-interleaving.events:
    description: task-interleaving's integration topic (key and `subject` = the station id). This service
      consumes only InterleavingHintIssued from it, into its local hint copy `interleaving_hints` (ADR-0051),
      under the consumer group from `TASK_INTERLEAVING_CONSUMER_GROUP`, only when `TASK_INTERLEAVING_MODE=kafka`.
      Every other type on the topic is ignored.
    publish:
      operationId: receiveInterleavingHintIssued
      summary: Receive InterleavingHintIssued from task-interleaving.
      description: task-interleaving publishes an advisory hint (never an assignment) of which open tasks
        a station could work next. The CloudEvents `id` claim and the per-station superseding upsert of
        `interleaving_hints` commit in one transaction; the offset is committed afterwards. One ACTIVE hint
        per station — a newer hint supersedes the previous one. claimNext uses the station's active,
        unexpired hint only as a tie-break inside one priority band (never across a CPT boundary) and fails
        open when no hint applies. A message that is not a valid CloudEvent, or whose payload breaks the
        contract, is logged at WARN and skipped.
      tags:
      - name: consumed
      message:
        $ref: '#/components/messages/InterleavingHintIssued'
components:
  messages:
    TaskCompleted:
      name: TaskCompleted
      title: TaskCompleted
      summary: A station finished a claimed task.
      description: Raised when the station holding the active claim completes the task. Published on `warehouse.fulfillment.events`,
        keyed (and `subject`-ed) by task id, enriched at publish time with `work_unit_id` (the task's
        order reference, so Work Planning can call RecordCompletion), and `associate_id`, `duration_seconds`,
        `task_type` for labor-performance (ADR-0014, ADR-0023), and the optional `order_ref` (the order
        key inventory-storage uses to confirm picks, ADR-0040) and `line_no` (the order line, so it can
        confirm that line's reservation, ADR-0041). A RELOCATE task's TaskCompleted also carries the
        executed slot-plan move in the additive fields `sku`, `from_bin`, `to_bin`, `quantity` and
        `relocation_ref` (ADR-0047), which inventory-storage applies to its ledger as a RelocateStock
        (its ADR 0039); they are omitted on every other task type. A REPLENISH task's TaskCompleted
        (ADR-0050) carries the same `sku`, `from_bin`, `to_bin` and `quantity` plus the additive
        `request_ref` (the replenishment request id) instead of `relocation_ref`; inventory-storage
        applies it as a RelocateStock with reason REPLENISHMENT (its ADR 0041), `source_ref` =
        `request_ref`. Consumed by wes-work-planning,
        labor-performance and inventory-storage.
      contentType: application/cloudevents+json
      tags:
      - name: task
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
            data:
              type: object
              required:
              - task_id
              - station_id
              - work_unit_id
              properties:
                task_id:
                  type: string
                  description: Completed task id.
                station_id:
                  type: string
                  description: Station that completed the task.
                work_unit_id:
                  type: string
                  description: The completed task's order reference (empty only when the task can no longer
                    be found at publish time).
                associate_id:
                  type: string
                  description: Occupant checked into the completing station at publish time; omitted when
                    none (e.g. a robot station).
                duration_seconds:
                  type: integer
                  description: Seconds between claim and completion; omitted when the claim time is unknown.
                  format: int64
                task_type:
                  type: string
                  enum:
                  - PICK
                  - PACK
                  - SLAM
                  - REBIN
                  - DISPATCH
                  - ARRIVAL
                  - RELOCATE
                  - REPLENISH
                  description: The completed task's own type; omitted only when the task can no longer
                    be found.
                order_ref:
                  type: string
                  description: The order the completed task belongs to; the key inventory-storage uses to
                    confirm picks. Optional and additive (the event stays v1) and omitted when the task
                    has no order reference. Distinct from work_unit_id, which for order work is the per-line
                    work unit id.
                line_no:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: The 1-based order line the completed task's work was released for (copied
                    from WorkReleased.line_no, ADR-0041); with order_ref it lets inventory-storage confirm
                    the pick of exactly that line's reservation. Optional and additive (the event stays
                    v1) and omitted when unknown (transfer work, a release without line_no, or an older
                    task). Never derived from the work_unit_id.
                sku:
                  type: string
                  minLength: 1
                  description: RELOCATE and REPLENISH only (ADR-0047, ADR-0050; additive, the event stays
                    v1). The SKU the executed move relocated, from WorkReleased.data.relocation.sku /
                    WorkReleased.data.replenishment.sku. Omitted on every other task type.
                from_bin:
                  type: string
                  minLength: 1
                  description: RELOCATE and REPLENISH only. The bin the stock left - the planned from_bin,
                    or for a RELOCATE Assign move the bin the operator scanned at completion.
                to_bin:
                  type: string
                  minLength: 1
                  description: RELOCATE and REPLENISH only. The bin the stock went to - the planned to_bin,
                    or for a RELOCATE Vacate move the reserve bin the operator scanned at completion.
                    Always different from from_bin.
                quantity:
                  type: integer
                  format: int32
                  minimum: 1
                  description: RELOCATE and REPLENISH only. The units the operator counted and confirmed
                    at completion (RELOCATE v1 moves the whole on-hand quantity of the SKU at from_bin; for
                    REPLENISH it is the confirmed count, which may differ from the planned quantity).
                relocation_ref:
                  type: string
                  minLength: 3
                  maxLength: 200
                  description: RELOCATE only. The move reference `<plan_id>:<move_seq>` copied from
                    WorkReleased.data.relocation; inventory-storage records it as the StockRelocated
                    source_ref, and slotting-optimization matches it back to the plan's move.
                request_ref:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: REPLENISH only (ADR-0050; additive, the event stays v1; mirrors
                    relocation_ref). The replenishment request id copied from
                    WorkReleased.data.replenishment.request_id; inventory-storage records it as the
                    StockRelocated source_ref (reason REPLENISHMENT) and pick-face-replenishment closes
                    the request by it. Omitted on every other task type.
                batch_id:
                  type: string
                  minLength: 1
                  description: PICK only, and only when the task completed into a work batch
                    (ADR 0063; additive, the event stays v1). The walk the completed pick was a
                    member of; with batch_size it lets labor-performance report batched and single
                    picks apart. Omitted on every non-batched completion, so the pre-batching
                    payload bytes are unchanged.
                batch_size:
                  type: integer
                  format: int32
                  minimum: 1
                  description: PICK only, and only when batch_id is present (ADR 0063). How many
                    tasks that walk held. Omitted together with batch_id.
      examples:
      - name: taskCompleted
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
          subject: task-8a1f
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
          data:
            task_id: task-8a1f
            station_id: station-03
            work_unit_id: wu-8a1f
            associate_id: worker-42
            duration_seconds: 245
            task_type: PICK
            order_ref: order-8a1f
            line_no: 2
      - name: taskCompletedRelocate
        summary: A RELOCATE task (a Vacate move, destination scanned) - the additive relocation fields
          are present and order_ref / line_no are absent (ADR-0047).
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
          subject: task-rel-1
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
          data:
            task_id: task-rel-1
            station_id: station-07
            work_unit_id: slot-plan-7-move-3
            duration_seconds: 90
            task_type: RELOCATE
            sku: SKU-1
            from_bin: FWD-A
            to_bin: RSV-2
            quantity: 12
            relocation_ref: 'plan-7:3'
      - name: taskCompletedReplenish
        summary: A REPLENISH task (ADR-0050) - the operator confirmed 20 of the 24 planned units; the
          additive fields are present with request_ref (no relocation_ref) and order_ref / line_no
          are absent.
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
          subject: task-rep-1
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
          data:
            task_id: task-rep-1
            station_id: station-07
            work_unit_id: replenish-req-9
            duration_seconds: 90
            task_type: REPLENISH
            sku: SKU-1
            from_bin: WH1-RSV-AMB-B02-03-02-C
            to_bin: WH1-FWD-AMB-A01-01-01-A
            quantity: 20
            request_ref: req-9
    TaskCPTMissed:
      name: TaskCPTMissed
      title: TaskCPTMissed
      summary: A task is still open (Pending or Claimed) past its CPT deadline.
      description: Raised by the CPT-missed sweep (`POST /cpt-miss-sweeps`, ADR-0025). Re-fires
        on every sweep pass while the task stays open past its CPT, so consumers must dedupe on their
        own (order-management's RepromiseOrder is idempotent by design). Published on `warehouse.fulfillment.events`,
        keyed by task id. Consumed by order-management.
      contentType: application/cloudevents+json
      tags:
      - name: task
      - name: promise-feedback
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.task.TaskCPTMissed
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:TaskCPTMissed:v1
            data:
              type: object
              required:
              - task_id
              - order_ref
              - cpt
              properties:
                task_id:
                  type: string
                  description: Task still open past its CPT.
                order_ref:
                  type: string
                  description: The task's order reference.
                task_type:
                  type: string
                  enum:
                  - PICK
                  - PACK
                  - SLAM
                  - REBIN
                  - DISPATCH
                  - ARRIVAL
                  description: The overdue task's own type; omitted when unknown.
                cpt:
                  type: string
                  description: The missed CPT deadline.
                  format: date-time
      examples:
      - name: taskCPTMissed
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.task.TaskCPTMissed
          subject: task-8a1f
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:TaskCPTMissed:v1
          data:
            task_id: task-8a1f
            order_ref: wu-8a1f
            task_type: PICK
            cpt: '2026-09-30T14:55:00Z'
    TaskAvailable:
      name: TaskAvailable
      title: TaskAvailable
      summary: A task entered or re-entered the open-task pool and is claimable.
      description: 'Raised in the same transaction as the state change, through the transactional outbox
        (ADR-0020), whenever a task ENTERS the pool (released from WorkReleased, or created through
        the API) or RE-ENTERS it (the lease-expiry sweep returned a claimed task to Pending, with a
        new `available_at`). Never raised on an idempotent replay or a rejected command. Published
        on `warehouse.fulfillment.events`, keyed by task id. Consumed by task-interleaving (its local
        copy of the open-task pool). A task whose location this service cannot determine is NOT announced
        (the consumer rejects an event without `site_id` and `from_location`): RELOCATE and REPLENISH
        tasks carry bins, so they are announced (ADR-0049, ADR-0050), and a PICK task whose plan carries
        both the site and the pick face (`WorkReleased.data.pick.site_id` + `from_bin`, the producer''s
        additive omit-when-unknown contract) is announced too (ADR-0062): a pick missing either is NOT
        announced, exactly like a move whose bins carry no site. A REPLENISH task knows both bins, so it
        is announced with the source bin first and the destination (pick face) bin last. A PICK task is
        announced with the pick face as both ends of the trip (the station it ends at is not known at
        announce time). A PACK / SLAM / REBIN / transfer task has no location in this service.'
      contentType: application/cloudevents+json
      tags:
      - name: task
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.task.TaskAvailable
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:TaskAvailable:v1
            data:
              type: object
              required:
              - task_id
              - task_type
              - site_id
              - from_location
              - to_location
              - required_capabilities
              - priority_band
              - available_at
              properties:
                task_id:
                  type: string
                  description: The pooled task; also the Kafka key and CloudEvents subject.
                task_type:
                  type: string
                  enum:
                  - PICK
                  - PACK
                  - SLAM
                  - REBIN
                  - DISPATCH
                  - ARRIVAL
                  - RELOCATE
                  - REPLENISH
                  description: The task's type (the process path claimNext scans).
                site_id:
                  type: string
                  description: The site the task is worked at - the first segment of the bin's facility-layout
                    LocationCode (`site-area-zone-aisle-bay-level-position`), derived from the task's own
                    bins, never looked up in another context. For a PICK (ADR-0062) it is the site of the
                    release's pick plan (`WorkReleased.data.pick.site_id`), never derived from the bin.
                from_location:
                  type: string
                  description: Where the operator must go first. RELOCATE - the source bin (for an Assign move,
                    whose source the operator scans at completion, the destination bin). REPLENISH - the
                    source (reserve) bin. PICK - the planned pick face (the plan's `from_bin`, ADR-0062).
                to_location:
                  type: string
                  description: Where the operator ends. RELOCATE - the destination bin (for a Vacate move,
                    whose destination the operator scans at completion, the source bin). REPLENISH - the
                    destination (pick face) bin. PICK - the pick face again (the station the operator ends
                    at is not known at announce time, so the one known point stands for both ends of the
                    trip, exactly like the one known bin of a RELOCATE Assign or Vacate, ADR-0062).
                required_capabilities:
                  type: array
                  description: The capabilities claimNext matches a station against, sorted; an empty array
                    (never null) when the task requires none.
                  items:
                    type: string
                cpt:
                  type: string
                  format: date-time
                  description: The task's committed promise time (UTC). Omitted when the task has none.
                priority_band:
                  type: string
                  description: 'OPAQUE. Equal across exactly the tasks claimNext orders as peers (same task type
                    and same CPT instant), different for any two it orders strictly. Today `<task_type>:<cpt
                    UTC RFC 3339>`; consumers compare for equality only and must not parse it (ADR-0049).
                    claimNext orders by CPT only, so the NORMAL or URGENT priority of a REPLENISH task does
                    not enter the band (ADR-0050).'
                available_at:
                  type: string
                  format: date-time
                  description: The instant the task became claimable (UTC) - the creation instant, or the
                    sweep instant on re-entry after a lease expiry.
