              const: "urn:warehouse:process-path-management:analytics:CPTScheduleChanged:v1"
            data:
              $ref: "#/components/schemas/CPTScheduleData"

    ProcessPathDeactivatedData:
      type: object
      required: [path_id]
      properties:
        path_id:
          type: string
          example: PACK
          description: >-
            required_capabilities/match_prefix/direct/cycle_time_p95/
            eligibility/intake are omitted (not empty-arrayed/zeroed) on a
            deactivation — it carries no definition data, only the
            PathId and the fact that it happened.

    ProcessPathData:
      type: object
      required: [path_id]
      properties:
        path_id:
          type: string
          description: The canonical identity of the path.
          example: PICK
        match_prefix:
          type: string
          description: >-
            Lower-case prefix a consumer matches a caller-supplied id
            against: id == match_prefix OR id starts with
            match_prefix + "-".
          example: pick
        direct:
          type: boolean
          description: >-
            A structural fact about this path's routing shape. Omitted
            from the payload when `false` (the Go field is `omitempty`);
            it is present, as `true`, only for a direct path. Consumers
            must treat an absent `direct` as `false`.
        required_capabilities:
          type: array
          items:
            type: string
          example: ["pick"]
        destination_location_role:
          type: string
          description: >-
            Optional declaration of what kind of facility-layout
            LocationRole this path's completed work is destined for
            (ADR 0006). Omitted entirely (not empty-stringed) when no
            destination role was declared for this path — the default,
            most common case.
          enum: ["Drop", "WorkCenter", "Shipping"]
          example: Drop
        cycle_time_p95:
          type: string
          description: >-
            The operator-declared p95 end-to-end cycle time from release
            into the path to manifest (ADR 0010). Encoded as a Go
            duration string (e.g. "2h0m0s").
          example: "24h0m0s"
        eligibility:
          $ref: "#/components/schemas/EligibilityData"
        intake:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["CUSTOMER_ORDER", "STOCK_TRANSFER", "SLOT_RELOCATION", "INVENTORY_CONTROL", "REPLENISHMENT"]
          description: >-
            The set of demand sources allowed to route work onto this path
            (ADR 0034), in canonical (sorted) order. Always present on
            ProcessPathCreated/Updated; `[]` means the path is reached only
            by an explicit path id from an upstream stage (PACK, REBIN,
            SLAM) and no demand source may select it. CUSTOMER_ORDER is
            order-management's order lines, STOCK_TRANSFER
            network-inventory-planning's transfer legs (via WES),
            SLOT_RELOCATION approved slot-plan moves (via WES),
            INVENTORY_CONTROL internal amnesty/damage/problem-solve work,
            REPLENISHMENT pick-face top-ups from pick-face-replenishment
            (via WES, ADR 0036).
            A consumer that receives no `intake` (a producer older than ADR
            0034) must treat it as unknown, not as `[]`.
          example: ["CUSTOMER_ORDER"]

    EligibilityData:
      type: object
      description: >-
        Rules a unit of work must satisfy to be routed to this path (ADR
        0010). Every field is omitted (not zero-valued) when unset; a
        fully permissive eligibility still appears as an empty object
        `{}`, never an absent field.
      properties:
        max_units_per_line:
          type: integer
          description: Omitted means unbounded; 1 is how a singles path is declared.
          example: 1
        required_product_attributes:
          type: array
          items:
            type: string
          example: ["giftWrap"]
        excluded_product_attributes:
          type: array
          items:
            type: string
          example: ["hazmat"]
        non_sortable:
          type: boolean
          example: true

    CPTScheduleData:
      type: object
      required: [site_id, timezone, cutoffs]
      properties:
        site_id:
          type: string
          description: >-
            The fulfillment site this schedule belongs to. Uses
            facility-layout's site identifier vocabulary but is not
            validated against it (this service has zero inbound
            dependency, ADR 0001).
          example: sp1
        timezone:
          type: string
          description: IANA zone, e.g. America/Sao_Paulo.
          example: America/Sao_Paulo
        cutoffs:
          type: array
          items:
            $ref: "#/components/schemas/CutoffData"

    CutoffData:
      type: object
      required: [cpt_id, local_time, days_of_week, ship_method, eligible_path_ids]
      properties:
        cpt_id:
          type: string
          description: Stable id, unique within the site.
          example: sp1-1500
        local_time:
          type: string
          description: Recurring daily cutoff, "HH:MM" 24-hour form.
          example: "15:00"
        days_of_week:
          type: array
          items:
            type: string
            enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          example: ["Mon", "Tue", "Wed", "Thu", "Fri"]
        ship_method:
          type: string
          description: Free-form label ("ground", "same-day"); no carrier integration exists in this fleet.
          example: ground
        eligible_path_ids:
          type: array
          items:
            type: string
          description: >-
            The path families that can make this cutoff. Consumers
            compute the next concrete occurrence of a cutoff themselves
            from (local_time, days_of_week, timezone) — this service
            never publishes absolute timestamps for a recurring rule.
          example: ["PICK", "PACK"]
