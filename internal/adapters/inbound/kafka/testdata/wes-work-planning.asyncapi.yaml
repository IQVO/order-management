    PathCapacityChanged:
      name: PathCapacityChanged
      title: Path Capacity Changed
      summary: >-
        This service reported a process path's remaining admission capacity
        for a specific CPT cutoff window.
      description: >-
        Raised when `SampleBacklog` is asked (via the optional `cutoffAt`
        query parameter on `GET /paths/{pathId}/telemetry`, see ADR-0018) to
        report the path's currently remaining admission capacity, correlated
        against a CPT cutoff timestamp. This PUBLISHES state this service
        already tracks on its own `WorkPool` aggregate (`wipLimit` minus
        current WIP) — it introduces no new domain concept or per-CPT
        capacity bucket. `known` is `false` for a FlowFed path (no hard
        admission ceiling — only an alarm threshold, which is not a capacity
        figure) or a ReleaseFed path with no WIP limit provisioned; when
        `known` is `false`, `remaining_units` is always `0`.

        `cutoff_at` is this service's own native CPT currency (a concrete
        RFC3339 timestamp), not process-path-management's site-schedule
        `cptId` string, which this service has zero dependency on. A future
        order-management consumer is responsible for correlating `cutoff_at`
        against its own cached `CPTWindow.CutoffAt` (exact match or nearest-
        window match) to resolve which `cptId` this figure applies to — see
        ADR-0018 for the full correlation-by-timestamp design and its
        accepted imprecision trade-off. Actively published to
        `warehouse.work-planning.events`.
      contentType: application/cloudevents+json
      tags:
        - name: workpool
      payload:
        $ref: "#/components/schemas/PathCapacityChangedEvent"
      examples:
        - name: pathCapacityChangedKnown
          summary: >-
            pick-to-tote (ReleaseFed, WIP limit 40, WIP 23) reports 17
            remaining units of admission capacity for the 02:00 UTC cutoff.
          payload:
            specversion: "1.0"
            id: 5c7d3f92-1b64-4a08-9e73-2f6a8c1d5b40
            source: /warehouse/wes-work-planning
            type: com.warehouse.wes.work-planning.workpool.PathCapacityChanged
            subject: pick-to-tote
            time: "2026-08-21T22:40:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:wes-work-planning:events:PathCapacityChanged:v1
            data:
              path_id: pick-to-tote
              cutoff_at: "2026-08-22T02:00:00Z"
              remaining_units: 17
              known: true
        - name: pathCapacityChangedUnknownFlowFed
          summary: >-
            pack-singles is FlowFed (no hard admission ceiling), so capacity
            is reported as unknown rather than derived from its alarm
            threshold.
          payload:
            specversion: "1.0"
            id: 6d8e4a03-2c75-4b19-8f84-3a7b9d2e6c51
            source: /warehouse/wes-work-planning
            type: com.warehouse.wes.work-planning.workpool.PathCapacityChanged
            subject: pack-singles
            time: "2026-08-21T22:41:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:wes-work-planning:events:PathCapacityChanged:v1
            data:
              path_id: pack-singles
              cutoff_at: "2026-08-22T03:00:00Z"
              remaining_units: 0
              known: false

    PathPlanDriftDetected:
      x-no-consumer-reason: "published for observability; no consumer in the fleet today"
      name: PathPlanDriftDetected
      title: Path Plan Drift Detected
      summary: >-
        This service's committed PathPlan and the labor plan Workforce
        Management committed for the same path disagree on planned heads.
      description: >-
        Raised by ADR-0019's reconciliation when the committed `PathPlan`
        planned heads differ from the heads in the latest
        `LaborPlanObserved` for the same path. Triggered from BOTH sides'
        commit (our `CommitShiftPlan` and the observed `ShiftPlanCommitted`
        projection), over one shared comparison, so whichever side commits
        second raises it. It states a fact, not a verdict: `drift_heads` is
        signed (`observed_planned_heads - wes_planned_heads`) and carries no
        opinion about which plan is right. Agreeing plans raise nothing, and
        nothing is raised while only one side has committed. Published
        through the transactional outbox with the state change.
      contentType: application/cloudevents+json
      tags:
        - name: plan
      payload:
        $ref: "#/components/schemas/PathPlanDriftDetectedEvent"
      examples:
        - name: pathPlanDriftDetected
          summary: >-
            Workforce committed 8 heads for pick-to-tote; our PathPlan has 6.
          payload:
            specversion: "1.0"
            id: 7e9f5b14-3d86-4c2a-9a95-4b8c0e3f7d62
            source: /warehouse/wes-work-planning
            type: com.warehouse.wes.work-planning.pathplan.PathPlanDriftDetected
            subject: pick-to-tote
            time: "2026-08-21T09:05:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:wes-work-planning:events:PathPlanDriftDetected:v1
            data:
              path_id: pick-to-tote
              wes_planned_heads: 6
              observed_planned_heads: 8
              drift_heads: 2
              observed_at: "2026-08-21T09:00:00Z"

