    WorkDemandReleasedEvent:
      title: WorkDemandReleased CloudEvent (consumed)
      description: >-
        CloudEvent envelope of network-inventory-planning's released
        transfer work demand, mirrored read-only from the producer's own
        contract. This service consumes it; it never publishes it.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type (the producer's own).
              const: "com.warehouse.wes.network-inventory-planning.workdemand.WorkDemandReleased"
            dataschema:
              type: string
              description: >-
                The producer's payload schema id. Overrides CloudEventBase's
                pattern (which only admits THIS repo's own urns): a consumed
                event carries the PRODUCER's urn.
              const: "urn:warehouse:network-inventory-planning:events:WorkDemandReleased:v1"
            data:
              type: object
              description: >-
                One released transfer demand leg. Every field is required by
                the producer; this service validates path_id against its
                process-path catalogue and work_kind against the declared
                enum before enqueueing the work unit.
              required:
                - demand_id
                - work_kind
                - transfer_ref
                - path_id
                - site_id
                - cpt
              properties:
                demand_id:
                  type: string
                  description: >-
                    Identity of the work demand. Becomes the deterministic
                    work_unit_id (and the generic operator `ref`) of the
                    enqueued work unit.
                work_kind:
                  type: string
                  description: Which leg of the transfer this demand executes.
                  enum:
                    - TRANSFER_PICK
                    - TRANSFER_DISPATCH
                    - TRANSFER_ARRIVAL
                transfer_ref:
                  type: string
                  description: The network transfer this demand belongs to.
                path_id:
                  type: string
                  description: >-
                    Process path the demand's work executes on (validated
                    against this service's process-path catalogue).
                site_id:
                  type: string
                  description: >-
                    Network site anchoring the leg — origin for
                    pick/dispatch, destination for arrival.
                cpt:
                  type: string
                  description: RFC3339 Critical Pull Time carried by the demand.
                sku:
                  type: string
                  description: OPTIONAL. SKU the demand moves, when known.
                quantity:
                  type: integer
                  description: OPTIONAL. Units of the SKU the leg moves.
                  minimum: 0

