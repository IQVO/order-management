asyncapi: 2.6.0

info:
  title: WES Work Planning & Release — Domain Events
  version: "1.0.0"
  description: |
    Asynchronous event contract for the **Work Planning & Release** bounded
    context, the core domain of the WES (Warehouse Execution System)
    subdomain. This service is the "conductor" of the distribution centre: it
    turns a shift's charge (volume due by each CPT) into a committed plan
    (rate x heads per process path), releases work continuously and
    waveless-ly into per-path work pools, and performs flow balancing
    (Drum-Buffer-Rope, with CPT as the drum) from live buffer telemetry. It
    sits downstream of WMS planning/inventory and upstream of WCS equipment
    control.

    ## Message format

    Every message this service produces or consumes on Kafka is a
    **CloudEvents 1.0 structured-mode** JSON document (mandatory fleet
    standard, ADR-0027 — there is no flat envelope, no dual-write/dual-read
    and no envelope toggle): the CloudEvents context attributes and the
    event-specific `data` payload travel together in a single JSON body, and
    every produced Kafka message carries the header
    `content-type: application/cloudevents+json; charset=UTF-8` next to the
    W3C `traceparent`/`tracestate` headers. All of `specversion` (`1.0`),
    `id`, `source` (always `/warehouse/wes-work-planning`), `type`,
    `subject` (the aggregate instance id), `time` (domain occurred-at, UTC),
    `datacontenttype` (`application/json`) and `dataschema`
    (`urn:warehouse:wes-work-planning:<events|analytics>:<EventName>:v1`) are
    required. `data` is described per message below.

    ## `type` naming convention

    The CloudEvents `type` attribute follows a reverse-DNS dotted convention
    shared by every bounded context in this program:

    ```
    com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>
    ```

    All segments are lowercase except the final PascalCase event name, which
    matches the past-tense domain event name used in the code. For this
    service the subdomain is `wes` and the bounded context is
    `work-planning`, so for example:

    ```
    com.warehouse.wes.work-planning.workunit.WorkReleased
    com.warehouse.wes.work-planning.charge.ChargeForecastReceived
    ```

    The `entity` segment names the aggregate (or aggregate cluster) that
    raises the event: `charge` for the ChargeForecast aggregate, `plan` for
    ShiftPlan/PathPlan, `workpool` for the WorkPool aggregate and the flow
    balancing decisions taken against it, and `workunit` for the WorkUnit
    aggregate.

    ## Catalog completeness vs. what is actually published

    This document is the **complete catalog** of the past-tense domain events
    declared by this bounded context (see `internal/domain/shared/events.go`),
    so that it is a usable reference for the whole domain model. Not every
    catalogued event is emitted onto Kafka today: the outbound adapter
    (`internal/adapters/outbound/kafka/publisher.go`) only sees the events
    that application use cases actually hand to `EventPublisher.Publish`. Any
    message that is not wired to the outbound adapter says so explicitly in
    its own `description`. Every raised event is written to the transactional
    outbox in the same transaction as the aggregate change and relayed to both
    Kafka topics (ADR-0014); there is no log-only publisher
    (`EVENT_PUBLISHER` accepts only `kafka`, ADR-0044).

    ## What this service consumes from other bounded contexts

    Work Planning is unusual in this program in that it is both a producer
    and a consumer of integration events. Those inbound streams are **not**
    part of this channel and are owned by their own bounded contexts; they
    are listed here only for orientation. Consumers dispatch on these exact
    CloudEvents `type` strings (never a short name or suffix match):

    ```
    com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted
    com.warehouse.wms.inventory-storage.reservation.StockReserved
    com.warehouse.wms.inventory-storage.reservation.ReservationRevoked
    com.warehouse.wes.fulfillment-execution.task.TaskCompleted
    com.warehouse.wes.order-management.order.OrderAllocated
    com.warehouse.wes.order-management.order.OrderPartiallyAllocated
    com.warehouse.wes.network-inventory-planning.workdemand.WorkDemandReleased
    com.warehouse.wms.slotting-optimization.slotplan.SlotPlanApproved
    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentRequested
    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentCancelled
    com.warehouse.wms.product-master.product.ProductClassified
    com.warehouse.wms.product-master.product.ProductPackLevelDeclared
    com.warehouse.wms.product-master.product.ProductPackLevelRetired
    com.warehouse.wms.product-master.product.ProductPackLevelMeasured
    com.warehouse.wes.process-path-management.processpath.ProcessPathCreated
    com.warehouse.wes.process-path-management.processpath.ProcessPathUpdated
    com.warehouse.wes.process-path-management.processpath.ProcessPathDeactivated
    ```

    A message that is not a valid CloudEvents 1.0 event (including the
    retired flat envelope) is dead-lettered to `<topic>.dlq` by the main
    consumer, or skipped with a WARN log by the catalogue and analytics
    consumers — never parsed as a legacy shape. This service also consumes
    `ShiftPlanCommitted` from workforce-management on
    `warehouse.workforce.events` (projected into the read-only
    `LaborPlanObserved` view — deliberately *not* fed into this context's own
    ShiftPlan aggregate, which is a different model that happens to share the
    name), `StockReserved` and `ReservationRevoked` from inventory-storage on
    `warehouse.inventory.events` (projected into the SKU-keyed
    `UsableInventoryObserved` view), `TaskCompleted` from
    fulfillment-execution on `warehouse.fulfillment.events` (fed into the
    `RecordCompletion` use case to close the execution feedback loop),
    `OrderAllocated`/`OrderPartiallyAllocated` from order-management on
    `warehouse.order-management.events` (fed into the existing
    `EnqueueWorkUnit` use case, once per order line — the event-choreography
    replacement for order-management's former synchronous call to
    `POST /paths/{pathId}/work-units`; deliberately fire-and-forget, with no
    reply event published back), and `WorkDemandReleased` from
    network-inventory-planning on
    `warehouse.network-inventory-planning.events` (fed into the existing
    `EnqueueWorkUnit` use case, one work unit per released transfer demand
    leg under the deterministic id `demand_id` — see ADR-0033; also
    fire-and-forget), and `ProductClassified` from product-master on
    `warehouse.product-master.events` (applied to this context's local
    classification copy, version-guarded, by a dedicated consumer under
    `PRODUCT_CLASSIFICATION_CONSUMER_GROUP`; the copy is what the
    `WorkReleased` encoder reads for its hazmat/fragile hints — see
    ADR-0035), `SlotPlanApproved` from slotting-optimization on
    `warehouse.slotting-optimization.events` (one `RELOCATE` work unit per
    move on path `RELOCATE`, older plans' unreleased moves cancelled — see
    ADR-0040), `ReplenishmentRequested` and `ReplenishmentCancelled` from
    pick-face-replenishment on `warehouse.pick-face-replenishment.events` (one
    `REPLENISH` work unit per request on path `REPLENISH`, cancelled while
    still Pending — see ADR-0042), and `ProductPackLevelDeclared`,
    `ProductPackLevelRetired` and `ProductPackLevelMeasured` from
    product-master on `warehouse.product-master.events` (applied to the local
    pack-level copy under `PACK_VIEW_CONSUMER_GROUP` — see ADR-0045). All
    consumer paths are idempotent under
    at-least-once redelivery: the CloudEvents `id` is recorded as processed
    in the SAME transaction as the event's effect (ADR-0028), so a failed
    attempt is retried and, once retries are exhausted, dead-lettered to
    `<topic>.dlq` — never acknowledged as already processed. A `TaskCompleted`
    whose `work_unit_id` names a work unit this context never planned (e.g.
    a PACK task fulfillment-execution created during rebin consolidation,
    which carries the order id) is a deliberate, INFO-logged skip: it is
    marked processed and neither retried nor dead-lettered. So is a
    `TaskCompleted` with a NEW event id for a work unit that is already
    completed (`TaskCompletedAlreadyCompleted`, ADR-0043): a stale fact,
    marked processed, neither retried nor dead-lettered.
  contact:
    name: WES Work Planning Team
    url: https://warehouse-systems.internal/teams/wes-work-planning
    email: wes-work-planning@warehouse-systems.internal
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

tags:
  - name: work-planning
    description: >-
      The Work Planning & Release bounded context — the core domain of the WES
      subdomain, responsible for planning the shift and releasing work.
  - name: charge
    description: >-
      Events raised by the ChargeForecast aggregate — the volume that must
      clear, bucketed by CPT.
  - name: plan
    description: >-
      Events raised by the ShiftPlan / PathPlan aggregates — the committed
      split of headcount and rate across process paths.
  - name: workpool
    description: >-
      Events raised by the WorkPool aggregate and by flow balancing against
      it — backlog telemetry, throttling and labor reassignment decisions.
  - name: workunit
    description: >-
      Events raised by the WorkUnit aggregate — a releasable unit of work
      carrying a CPT, from creation through release to completion.

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >-
      Production Kafka cluster shared by every warehouse-systems bounded
      context. Locally, a broker is available at localhost:9092 via
      ~/warehouse-systems/docker-compose.kafka.yml.

defaultContentType: application/cloudevents+json

channels:
  warehouse.work-planning.events:
    description: >-
      The outbound topic owned by the Work Planning & Release bounded context
      (`cloudevents.TopicWorkPlanningEvents` in the code). Every domain event
      this service emits is written here as a CloudEvents 1.0 event with
      `dataschema` `urn:warehouse:wes-work-planning:events:<EventName>:v1`,
      keyed by the aggregate id (the CloudEvents `subject`: work unit id for
      WorkUnit events, path id otherwise).
    subscribe:
      operationId: consumeWorkPlanningEvents
      summary: Consume domain events emitted by WES Work Planning & Release.
      description: >-
        Subscribe to this channel to receive every past-tense domain event
        raised by the Work Planning & Release bounded context. Messages are
        CloudEvents 1.0 structured-mode JSON. Consumers must be idempotent:
        delivery is at-least-once, and the CloudEvents `id` attribute is the
        de-duplication key. Consumers should also ignore `type` values they
        do not recognise, since new event types may be added to this channel
        without a major version bump.
      tags:
        - name: work-planning
      message:
        oneOf:
          - $ref: "#/components/messages/ChargeForecastReceived"
          - $ref: "#/components/messages/ShiftPlanCommitted"
          - $ref: "#/components/messages/WorkUnitCreated"
          - $ref: "#/components/messages/WorkReleased"
          - $ref: "#/components/messages/WorkUnitCompleted"
          - $ref: "#/components/messages/BacklogThresholdBreached"
          - $ref: "#/components/messages/RateDeviationDetected"
          - $ref: "#/components/messages/PathThrottled"
          - $ref: "#/components/messages/LaborReassignmentFlagged"
          - $ref: "#/components/messages/PathCapacityChanged"
          - $ref: "#/components/messages/PathPlanDriftDetected"

  warehouse.wes.analytics:
    description: >-
      The internal analytics topic (ADR-0011) feeding this service's own
      throughput data product (`cmd/wes-projector`). Same occurrences, same
      CloudEvents `type` per occurrence as the integration topic, but the
      analytics payload shape, identified by `dataschema`
      `urn:warehouse:wes-work-planning:analytics:<EventName>:v1` (this
      replaces the retired `schema_version` field). Keyed by the aggregate id
      (work unit id or path id), which is also the CloudEvents `subject`.
    subscribe:
      operationId: consumeWorkPlanningAnalytics
      summary: Consume the work-planning analytics stream.
      description: >-
        Subscribe to receive the analytics-shaped CloudEvents for every
        occurrence in the throughput data product's contract. Delivery is
        at-least-once; the CloudEvents `id` is the de-duplication key, and
        unknown `type` values must be ignored.
      tags:
        - name: work-planning
      message:
        oneOf:
          - $ref: "#/components/messages/ChargeForecastReceivedAnalytics"
          - $ref: "#/components/messages/ShiftPlanCommittedAnalytics"
          - $ref: "#/components/messages/WorkUnitCreatedAnalytics"
          - $ref: "#/components/messages/WorkReleasedAnalytics"
          - $ref: "#/components/messages/WorkUnitCompletedAnalytics"
          - $ref: "#/components/messages/BacklogThresholdBreachedAnalytics"
          - $ref: "#/components/messages/RateDeviationDetectedAnalytics"
          - $ref: "#/components/messages/PathThrottledAnalytics"
          - $ref: "#/components/messages/LaborReassignmentFlaggedAnalytics"
          - $ref: "#/components/messages/PathCapacityChangedAnalytics"
          - $ref: "#/components/messages/PathPlanDriftDetectedAnalytics"

  warehouse.workforce.events:
    description: >-
      workforce-management's integration topic, CONSUMED by this service
      (owned by that bounded context; listed here read-only for orientation).
      Read by the main consumer under `KAFKA_CONSUMER_GROUP` with a
      `warehouse.workforce.events.dlq`. Only ShiftPlanCommitted is consumed;
      every other type is ignored.
    publish:
      operationId: consumeWorkforceShiftPlanCommitted
      summary: Project workforce-management's ShiftPlanCommitted into the LaborPlanObserved view.
      description: >-
        ObserveLaborPlan upserts the read-only `LaborPlanObserved` view keyed
        by `path_id` (served by `GET /paths/{pathId}/labor-plan-view`) and
        reconciles it against this service's own committed PathPlan, raising
        `PathPlanDriftDetected` on a heads mismatch (ADR-0019). It is
        deliberately NOT fed into this service's own ShiftPlan aggregate
        (ADR-0006). The CloudEvents `id` is claimed in the same transaction
        as the effect. A message that is not a valid CloudEvent is published
        raw to the DLQ without retry.
      message:
        $ref: "#/components/messages/WorkforceShiftPlanCommitted"

  warehouse.fulfillment.events:
    description: >-
      fulfillment-execution's integration topic, CONSUMED by this service
      (owned by that bounded context; listed here read-only for orientation).
      Read by the main consumer under `KAFKA_CONSUMER_GROUP` with a
      `warehouse.fulfillment.events.dlq`. Only TaskCompleted is consumed.
    publish:
      operationId: consumeTaskCompleted
      summary: Close the execution feedback loop by completing the named work unit.
      description: >-
        ApplyTaskCompleted wraps `RecordCompletion` for the event's
        `work_unit_id`. A `work_unit_id` this context never planned (for
        example a PACK task created during rebin consolidation, which carries
        the order id) is an INFO-logged, processed skip; a NEW event id for an
        already-completed work unit is a stale fact, marked processed
        (ADR-0043). Neither is retried or dead-lettered. Any other failure is
        retried and then dead-lettered.
      message:
        $ref: "#/components/messages/TaskCompleted"

  warehouse.order-management.events:
    description: >-
      order-management's integration topic, CONSUMED by this service (owned
      by that bounded context; listed here read-only for orientation). Read
      by the main consumer under `KAFKA_CONSUMER_GROUP` with a
      `warehouse.order-management.events.dlq`. Only OrderAllocated and
      OrderPartiallyAllocated are consumed (identical payload shape).
    publish:
      operationId: consumeOrderAllocated
      summary: Enqueue one work unit per allocated order line.
      description: >-
        ApplyOrderAllocated feeds each line into `EnqueueWorkUnit` under the
        deterministic id `<order_id>-line-<line_no>` (reference = order id,
        `lineNo` = `line_no`, ADR-0031, ADR-0036). Fire-and-forget: no reply
        event is published. The CloudEvents `id` is claimed in the same
        transaction as the enqueue; a failure is retried and then
        dead-lettered.
      message:
        oneOf:
          - $ref: "#/components/messages/OrderAllocated"
          - $ref: "#/components/messages/OrderPartiallyAllocated"

  warehouse.process-path-management.events:
    description: >-
      process-path-management's integration topic, CONSUMED by this service
      only when `PATH_CATALOGUE_SOURCE=kafka` (owned by that bounded context;
      listed here read-only for orientation). Replayed from the earliest
      offset under a per-process consumer group (NOT `KAFKA_CONSUMER_GROUP`)
      into the in-memory process-path catalogue (ADR-0012). With the default
      `PATH_CATALOGUE_SOURCE=file` nothing is read from this topic.
    publish:
      operationId: consumeProcessPathEvents
      summary: Keep the process-path catalogue current.
      description: >-
        ProcessPathCreated and ProcessPathUpdated upsert a path definition;
        ProcessPathDeactivated removes it. Invalid CloudEvents are WARN-logged
        and skipped; unknown types are ignored. No DLQ.
      message:
        oneOf:
          - $ref: "#/components/messages/ProcessPathCreated"
          - $ref: "#/components/messages/ProcessPathUpdated"
          - $ref: "#/components/messages/ProcessPathDeactivated"

  warehouse.network-inventory-planning.events:
    description: >-
      network-inventory-planning's integration topic, CONSUMED by this
      service (owned by that bounded context; listed here read-only for
      orientation, mirroring its own apis/asyncapi.yaml). This service
      consumes only WorkDemandReleased and ignores every other type.
    publish:
      operationId: consumeWorkDemandReleased
      summary: Consume network-inventory-planning's released transfer work demands.
      description: >-
        Subscribe to receive WorkDemandReleased — one leg of an approved
        inter-site transfer that the network has released for warehouse
        execution. Messages are CloudEvents 1.0 structured-mode JSON
        (dataschema
        `urn:warehouse:network-inventory-planning:events:WorkDemandReleased:v1`)
        keyed by demand_id. Each demand is fed into ApplyWorkDemandReleased
        and becomes exactly one work unit under the deterministic id
        `demand_id` (ADR-0033), so redelivery is idempotent. An unknown
        `path_id` or `work_kind` fails loud and is dead-lettered to
        `<topic>.dlq`.
      message:
        $ref: "#/components/messages/WorkDemandReleased"

  warehouse.slotting-optimization.events:
    description: >-
      slotting-optimization's integration topic, CONSUMED by this service
      (owned by that bounded context; listed here read-only for orientation,
      mirroring its own apis/asyncapi.yaml). Key = the plan id. This service
      consumes only SlotPlanApproved and ignores SlotPlanGenerated,
      SlotPlanRejected and every other type (ADR-0040).
    publish:
      operationId: consumeSlotPlanApproved
      summary: Consume approved slot plans and plan their moves as RELOCATE work.
      description: >-
        Read under the shared consumer group with its own
        `warehouse.slotting-optimization.events.dlq`. Each SlotPlanApproved
        becomes one RELOCATE work unit per move (id `<plan_id>-move-<seq>`,
        seq = 0-based position in `moves`, ref = plan_id, path RELOCATE whose
        catalogue intake must admit SLOT_RELOCATION). A move into a slot that
        another move of the same plan vacates is held out of the pool until
        that move's unit completes. A newer approved plan for the same site
        cancels the older plan's not-yet-released units; released work runs
        to completion; an older or duplicate plan is a no-op. The CloudEvents
        `id` is claimed in the same transaction (redelivery is a no-op). A
        malformed plan, an unknown move kind or an intake without
        SLOT_RELOCATION is retried and then dead-lettered; a message
        interrupted by shutdown is never dead-lettered.
      message:
        $ref: "#/components/messages/SlotPlanApproved"

  warehouse.pick-face-replenishment.events:
    description: >-
      pick-face-replenishment's integration topic, CONSUMED by this service
      (owned by that bounded context; listed here read-only for orientation,
      mirroring its own apis/asyncapi.yaml). Key = the request id. This
      service consumes only ReplenishmentRequested and ReplenishmentCancelled
      and ignores ReplenishmentCompleted and every other type (ADR-0042).
    publish:
      operationId: consumeReplenishmentEvents
      summary: Consume replenishment requests and plan them as REPLENISH work.
      description: >-
        A dedicated consumer reads this topic under the stable consumer group
        `REPLENISHMENT_CONSUMER_GROUP` (`REPLENISHMENT_MODE` unset or `kafka`;
        `permissive`/`off` are boot errors, ADR-0044) with its own
        `warehouse.pick-face-replenishment.events.dlq`. Each
        ReplenishmentRequested becomes exactly ONE REPLENISH work unit (id
        `replenish-<request_id>`, ref = request_id, path REPLENISH, released
        with the additive `replenishment` object of WorkReleased); a
        redelivery of the same CloudEvents `id`, or a second DIFFERENT event
        for an already-planned request id, is a no-op. ReplenishmentCancelled
        cancels the request's unit only while it is still Pending (not yet
        released); released or completed work runs to completion, and a
        cancellation for an unknown request is a no-op. The CloudEvents `id`
        is claimed in the same transaction as the effect. Invalid
        CloudEvents (including the retired flat envelope) are WARN-logged and
        skipped; a payload that can never be applied is dead-lettered at
        once, any other failure is retried and then dead-lettered; a message
        interrupted by shutdown is never dead-lettered, and the offset is
        committed only after success.
      message:
        oneOf:
          - $ref: "#/components/messages/ReplenishmentRequested"
          - $ref: "#/components/messages/ReplenishmentCancelled"

  warehouse.product-master.events:
    description: >-
      product-master's integration topic, CONSUMED by this service (owned by
      that bounded context; listed here read-only for orientation, mirroring
      its own apis/asyncapi.yaml). Key = the SKU. This service consumes only
      ProductClassified (ADR-0035) and the pack-level types
      ProductPackLevelDeclared, ProductPackLevelRetired and
      ProductPackLevelMeasured into the local PackView (ADR-0045), and
      ignores every other type on the topic (ProductRegistered,
      ProductDescriptionChanged, ProductDimensionsDeclared, ProductMeasured).
      A second consumer reads this topic under the STABLE
      `PACK_VIEW_CONSUMER_GROUP` (mandatory; it must differ from
      `PRODUCT_CLASSIFICATION_CONSUMER_GROUP`, because a group that already
      committed past the pack events could never replay them).
    publish:
      operationId: consumeProductClassified
      summary: Consume product-master's ProductClassified into the local classification copy.
      description: >-
        A dedicated consumer reads this topic under the stable consumer group
        `PRODUCT_CLASSIFICATION_CONSUMER_GROUP` (only with
        `PRODUCT_CLASSIFICATION_MODE=kafka`) and keeps one row per SKU in
        `product_classification_copy`. It claims the CloudEvents `id` and
        applies the classification in ONE transaction, overwriting a stored
        row only when the incoming `version` is greater (an equal or older
        version is a no-op). Invalid CloudEvents and invalid payloads are
        WARN-logged and skipped; transient failures retry the same message
        and the offset is committed only after success.
      message:
        oneOf:
          - $ref: "#/components/messages/ProductClassified"
          - $ref: "#/components/messages/ProductPackLevelDeclared"
          - $ref: "#/components/messages/ProductPackLevelRetired"
          - $ref: "#/components/messages/ProductPackLevelMeasured"

  warehouse.inventory.events:
    description: >-
      inventory-storage's integration topic, CONSUMED by this service (owned
      by that bounded context; listed here read-only for orientation,
      mirroring its own apis/asyncapi.yaml). Key = the reservation id. This
      service consumes only StockReserved and ReservationRevoked (the
      integration payloads; both share one identical `data` shape) and
      ignores every other type on the topic.
    publish:
      operationId: consumeInventoryReservationEvents
      summary: Keep the SKU-keyed usable-inventory projection current.
      description: >-
        The shared inbound consumer applies each event to the SKU-keyed
        UsableInventoryObserved projection: StockReserved decrements the
        SKU's usable quantity by `quantity`, ReservationRevoked increments it
        back. Messages are CloudEvents 1.0 structured-mode JSON (dataschema
        `urn:warehouse:inventory-storage:events:<EventName>:v1`). Every other
        CloudEvents `type` on the topic is ignored; a message that is not a
        valid CloudEvent is logged at WARN and skipped.
      message:
        oneOf:
          - $ref: "#/components/messages/StockReserved"
          - $ref: "#/components/messages/ReservationRevoked"

components:
  messages:
    ChargeForecastReceived:
      x-no-consumer-reason: "published for observability; no consumer in the fleet today"
      name: ChargeForecastReceived
      title: Charge Forecast Received
      summary: A shift's charge forecast was recorded for a process path.
      description: >-
        Raised by the ChargeForecast aggregate when `ReceiveChargeForecast`
        records the volume due for a process path, bucketed by CPT. Actively
        published to `warehouse.work-planning.events` by the outbound Kafka
        adapter; the published `data` carries only `path_id`, since the CPT
        buckets themselves are read back over the REST API rather than
        broadcast.
      contentType: application/cloudevents+json
      tags:
        - name: charge
      payload:
        $ref: "#/components/schemas/ChargeForecastReceivedEvent"
      examples:
        - name: chargeForecastReceived
          summary: Charge forecast recorded for the pick-to-tote path.
          payload:
            specversion: "1.0"
            id: 4f1c2a7e-9d31-4a6b-8f0e-6b2c1d5e7a90
            source: /warehouse/wes-work-planning
            type: com.warehouse.wes.work-planning.charge.ChargeForecastReceived
            subject: pick-to-tote
            time: "2026-08-21T22:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:wes-work-planning:events:ChargeForecastReceived:v1
            data:
              path_id: pick-to-tote

    ShiftPlanCommitted:
      x-no-consumer-reason: "published for observability; no consumer in the fleet today"
      name: ShiftPlanCommitted
      title: Shift Plan Committed
      summary: A path's headcount, rate and hours split was committed.
      description: >-
        Raised by the ShiftPlan aggregate when `CommitShiftPlan` commits the
        rate x heads x hours split for a process path, after validating the
        invariant `plannedHeads <= installedStations`. Actively published to
        `warehouse.work-planning.events`; the published `data` carries only
        `path_id`. Beware the name collision: workforce-management publishes
        an unrelated `ShiftPlanCommitted` on `warehouse.workforce.events`
        that this service consumes into a read-only view. They are different
        models in different bounded contexts and must not be conflated.
      contentType: application/cloudevents+json
      tags:
        - name: plan
      payload:
        $ref: "#/components/schemas/ShiftPlanCommittedEvent"
      examples:
