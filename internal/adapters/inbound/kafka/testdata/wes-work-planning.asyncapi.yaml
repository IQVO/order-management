    WorkReleasedEvent:
      title: WorkReleased CloudEvent
      description: >-
        CloudEvent envelope for a work unit admitted into active work by the
        release policy.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type for this message.
              const: "com.warehouse.wes.work-planning.workunit.WorkReleased"
            dataschema:
              type: string
              description: Fixed integration-payload schema id for this message.
              const: "urn:warehouse:wes-work-planning:events:WorkReleased:v1"
            data:
              type: object
              description: >-
                Payload published by the outbound Kafka adapter, enriched
                from the WorkUnit repository with the unit's CPT and
                reference, the caller-stated gift-wrap request when one was
                made (see ADR-0010), and — when the released unit carries a
                known SKU — with derived hazmat-capability/fragile hints
                read once, at publish time, from the local copy of
                product-master's classification (see ADR-0009, ADR-0035).
              required:
                - path_id
                - work_unit_id
                - cpt
                - ref
              properties:
                path_id:
                  type: string
                  description: >-
                    Identifier of the process path the work was released
                    into.
                work_unit_id:
                  type: string
                  description: Identifier of the released work unit.
                line_no:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: >-
                    OPTIONAL (ADR-0036). The 1-based order line this released
                    unit was made for (1..2147483647, the 32-bit column
                    limit), stored on the `WorkUnit` from the
                    `OrderAllocated` line that created it (the same number
                    embedded in a work-unit id of the form
                    `<order>-line-<n>`) and read straight off it at publish
                    time, like `ref`. Present only when known: absent — never
                    `0` or `null` — for a unit created before this field
                    existed, a REST-enqueued unit that gave no `lineNo`, and
                    every transfer-referenced unit. Consumers must treat an
                    absent field as "line unknown" and keep working.
                  example: 3
                cpt:
                  type: string
                  description: >-
                    RFC3339 Critical Pull Time of the released unit — the
                    last moment it can be manifested and still make its
                    truck. Empty string if the unit could not be re-read at
                    publish time.
                ref:
                  type: string
                  description: >-
                    Caller-supplied business reference for the unit (for
                    example an order line). Empty string if the unit could
                    not be re-read at publish time.
                required_capabilities:
                  type: array
                  items:
                    type: string
                  description: >-
                    OPTIONAL. Present only when the released unit's SKU is
                    classified Hazmat by product-master, in which case it
                    contains exactly `["hazmat"]`. Absent — not an empty
                    array — when the SKU is unclassified, not yet in the
                    local copy, or the copy is unreadable
                    or a lookup error; the fail-open lookup never
                    blocks a release). Consumers must treat an absent field
                    identically to an empty array. See ADR-0009, ADR-0035.
                  example: ["hazmat"]
                fragile:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the released
                    unit's SKU is classified Fragile by product-master.
                    Absent — not `false` — when the SKU is unclassified,
                    unknown, or the lookup is unavailable. Consumers must
                    treat an absent field identically to `false`. See
                    ADR-0009, ADR-0035.
                  example: true
                gift_wrap:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the requester
                    asked the warehouse to produce a gift package for this
                    work unit, stated at enqueue time. This is a
                    caller-supplied `WorkReleased` characteristic, not a
                    derived product-classification hint — unlike
                    `required_capabilities`/`fragile`, it is read straight
                    off the `WorkUnit` and never looked up from
                    inventory-storage (see ADR-0010). Absent — not `false`
                    — when gift wrap was not requested. Consumers must
                    treat an absent field identically to `false`.
                  example: true
                work_kind:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0033). Present only on a
                    transfer-referenced work unit (one enqueued from
                    network-inventory-planning's WorkDemandReleased); names
                    the transfer leg it executes. Its presence is the
                    discriminator for "this is transfer work": every
                    order-driven unit omits all four transfer fields, so
                    its payload is byte-identical to before transfer
                    support existed. Consumers must treat absent as "not
                    transfer work".
                  enum:
                    - TRANSFER_PICK
                    - TRANSFER_DISPATCH
                    - TRANSFER_ARRIVAL
                  example: TRANSFER_PICK
                transfer_ref:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0033). The network transfer reference this
                    released unit executes a leg of. Present only on a
                    transfer-referenced unit, and only when the demand
                    carried one.
                  example: TRF-2026-042
                site_id:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0048). The site the released work happens
                    at, published for EVERY work kind whose unit carries a
                    site: a transfer leg's network site (ADR-0033), an order
                    unit's fulfillment site (read from OrderAllocated /
                    OrderPartiallyAllocated's additive site_id), a RELOCATE
                    unit's plan site, a REPLENISH unit's request site.
                    Absent — never an empty string — when the unit has none;
                    consumers must treat absent as "site unknown".
                  example: WH1
                quantity:
                  type: integer
                  description: >-
                    OPTIONAL (ADR-0033). Units of the SKU this transfer leg
                    moves. Present only on a transfer-referenced unit that
                    carried a positive quantity.
                  minimum: 0
                  example: 17
                relocation:
                  type: object
                  description: >-
                    OPTIONAL (ADR-0040). Present only on a RELOCATE work unit
                    (one planned from slotting-optimization's
                    SlotPlanApproved): the slot-plan move it executes,
                    exactly the object fulfillment-execution's RELOCATE task
                    decodes (its ADR 0047). Absent on order and transfer
                    work, whose payloads are byte-identical to before.
                    RELOCATE work never carries `work_kind`/`transfer_ref`.
                  required:
                    - plan_id
                    - move_seq
                    - kind
                    - sku
                  properties:
                    plan_id:
                      type: string
                      description: The approved slot plan this move belongs to.
                      example: plan-3b0e8d2a
                    move_seq:
                      type: integer
                      minimum: 0
                      description: >-
                        0-based position of the move in the plan's published
                        `moves`; always present, `0` included.
                      example: 1
                    kind:
                      type: string
                      enum: [Relocate, Assign, Vacate]
                      example: Relocate
                    sku:
                      type: string
                      example: SKU-2
                    from_bin:
                      type: string
                      description: Slot the stock leaves; absent for Assign.
                      example: WH1-FWD-A02-03-01-A
                    to_bin:
                      type: string
                      description: Slot the stock lands in; absent for Vacate.
                      example: WH1-FWD-A01-01-02-A
                replenishment:
                  type: object
                  description: >-
                    OPTIONAL (ADR-0042). Present only on a REPLENISH work unit
                    (one planned from pick-face-replenishment's
                    ReplenishmentRequested, released on the `REPLENISH` path):
                    the pick-face replenishment move it executes, exactly the
                    object fulfillment-execution's REPLENISH task decodes (its
                    ADR 0050). Absent on order, transfer and RELOCATE work,
                    whose payloads are byte-identical to before. REPLENISH
                    work never carries `relocation`, `work_kind` or
                    `transfer_ref`. All six members are always present.
                  required:
                    - request_id
                    - sku
                    - from_bin
                    - to_bin
                    - quantity
                    - priority
                  properties:
                    request_id:
                      type: string
                      description: The pick-face-replenishment request; one work unit per request id.
                      example: repl-9c2f6b1e-5d3a-4e8b-a7f0-1b2c3d4e5f60
                    sku:
                      type: string
                      example: SKU-2
                    from_bin:
                      type: string
                      description: Reserve bin the stock leaves.
                      example: WH1-RSV-A07-03-02-B
                    to_bin:
                      type: string
                      description: Forward pick face the stock lands in; differs from from_bin.
                      example: WH1-FWD-A01-01-02-A
                    quantity:
                      type: integer
                      minimum: 1
                      example: 6
                    priority:
                      type: string
                      enum: [NORMAL, URGENT]
                      description: >-
                        URGENT requests are released with a CPT of
                        requested_at + `REPLENISHMENT_URGENT_CPT_HORIZON`
                        (default 1h) against `REPLENISHMENT_CPT_HORIZON`
                        (default 8h) for NORMAL, so they sit in the front
                        band of every earliest-CPT-first queue.
                      example: URGENT
                pick:
                  type: object
                  description: >-
                    OPTIONAL (ADR-0045). Present only on a `CASE_PICK` /
                    `EACH_PICK` work unit (enqueued with `quantity`,
                    `pickUnit` or `fromBin`). Absent on every other unit.
                  required: [sku, quantity, unit]
                  properties:
                    sku:
                      type: string
                      example: SKU-2
                    quantity:
                      type: integer
                      minimum: 1
                      description: Quantity in eaches.
                      example: 36
                    unit:
                      type: string
                      enum: [EACH, CASE]
                      example: CASE
                    site_id:
                      type: string
                      description: >-
                        OPTIONAL (ADR-0048). The site the pick happens at —
                        the released unit's site, repeated here so a pick
                        consumer reads one object. Absent when the unit has
                        none.
                      example: WH1
                    from_bin:
                      type: string
                      description: >-
                        Source bin: caller-given at enqueue, or derived at
                        enqueue from the local slot-plan copy (the SKU's
                        forward-pick face, ADR-0048). Absent when neither
                        exists — the unit then completes exactly as before.
                      example: BIN-A1
                case_break:
                  type: object
                  description: >-
                    OPTIONAL (ADR-0045). Present only on a `BREAK_CASE` work
                    unit (enqueued with `caseBreak`). Absent on every other
                    unit.
                  required: [lpn, sku, loose_bin, pick_task_id]
                  properties:
                    lpn:
                      type: string
                      description: Licence plate of the sealed case.
                      example: LPN-0001
                    sku:
                      type: string
                      example: SKU-2
                    loose_bin:
                      type: string
                      example: LOOSE-A1
                    pick_task_id:
                      type: string
                      example: task-482910

