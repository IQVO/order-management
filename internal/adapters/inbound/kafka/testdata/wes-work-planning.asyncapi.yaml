    ProductClassifiedEvent:
      title: ProductClassified CloudEvent (consumed)
      description: >-
        CloudEvent envelope of product-master's ProductClassified, mirrored
        read-only from the producer's own contract. This service consumes it;
        it never publishes it.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
