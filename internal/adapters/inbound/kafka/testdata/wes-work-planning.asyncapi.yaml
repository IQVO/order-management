                  enum:
                    - Ambient
                    - Chilled
                    - Frozen
                dot_hazard_class:
                  type: integer
                  description: OPTIONAL. Present only with Hazmat. Stored, not surfaced.
                  minimum: 1
                  maximum: 9
                classification_source:
                  type: string
                  description: Migration artefact of the producer; ignored here.
                  enum:
                    - native
                    - legacy-import
                version:
                  type: integer
                  description: >-
                    The producer's aggregate version after the change. The
                    local copy applies a message only when this is greater
                    than the stored version.
