  /containers/{lpn}/stowages:
    post:
      operationId: stowContainer
      summary: Stow a sealed case into a case bin
      description: >-
        Scan the LPN, scan the location (ADR 0045). The bin must accept
        sealed cases (handling unit CASE or PALLET, as published by
        facility-layout); a bin whose handling unit is unknown or EACH is
        409 `bin-handling-unit-mismatch` (fail closed). The first stow sets
        the container's site from the bin's site (a carton event carries no
        site) and creates the SEALED_CASE stock unit holding the case's
        eaches; moving a stowed container to another bin of the same site
        is allowed, to another site is 409 `container-not-at-site`.
        Stowing into the bin it is already in is a no-op.


        Behind the Idempotency-Key middleware like the other creating POSTs
        (ADR 0018).
      tags: [Containers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: lpn
          in: path
          required: true
          description: The container's license plate (the carton SSCC, or an internal `LPN-<site>-<id>`).
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9._-]+$'
            example: "003400000000000017"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bin]
              properties:
                bin:
                  type: string
                  minLength: 1
                  description: The case bin to stow into.
                  example: WH1-STOR-AMB-A01-01-01-A
            example:
              bin: WH1-STOR-AMB-A01-01-01-A
      responses:
        "200":
          description: The stowed container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
              example:
                lpn: "003400000000000017"
                sku: SKU-1
                gtin: "24006381333935"
                unitsPerPack: 12
                qtyEaches: 12
                ownerRef: seller-a
                siteId: WH1
                binId: WH1-STOR-AMB-A01-01-01-A
                state: SEALED
                lot: L1
                expiry: "2027-03-01"
                stockUnitId: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
                receiptId: rcpt-1
                lineNo: 1
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: Malformed body, an empty bin, or the Idempotency-Key header absent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptyBinId:
                  summary: "Bin ID must not be empty"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-bin-id
                    title: Bin ID must not be empty
                    status: 400
                    detail: bin id must not be empty
                    instance: /containers/003400000000000017/stowages
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /containers/003400000000000017/stowages
        "404":
          description: The container or the bin is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/container-not-found
                title: Container not found
                status: 404
                detail: container not found
                instance: /containers/NOPE/stowages
        "409":
          description: >-
            The bin does not accept sealed cases (bin-handling-unit-mismatch),
            the container is not SEALED (container-not-sealed), the bin is in
            another site (container-not-at-site), the bin has no room
            (bin-full), or a concurrent writer changed it
            (concurrent-modification).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                binHandlingUnitMismatch:
                  summary: "Bin does not accept this kind of handling unit"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-handling-unit-mismatch
                    title: Bin does not accept this kind of handling unit
                    status: 409
                    detail: bin does not accept this handling unit
                    instance: /containers/003400000000000017/stowages
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /containers/003400000000000017/stowages
        "500":
          $ref: "#/components/responses/InternalError"

  /containers/{lpn}/case-breaks:
    post:
      operationId: breakCase
      summary: Break a sealed case into loose eaches
      description: >-
        BreakCase (ADR 0045): the whole sealed case is opened and its eaches
        move to loose stock of the same owner in `looseBin`. Full-quantity
        and conserving: exactly `unitsPerPack` eaches leave the SEALED_CASE
        unit and arrive as loose stock, and the container goes SEALED, OPEN,
        EMPTY in one transaction, with `CaseBroken` and `ContainerEmptied`
        in the transactional outbox. A case that is reserved (a `cases`
        reservation) cannot be broken; a container that is not SEALED and
        stowed cannot either; `looseBin` must accept loose eaches and be in
        the container's site.


        Behind the Idempotency-Key middleware (ADR 0018).
      tags: [Containers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: lpn
          in: path
          required: true
          description: The container's license plate (the carton SSCC, or an internal `LPN-<site>-<id>`).
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9._-]+$'
            example: "003400000000000017"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [looseBin]
              properties:
                looseBin:
                  type: string
                  minLength: 1
                  description: The bin that receives the loose eaches.
                  example: WH1-PICK-AMB-B01-01-01-A
            example:
              looseBin: WH1-PICK-AMB-B01-01-01-A
      responses:
        "200":
          description: The container, now EMPTY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
              example:
                lpn: "003400000000000017"
                sku: SKU-1
                gtin: "24006381333935"
                unitsPerPack: 12
                qtyEaches: 12
                ownerRef: seller-a
                siteId: WH1
                state: EMPTY
                lot: L1
                expiry: "2027-03-01"
                stockUnitId: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
                receiptId: rcpt-1
                lineNo: 1
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: Malformed body, an empty looseBin, or the Idempotency-Key header absent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptyBinId:
                  summary: "Bin ID must not be empty"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-bin-id
                    title: Bin ID must not be empty
                    status: 400
                    detail: bin id must not be empty
                    instance: /containers/003400000000000017/case-breaks
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /containers/003400000000000017/case-breaks
        "404":
          description: The container or the bin is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/container-not-found
                title: Container not found
                status: 404
                detail: container not found
                instance: /containers/NOPE/case-breaks
        "409":
          description: >-
            The container is not SEALED (container-not-sealed) or not stowed
            (container-not-stowed), it is reserved (container-reserved), the
            unit does not hold exactly the case (break-not-conserving),
            looseBin does not accept loose eaches (bin-handling-unit-mismatch),
            looseBin is in another site (container-not-at-site) or has no
            room (bin-full), or a concurrent writer changed it
            (concurrent-modification).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                containerReserved:
                  summary: "Container is reserved"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/container-reserved
                    title: Container is reserved
                    status: 409
                    detail: container is reserved
                    instance: /containers/003400000000000017/case-breaks
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /containers/003400000000000017/case-breaks
        "500":
          $ref: "#/components/responses/InternalError"

  /bins/{binId}/containers:
    get:
      operationId: listBinContainers
      summary: List the containers stowed in a bin
      description: >-
        The sealed or open containers stowed in the bin (ADR 0045), ordered
        by LPN (which is unique, so it is both the sort key and the id of
        the keyset cursor). Empty containers have no bin and are not
        listed. Keyset-paginated (REST guideline section 3): one page of
        `{items, nextCursor}`, `limit` (1-500, default 100) and the opaque
        `cursor` from the previous page's `nextCursor`; `nextCursor` is
        absent on the last page. Any other query parameter is 400
        `unknown-query-parameter`. Side-effect-free.
      tags: [Containers]
      parameters:
        - name: binId
          in: path
          required: true
          description: The bin to inspect.
          schema:
            type: string
            example: WH1-STOR-AMB-A01-01-01-A
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the containers in the bin (possibly none), ordered by LPN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerPage"
              example:
                items:
                  - lpn: "003400000000000017"
                    sku: SKU-1
                    gtin: "24006381333935"
                    unitsPerPack: 12
                    qtyEaches: 12
                    ownerRef: seller-a
                    siteId: WH1
                    binId: WH1-STOR-AMB-A01-01-01-A
                    state: SEALED
                    lot: L1
                    expiry: "2027-03-01"
                    stockUnitId: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
                    receiptId: rcpt-1
                    lineNo: 1
        "400":
          description: >-
            `limit` is not an integer between 1 and 500 (invalid-limit), or
            `cursor` is not a page token this API issued (invalid-cursor), or
            any query parameter other than `limit` and `cursor` was sent
            (unknown-query-parameter).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidLimit:
                  summary: limit is not an integer between 1 and 500
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-limit
                    title: "limit must be an integer between 1 and 500"
                    status: 400
                    detail: "limit must be an integer between 1 and 500"
                    instance: /bins/WH1-STOR-AMB-A01-01-01-A/containers
                invalidCursor:
                  summary: cursor was not issued by this API
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-cursor
                    title: "cursor is not a valid page token"
                    status: 400
                    detail: "cursor is not a valid page token"
                    instance: /bins/WH1-STOR-AMB-A01-01-01-A/containers
                unknownQueryParameter:
                  summary: a query parameter the collection does not declare
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/unknown-query-parameter
                    title: the collection does not declare this query parameter
                    status: 400
                    detail: "unknown query parameter: after"
                    instance: /bins/WH1-STOR-AMB-A01-01-01-A/containers
        "404":
          description: The bin is not registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                title: Bin not found
                status: 404
                detail: bin not found
                instance: /bins/NOPE/containers
        "500":
          $ref: "#/components/responses/InternalError"

  /held-stock:
    get:
      operationId: listHeldStock
      summary: List the units held out of usable stock
      description: >-
        The units still HELD (ADR 0052), oldest first (ties by id), filtered by
        `reason`, `sku` and age (`olderThanHours`: held for MORE than that
        many hours). A removed unit (released, returned, scrapped) is not
        listed; read it by id for its audit trail. Keyset-paginated (REST
        guideline section 3): `{items, nextCursor}`, `limit` (1-500, default
        100) and the opaque `cursor`. Any other query parameter is 400
        `unknown-query-parameter`. Side-effect-free.
      tags: [HeldStock]
      parameters:
        - name: reason
          in: query
          required: false
          description: Only units held for this reason.
          schema:
            type: string
            enum: [DAMAGED, QC_PENDING, SUSPECT, OTHER]
        - name: sku
          in: query
          required: false
          description: Only units of this SKU.
          schema:
            type: string
            example: SKU-1
        - name: olderThanHours
          in: query
          required: false
          description: Only units held for more than this many hours (the ageing filter).
          schema:
            type: integer
            minimum: 0
            example: 24
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of held units (possibly none), oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldUnitPage"
              example:
                items:
                  - id: hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64
                    sku: SKU-1
                    quantity: 4
                    reason: DAMAGED
                    state: HELD
                    receiptId: rcpt-1
                    asnNumber: ASN-1
                    lineNo: 2
                    ownerRef: seller-a
                    sscc: "003400000000000017"
                    lpns: ["003400000000000017"]
                    heldAt: "2026-11-09T07:00:00Z"
                    reworkCount: 0
        "400":
          description: >-
            `reason` is not a hold reason (invalid-hold-reason),
            `olderThanHours` is not a non-negative integer
            (invalid-older-than-hours), `limit` or `cursor` is invalid
            (invalid-limit, invalid-cursor), or an undeclared query parameter
            was sent (unknown-query-parameter).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/invalid-hold-reason
                title: reason must be DAMAGED, QC_PENDING, SUSPECT or OTHER
                status: 400
                detail: "unknown hold reason: BROKEN"
                instance: /held-stock
        "500":
          $ref: "#/components/responses/InternalError"

  /held-stock/{id}:
    get:
      operationId: getHeldUnit
      summary: Read one held unit
      description: >-
        A held unit with its receipt line, owner, carton marks and, once
        decided, its disposition. A unit that was released, returned or
        scrapped stays readable here as the audit trail. Side-effect-free.
      tags: [HeldStock]
      parameters:
        - $ref: "#/components/parameters/HeldUnitId"
      responses:
        "200":
          description: The held unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldUnit"
              example:
                id: hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64
                sku: SKU-1
                quantity: 4
                reason: DAMAGED
                state: HELD
                receiptId: rcpt-1
                asnNumber: ASN-1
                lineNo: 2
                ownerRef: seller-a
                lpns: []
                heldAt: "2026-11-09T07:00:00Z"
                reworkCount: 0
        "404":
          description: No held unit has this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/held-unit-not-found
                title: Held unit not found
                status: 404
                detail: held unit not found
                instance: /held-stock/hu-missing
        "500":
          $ref: "#/components/responses/InternalError"

  /held-stock/{id}/dispositions:
    post:
      operationId: decideHeldDisposition
      summary: Decide what happens to a held unit
      description: >-
        The disposition decision (ADR 0052). RELEASE returns the quantity to
        usable stock through the same staged-receipt seam as a fresh receipt
        (it is usable once stowed) and emits `StockReleased`;
        RETURN_TO_VENDOR and SCRAP remove the unit; REWORK keeps it HELD under
        a new `reason` (default OTHER). Every decision emits
        `StockDispositioned`. The decision, the unit's save and the events are
        one transaction. A unit that already has a final disposition is 409
        `held-unit-closed`.


        Behind the Idempotency-Key middleware like the other creating POSTs
        (ADR 0018).
      tags: [HeldStock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/HeldUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition:
                  type: string
                  enum: [RELEASE, RETURN_TO_VENDOR, SCRAP, REWORK]
                reason:
                  type: string
                  enum: [DAMAGED, QC_PENDING, SUSPECT, OTHER]
                  description: The new hold reason; read only for REWORK.
            example:
              disposition: RETURN_TO_VENDOR
      responses:
        "200":
          description: The unit after the decision (REMOVED, or still HELD for REWORK).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldUnit"
              example:
                id: hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64
                sku: SKU-1
                quantity: 4
                reason: DAMAGED
                state: REMOVED
                receiptId: rcpt-1
                asnNumber: ASN-1
                lineNo: 2
                ownerRef: seller-a
                lpns: []
                heldAt: "2026-11-09T07:00:00Z"
                disposition: RETURN_TO_VENDOR
                decidedAt: "2026-11-09T12:00:00Z"
                reworkCount: 0
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: Malformed body, or the Idempotency-Key header absent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                instance: /held-stock/hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64/dispositions
        "404":
          description: No held unit has this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/held-unit-not-found
                title: Held unit not found
                status: 404
                detail: held unit not found
                instance: /held-stock/hu-missing/dispositions
        "409":
          description: >-
            The unit already has a final disposition (held-unit-closed), or a
            concurrent writer changed it (concurrent-modification). The same
            Idempotency-Key reused with a different method, path or body is
            also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/held-unit-closed
                title: Held unit already has a final disposition
                status: 409
                detail: held unit already has a final disposition
                instance: /held-stock/hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64/dispositions
        "422":
          description: The disposition is not one of the four (invalid-disposition), or the REWORK reason is not a hold reason (invalid-hold-reason).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/invalid-disposition
                title: Disposition must be RELEASE, RETURN_TO_VENDOR, SCRAP or REWORK
                status: 422
                detail: invalid disposition
                instance: /held-stock/hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64/dispositions
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/flow-accuracy:
    get:
      operationId: getFlowAccuracyReport
      summary: Inventory Flow & Accuracy report (hourly)
      description: >
        Read-only analytical report over the inventory-storage event
        stream (ADR 0011): per (SKU, bin, hour) received/stowed/picked
        quantities, reservation lifecycle counts, and cycle-count
        accuracy signals. Served by the `inventory-reports` deployment
        from its own read-only pool (ADR 0020 §CQRS split); the OLTP
        `inventory` binary does not serve this path. `from` and `to` are
        required RFC 3339 timestamps; `sku` and `binId` narrow the result;
        `granularity` is currently only `hour`. Side-effect-free and
        unauthenticated (ADR 0015).
      tags: [Reports]
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start of the window, RFC 3339.
          schema:
            type: string
            format: date-time
            example: "2026-10-01T00:00:00Z"
        - name: to
          in: query
          required: true
          description: End of the window, RFC 3339.
          schema:
            type: string
            format: date-time
            example: "2026-10-02T00:00:00Z"
        - name: sku
          in: query
          required: false
          description: Restrict to one SKU.
          schema:
            type: string
            example: SKU-1
        - name: binId
          in: query
          required: false
          description: Restrict to one bin.
          schema:
            type: string
            example: A-1-1
        - name: granularity
          in: query
          required: false
          description: Bucket size. Only `hour` is supported (the default).
          schema:
            type: string
            enum: [hour]
            default: hour
      responses:
        "200":
          description: The report rows for the window (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowAccuracyReport"
              example:
                rows:
                  - sku: SKU-1
                    binId: A-1-1
                    hourBucket: "2026-10-01T14:00:00Z"
                    receivedQuantity: 10
                    stowedCount: 1
                    pickedQuantity: 4
                    reservationsCreated: 1
                    reservationsExpired: 0
                    reservationsRevoked: 0
                    cycleCountsCompleted: 0
                    discrepanciesDetected: 0
                    unlocatedCount: 0
        "400":
          description: >
            `from` or `to` missing or not an RFC 3339 timestamp, or
            `granularity` is not `hour`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/invalid-report-query
                title: The report query is malformed or missing a required parameter
                status: 400
                detail: query parameter 'from' is required (RFC3339)
                instance: /reports/flow-accuracy
        "500":
          description: The read model could not be queried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/report-store-error
                title: The report could not be served
                status: 500
                detail: read model unavailable
                instance: /reports/flow-accuracy

  /reports/flow-accuracy/freshness:
    get:
      operationId: getFlowAccuracyFreshness
      summary: Freshness lag of the flow-accuracy read model
      description: >
        Seconds between now and the newest event the analytics projector
        has folded into the read model (ADR 0011) — the staleness a
        consumer of `/reports/flow-accuracy` should expect. Served by the
        `inventory-reports` deployment. Side-effect-free.
      tags: [Reports]
      responses:
        "200":
          description: Current projection lag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lagSeconds:
                    type: number
                    format: double
                    description: Projection lag in seconds.
                    example: 1.5
                example:
                  lagSeconds: 1.5
        "500":
          description: The read model could not be queried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/report-store-error
                title: The report could not be served
                status: 500
                detail: read model unavailable
                instance: /reports/flow-accuracy/freshness

components:
  headers:
    IdempotencyReplayed:
      description: >
        Present, with the value `true`, ONLY when this response is a replay
        of the stored answer for the request's Idempotency-Key (the handler
        did not run again). The first execution of a key never carries it.
      schema:
        type: string
        enum: ["true"]
        example: "true"

  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: The reservation's id, formatted `res-<uuid>`.
      schema:
        type: string
        example: res-a1b2c3d4-0000-0000-0000-000000000001
    Sku:
      name: sku
      in: path
      required: true
      description: The stock-keeping unit identifier.
      schema:
        type: string
        example: SKU-1
    DemandRef:
      name: demandRef
      in: query
      required: true
      description: >
        The caller-supplied demand reference to look reservations up by
        (e.g. an external order+line reference). Required — there is no
        list-all semantics for this endpoint.
      schema:
        type: string
        minLength: 1
        example: order-42
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Caller-generated unique key (a UUID per logical submit; a retry
        reuses it, a new user action mints a new one) that makes a retried
        request safe (ADR 0018, REST guideline section 2): 1-128 printable
        ASCII characters. Postgres is the only runtime, so the check is on in
        every deployment: a missing key is answered with 400
        `idempotency-key-required`, a malformed one with 400
        `idempotency-key-invalid`; a replay with the same key and the same
        method, path and body returns the original response plus
        `Idempotency-Replayed: true`, while the same key with a different
        method, path or body is 409 `idempotency-key-reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'
        example: 5b0f6a0e-6a41-4c63-9f33-0c8f5c1d2a77
    Limit:
      name: limit
      in: query
      required: false
      description: >
        Page size of a collection GET (REST guideline 3.2): an integer from 1
        to 500, default 100. Anything else is 400 `invalid-limit`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque page token: the previous page's `nextCursor`, passed back
        unchanged together with the same filters. Absent on the first page. A
        value this API did not issue is 400 `invalid-cursor`.
      schema:
        type: string
    HeldUnitId:
      name: id
      in: path
      required: true
      description: The held unit's id (`hu-<uuid>`).
      schema:
        type: string
        example: hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64
    BinId:
      name: binId
      in: path
      required: true
      description: The bin's coded slot identifier.
      schema:
        type: string
        example: A-1-1
    TransferLineId:
      name: transferLineId
      in: path
      required: true
      description: >-
        The planning context's transfer line id (`<transfer_id>:<line>`),
        the DB-unique key both the origin-side transfer_allocations
        ledger and the destination-side transfer_receipts row are
        anchored on (ADR 0031).
      schema:
        type: string
        example: tr-77:1

  responses:
    IdempotencyKeyRequired:
      description: >-
        The Idempotency-Key header is missing (idempotency-key-required) or
        is not 1-128 printable ASCII characters (idempotency-key-invalid).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            idempotencyKeyRequired:
              summary: Idempotency-Key header missing (REST guideline 2.2)
              value:
                type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                instance: /stock-receipts
            idempotencyKeyInvalid:
              summary: Idempotency-Key header is not 1-128 printable ASCII characters
              value:
                type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-invalid
                title: Idempotency-Key header is invalid
                status: 400
                detail: The Idempotency-Key header must be 1-128 printable ASCII characters (a client-generated UUID per logical submit).
                instance: /stock-receipts
    IdempotencyKeyReused:
      description: >-
        The Idempotency-Key was already used with a different method, path
        or body (idempotency-key-reused). Distinguishable from a business 409
        by the problem type; a client bug, never retried blindly.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
            title: Idempotency-Key was already used with a different request
            status: 409
            detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
            instance: /stock-receipts
    InternalError:
      description: An unexpected internal error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.inventory-storage.warehouse-systems.dev/internal-error
            title: An unexpected internal error occurred
            status: 500
            detail: unexpected adapter failure
            instance: /stowages

  schemas:
    Problem:
      type: object
      description: >
        RFC 7807 (Problem Details for HTTP APIs) error shape, used for
        every non-2xx response across this service. `type` is
        `https://errors.inventory-storage.warehouse-systems.dev/<slug>`;
        every slug is documented as a response example on the operation(s)
        that can return it, and the mapping from typed domain error to
        (status, slug, title) lives in one lookup table
        (`problemCatalog` in internal/adapters/inbound/http/errors.go,
        ADR 0005).
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI identifying the error category (does not need to
            resolve). Unique per distinct error category in this service.
          example: https://errors.inventory-storage.warehouse-systems.dev/reservation-not-found
        title:
          type: string
          description: Fixed, human-readable summary of the error category.
          example: Reservation not found
        status:
          type: integer
          format: int32
          description: Duplicates the HTTP status code as an integer (RFC 7807 requirement).
          example: 404
        detail:
          type: string
          description: The specific error message for this occurrence.
          example: reservation not found
        instance:
          type: string
          description: The request path that produced this error.
          example: /reservations/does-not-exist

    ReservationPage:
      type: object
      required: [items]
      description: >
        One keyset page of reservations (REST guideline section 3.3),
        ordered by (createdAt, id).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"
        nextCursor:
          type: string
          description: >
            Opaque cursor of the next page, to be passed back unchanged as
            `cursor`. Absent on the last page.
          example: eyJzIjoiMjAyNi0wOC0yMlQxNDowNTowMFoiLCJpIjoicmVzLWExYjJjM2Q0LTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMiJ9

    ContainerPage:
      type: object
      required: [items]
      description: >
        One keyset page of containers (REST guideline section 3.3), ordered
        by LPN.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        nextCursor:
          type: string
          description: >
            Opaque cursor of the next page, to be passed back unchanged as
            `cursor`. Absent on the last page.

    HeldUnitPage:
      type: object
      required: [items]
      description: >
        One keyset page of held units (REST guideline section 3.3), oldest
        first.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HeldUnit"
        nextCursor:
          type: string
          description: >
            Opaque cursor of the next page, to be passed back unchanged as
            `cursor`. Absent on the last page.

    HeldUnit:
      type: object
      required: [id, sku, quantity, reason, state, receiptId, lineNo, lpns, heldAt, reworkCount]
      description: >-
        A quantity held out of usable stock (ADR 0052). It has no bin and no
        usable quantity, and can never be reserved.
      properties:
        id:
          type: string
          example: hu-3f6c1b0e-7a52-4d11-8c3e-0a9d5b7e2f64
        sku:
          type: string
          example: SKU-1
        quantity:
          type: integer
          minimum: 1
          description: Eaches held.
        reason:
          type: string
          enum: [DAMAGED, QC_PENDING, SUSPECT, OTHER]
        state:
          type: string
          enum: [HELD, REMOVED]
          description: HELD while waiting for a decision; REMOVED once a final disposition settled it.
        receiptId:
          type: string
          description: The inbound receipt the quantity came from.
        asnNumber:
          type: string
        lineNo:
          type: integer
          minimum: 1
          description: The receipt line.
        ownerRef:
          type: string
          description: Owner of the stock; absent for fleet-owned stock.
        sscc:
          type: string
          description: The carton SSCC of the line, when it had one.
        lpns:
          type: array
          items:
            type: string
          description: License plates of the Damaged cartons of the line (marks only; they carry no quantity).
        heldAt:
          type: string
          format: date-time
        disposition:
          type: string
          enum: [RELEASE, RETURN_TO_VENDOR, SCRAP, REWORK]
          description: The last decision, once there is one.
        decidedAt:
          type: string
          format: date-time
        reworkCount:
          type: integer
          minimum: 0
          description: How many times the unit was sent to REWORK.

    ReceiveStockRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          description: Stock-keeping unit identifier for the inbound goods.
          example: SKU-1
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Quantity received. Must be a positive integer.
          example: 10

    StagedReceipt:
      type: object
      properties:
        sku:
          type: string
          example: SKU-1
        quantity:
          type: integer
          format: int32
          example: 10
        receivedAt:
          type: string
          format: date-time
          description: Timestamp the receipt was staged, RFC 3339.
          example: "2026-08-22T14:20:00Z"

    StowStockRequest:
      type: object
      required: [sku, quantity, binId]
      properties:
        sku:
          type: string
          minLength: 1
          description: Stock-keeping unit identifier (item-scan).
          example: SKU-1
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Quantity to stow. Must be a positive integer.
          example: 10
        binId:
          type: string
          minLength: 1
          description: Target bin's coded slot identifier (location-scan).
          example: A-1-1

    StockUnit:
      type: object
      description: A quantity of a SKU at a specific bin.
      properties:
        id:
          type: string
          description: StockUnit id, formatted `su-<uuid>`.
          example: su-164710cb-5e14-400b-849c-ed94d8256c6b
        sku:
          type: string
          example: SKU-1
        binId:
          type: string
          example: A-1-1
        quantity:
          type: integer
          format: int32
          description: Total on-hand quantity at this bin.
          example: 10
        reserved:
          type: integer
          format: int32
          description: Portion of quantity currently bound to a Reservation.
          example: 0
        state:
          type: string
          description: Lifecycle state of the unit.
          enum: [AVAILABLE, RESERVED, PICKED, REMOVED, UNLOCATED]
          example: AVAILABLE

    ReserveStockRequest:
      type: object
      required: [sku, demandRef]
      oneOf:
        - required: [quantity]
        - required: [cases]
      description: >-
        Send exactly one of `quantity` (eaches, drawn from loose stock) or
        `cases` (whole sealed cases, ADR 0045); sending both is 400
        `quantity-and-cases-exclusive`, sending neither is 422
        `zero-quantity`.
      properties:
        sku:
          type: string
          minLength: 1
          example: SKU-1
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Eaches to reserve from loose stock. A positive integer; mutually exclusive with `cases`.
          example: 6
        cases:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Whole sealed cases to reserve (ReserveFullCases, ADR 0045),
            oldest stowed container first. The reservation quantity is the
            cases' eaches (cases x unitsPerPack). Mutually exclusive with
            `quantity`. A sealed case is never split by a `quantity`
            reservation.
          example: 2
        ownerRef:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]*$'
          description: >-
            Whose stock the reservation draws on (ADR 0045). A reservation
            never spans owners. Omitted means fleet-owned stock only, never
            "any owner": a seller's stock cannot satisfy it. A malformed
            value is 400 `invalid-owner-ref`.
          example: seller-a
        demandRef:
          type: string
          minLength: 1
          description: Caller-supplied reference identifying the demand this reservation satisfies (e.g. an order id).
          example: order-42
        lineNo:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: >
            Optional order line this reservation is for (ADR 0036). When
            sent it is stored on the reservation and returned as `lineNo`,
            and it lets the TaskCompleted consumer confirm exactly the
            picked line instead of counting picks (ADR 0035). Omit it, or
            send null, when unknown. Valid range is 1 to 2147483647 (a
            32-bit integer); 0, negative values and values above 2147483647
            are rejected with 400 `invalid-line-no`. Because it is part of the request
            body, adding it to a request whose Idempotency-Key was first
            used WITHOUT it is a different body (409
            `idempotency-key-reused`).
          example: 1

    StageTransferReceiptRequest:
      type: object
      required: [transferId, destinationSiteId, sku, receivedQuantity]
      description: >-
        One destination scan (ADR 0031): what line the operator claims
        the goods belong to, which site received them, and how many were
        counted.
      properties:
        transferId:
          type: string
          minLength: 1
          description: The planning context's transfer (saga) id; must match the ledger row for transferLineId.
          example: tr-77
        destinationSiteId:
          type: string
          minLength: 1
          description: The receiving site; may not equal the transfer's own origin site.
          example: SITE-DEST
        sku:
          type: string
          minLength: 1
          example: SKU-T1
        receivedQuantity:
          type: integer
          format: int32
          minimum: 1
          description: Quantity physically counted at the dock. May differ from expectedQuantity — the signed variance is recorded, never absorbed.
          example: 5

    TransferReceipt:
      type: object
      description: >-
        The destination-side custody record for one transfer line (ADR
        0031), keyed DB-unique on transferLineId. STAGED means counted
        but not yet placed (no usable stock); STOWED means placed — the
        destination site's usable rose exactly once.
      properties:
        transferId:
          type: string
          example: tr-77
        transferLineId:
          type: string
          example: tr-77:1
        destinationSiteId:
          type: string
          example: SITE-DEST
        sku:
          type: string
          example: SKU-T1
        expectedQuantity:
          type: integer
          format: int32
          description: What the transfer_allocations ledger promised (its requested_quantity).
          example: 6
        receivedQuantity:
          type: integer
          format: int32
          description: What was physically counted at the dock.
          example: 5
        variance:
          type: integer
          format: int32
          description: SIGNED received - expected. Positive = over-receipt, negative = short-receipt, 0 = exact. Explicit, never silently absorbed.
          example: -1
        state:
          type: string
          enum: [STAGED, STOWED]
          example: STAGED
        stagedAt:
          type: string
          format: date-time
          example: "2026-10-06T12:00:00Z"
        stowedAt:
          type: string
          format: date-time
          description: Present only once STOWED.
          example: "2026-10-06T12:05:00Z"
        replay:
          type: boolean
          description: True when this response is the ORIGINAL outcome of an idempotent replay, with nothing new written or published.
          example: false

    StowTransferRequest:
      type: object
      required: [bins]
      description: >-
        The destination placements for a STAGED transfer receipt (ADR
        0031). The quantities must sum exactly to the receipt's
        receivedQuantity; every bin must belong to the receipt's
        destination site.
      properties:
        bins:
          type: array
          minItems: 1
          items:
            type: object
            required: [binId, quantity]
            properties:
              binId:
                type: string
                minLength: 1
                example: BIN-DEST-1
              quantity:
                type: integer
                format: int32
                minimum: 1
                example: 3

    StowedTransfer:
      type: object
      description: The STOWED receipt plus the destination StockUnits the stow created.
      allOf:
        - $ref: "#/components/schemas/TransferReceipt"
        - type: object
          properties:
            stowedQuantity:
              type: integer
              format: int32
              description: Total quantity placed (equals receivedQuantity).
              example: 5
            allocations:
              type: array
              description: One entry per destination StockUnit created, with its bin.
              items:
                type: object
                properties:
                  stockUnitId:
                    type: string
                    example: su-dest-1
                  binId:
                    type: string
                    example: BIN-DEST-1
                  quantity:
                    type: integer
                    format: int32
                    example: 3

    QuarantinedScanProblem:
      type: object
      description: >-
        RFC 7807 problem for a QUARANTINED destination scan (ADR 0031):
        the standard members plus an `exception` extension object
        carrying the inventory_exceptions row's coordinates. The scan
        raised no stock; a human resolves the exception.
      properties:
        type:
          type: string
          example: https://errors.inventory-storage.warehouse-systems.dev/transfer-scan-quarantined
        title:
          type: string
          example: Destination scan quarantined
        status:
          type: integer
          example: 422
        detail:
          type: string
          description: The explicit problem (why the scan could not be matched).
          example: transfer line was never allocated by this service
        instance:
          type: string
          example: /transfers/tl-ghost/receipt
        exception:
          type: object
          properties:
            kind:
              type: string
              enum: [UNKNOWN_TRANSFER, UNRECOGNIZED_TRANSFER]
              example: UNKNOWN_TRANSFER
            transferId:
              type: string
              example: tr-ghost
            transferLineId:
              type: string
              example: tl-ghost
            destinationSiteId:
              type: string
              example: SITE-DEST
            sku:
              type: string
              example: SKU-T1
            receivedQuantity:
              type: integer
              format: int32
              example: 5

    Allocation:
      type: object
      description: >
        A specific StockUnit and quantity a Reservation drew from, plus the
        pick location: the bin that StockUnit sits in (ADR 0025).
      properties:
        stockUnitId:
          type: string
          example: su-164710cb-5e14-400b-849c-ed94d8256c6b
        binId:
          type: string
          description: >
            Pick location — the bin the allocated StockUnit sits in, i.e.
            where a picker goes to fulfil this allocation. Always present
            for allocations made by this version; omitted only for a legacy
            allocation whose bin could not be backfilled.
          example: A-1-1
        quantity:
          type: integer
          format: int32
          example: 6

    Reservation:
      type: object
      properties:
        id:
          type: string
          description: Reservation id, formatted `res-<uuid>`.
          example: res-a1b2c3d4-0000-0000-0000-000000000001
        sku:
          type: string
          example: SKU-1
        quantity:
          type: integer
          format: int32
          example: 6
        demandRef:
          type: string
          example: order-42
        ownerRef:
          type: string
          description: Owner whose stock the reservation holds (ADR 0045). Omitted for fleet-owned stock.
          example: seller-a
        lineNo:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: >
            The order line this reservation is for (ADR 0036), 1 to 2147483647
            (32-bit). Omitted when
            unknown (a reservation made before the field existed, or by a
            client that does not send it).
          example: 1
        status:
          type: string
          enum: [ACTIVE, CONFIRMED, REVOKED, EXPIRED]
          example: ACTIVE
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        createdAt:
          type: string
          format: date-time
          description: Timestamp this reservation was created, RFC 3339.
          example: "2026-08-22T14:20:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Timestamp this reservation auto-expires if never confirmed or revoked, RFC 3339.
          example: "2026-08-22T14:50:00Z"

    RegisterBinRequest:
      type: object
      required: [capacity]
      properties:
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: >
            Desired capacity of the bin, in units. Must be greater than zero
            and not below the bin's current occupancy.
          example: 20

    Bin:
      type: object
      description: A coded storage slot with a fixed capacity (chaotic storage).
      properties:
        binId:
          type: string
          example: A-1-1
        capacity:
          type: integer
          format: int32
          description: Maximum units the bin can hold.
          example: 20
        occupied:
          type: integer
          format: int32
          description: Units currently stowed in the bin.
          example: 4
        available:
          type: integer
          format: int32
          description: capacity minus occupied — space still free for stow.
          example: 16

    UsableInventory:
      type: object
      properties:
        sku:
          type: string
          example: SKU-1
        ownerRef:
          type: string
          description: The owner the figures are for (ADR 0045). Omitted for fleet-owned stock.
          example: seller-a
        usable:
          type: integer
          format: int32
          description: >-
            On-hand minus active reservations minus held/unlocated stock,
            summed across the StockUnits of this SKU owned by `ownerRef`
            (loose stock and sealed cases alike, in eaches).
          example: 7
        looseUsable:
          type: integer
          format: int32
          description: The part of `usable` a `quantity` reservation can draw on (loose stock only).
          example: 7
        reservableCases:
          type: integer
          format: int32
          description: How many whole sealed cases can still be reserved with `cases`.
          example: 0

    Container:
      type: object
      description: >-
        A sealed case with an identity (ADR 0045). The ledger stays in
        eaches: `qtyEaches` is the case's content, held by the 1:1
        SEALED_CASE stock unit `stockUnitId` once stowed.
      required: [lpn, sku, gtin, unitsPerPack, qtyEaches, state, receiptId, lineNo]
      properties:
        lpn:
          type: string
          description: License plate - the carton SSCC, or an internal `LPN-<site>-<id>`.
          example: "003400000000000017"
        sku:
          type: string
          example: SKU-1
        gtin:
          type: string
          description: GTIN-14 of the case pack level, resolved in the local PackagingView.
          example: "24006381333935"
        unitsPerPack:
          type: integer
          format: int32
          minimum: 1
          example: 12
        qtyEaches:
          type: integer
          format: int32
          minimum: 1
          description: Eaches in the case; always equals `unitsPerPack` for a sealed case.
          example: 12
        ownerRef:
          type: string
          description: Owner of the case's stock. Omitted for fleet-owned stock.
          example: seller-a
        siteId:
          type: string
          description: Site, set by the first stow from the bin's site. Omitted until then.
          example: WH1
        binId:
          type: string
          description: Bin the container is stowed in. Omitted until stowed, and once EMPTY.
          example: WH1-STOR-AMB-A01-01-01-A
        state:
          type: string
          enum: [SEALED, OPEN, EMPTY]
          example: SEALED
        lot:
          type: string
          example: L1
        expiry:
          type: string
          description: Expiry date (YYYY-MM-DD) when the carton declared one.
          example: "2027-03-01"
        stockUnitId:
          type: string
          description: The SEALED_CASE stock unit holding the eaches, created at the first stow.
          example: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
        receiptId:
          type: string
          description: The inbound receipt the case arrived on.
          example: rcpt-1
        lineNo:
          type: integer
          format: int32
          minimum: 1
          description: The receipt line whose booking bounds the container.
          example: 1

    CycleCountRequest:
      type: object
      required: [countedQuantity]
      properties:
        countedQuantity:
          type: integer
          format: int64
          minimum: 0
          description: Physically counted quantity at the bin. Zero is valid (an empty bin); negative is rejected. The field itself is required — omitting it (or sending null) is a 400, not an implicit zero.
          example: 9

    CycleCountResult:
      type: object
      properties:
        binId:
          type: string
          example: A-1-1
        countedQuantity:
          type: integer
          format: int32
          example: 9
        systemQuantity:
          type: integer
          format: int32
          description: Quantity system records show for this bin prior to reconciliation.
          example: 10
        discrepancy:
          type: boolean
          description: True if countedQuantity differed from systemQuantity.
          example: true

    FlowAccuracyReport:
      type: object
      description: The Inventory Flow & Accuracy report for a window.
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FlowAccuracyRow"

    FlowAccuracyRow:
      type: object
      description: >
        One (SKU, bin, hour) bucket of flow and accuracy counters.
      properties:
        sku:
          type: string
          example: SKU-1
        binId:
          type: string
          example: A-1-1
        hourBucket:
          type: string
          format: date-time
          description: Start of the UTC hour this row aggregates, RFC 3339.
          example: "2026-10-01T14:00:00Z"
        receivedQuantity:
          type: integer
          description: Units received (StockReceived) in the bucket.
          example: 10
        stowedCount:
          type: integer
          description: Stow operations (StockStowed) in the bucket.
          example: 1
        pickedQuantity:
          type: integer
          description: Units picked (StockPicked) in the bucket.
          example: 4
        reservationsCreated:
          type: integer
          example: 1
        reservationsExpired:
          type: integer
          example: 0
        reservationsRevoked:
          type: integer
          example: 0
        cycleCountsCompleted:
          type: integer
          example: 0
        discrepanciesDetected:
          type: integer
          example: 0
        unlocatedCount:
          type: integer
          example: 0

    RelocateStockRequest:
      type: object
      required: [siteCode, sku, fromBin, toBin, quantity]
      description: >-
        An intra-site move of one SKU between two bins of the same site
        (ADR 0039). Both bins must be registered and belong to siteCode:
        their recorded site custody, or, when none is recorded, the site
        segment of a facility-layout location code
        (site-area-zone-aisle-bay-level-position).
      properties:
        siteCode:
          type: string
          minLength: 1
          pattern: '\S'
          description: The site both bins must be in.
          example: WH1
        sku:
          type: string
          minLength: 1
          example: SKU-1
        fromBin:
          type: string
          minLength: 1
          description: Source bin. Only its usable (unreserved) quantity of the SKU moves.
          example: WH1-STOR-AMB-A07-03-02-B
        toBin:
          type: string
          minLength: 1
          description: Destination bin; must differ from fromBin and have room for quantity.
          example: WH1-STOR-AMB-A01-01-01-A
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 12
        reason:
          type: string
          enum: [SLOTTING, CONSOLIDATION, MANUAL]
          description: Why the stock moves. Absent means MANUAL.
          example: SLOTTING
        sourceRef:
          type: string
          maxLength: 200
          description: The caller's correlation (a slot-plan move, a ticket). Optional.
          example: plan-7/move-2

    RelocationLeg:
      type: object
      description: One source StockUnit's contribution to the move.
      properties:
        stockUnitId:
          type: string
          example: su-164710cb-5e14-400b-849c-ed94d8256c6b
        quantity:
          type: integer
          format: int32
          example: 12

    Relocation:
      type: object
      description: An applied intra-site relocation (ADR 0039). Immutable.
      properties:
        id:
          type: string
          description: Relocation id, formatted `rel-<uuid>`.
          example: rel-0b7e2a54-3c1d-4f0e-9a8b-7c6d5e4f3a21
        siteCode:
          type: string
          example: WH1
        sku:
          type: string
          example: SKU-1
        fromBin:
          type: string
          example: WH1-STOR-AMB-A07-03-02-B
        toBin:
          type: string
          example: WH1-STOR-AMB-A01-01-01-A
        quantity:
          type: integer
          format: int32
          example: 12
        reason:
          type: string
          enum: [SLOTTING, CONSOLIDATION, MANUAL, REPLENISHMENT]
          description: >-
            Why the stock moved. REPLENISHMENT (ADR 0041) appears only on
            relocations made by a completed REPLENISH task; it is never
            accepted on the request.
          example: SLOTTING
        sourceRef:
          type: string
          description: The caller's correlation; empty when none was given.
          example: plan-7/move-2
        destinationStockUnitId:
          type: string
          description: The StockUnit created in toBin (site custody = siteCode).
          example: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
        legs:
          type: array
          items:
            $ref: "#/components/schemas/RelocationLeg"
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-13T12:00:00Z"
