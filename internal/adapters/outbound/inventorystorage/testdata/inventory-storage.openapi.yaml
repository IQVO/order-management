openapi: 3.0.3
info:
  title: Inventory & Storage API
  version: "1.0.0"
  description: >
    The WMS-tier authoritative record of what is held where, and what
    portion of it is usable, for the warehouse-systems platform. This
    bounded context implements chaotic (random) stow: there is
    no fixed product location — an inbound item may be stowed into any free
    bin, and this service records the exact bin it landed in. It supplies
    "stock reality" to the Work Planning bounded context and makes
    allocation a revocable reservation, so a failed physical pick or
    delivery never strands an order: a reservation can always be revoked
    and re-satisfied from a different physical holding.


    Its aggregates are **StockUnit** (a quantity of a SKU at a specific
    bin — every physical item has exactly one known bin, or is flagged
    Unlocated), **Bin/Location** (a coded slot with fixed capacity; any SKU
    may occupy any free bin, chaotic-storage style), and **Reservation** (a
    revocable binding of quantity to demand, with a timeout). "Usable"
    inventory — on-hand minus active reservations minus held/unlocated
    stock — is what constrains what this service will let you reserve, not
    raw on-hand quantity.


    Out of this service's boundary: it does not pick, pack, ship, route
    associates, or manage stations/tasks/labor (that is Work Planning /
    fulfillment-execution); and it does not decide *what* to receive or
    forecast demand. Bins are registered declaratively by inventory control
    via `PUT /bins/{binId}` (ADR 0025); every reservation allocation names
    the bin to pick from (`allocations[].binId`).
    Error responses across this API use RFC 7807 (`application/problem+json`)
    Problem Details.


    This API follows the fleet REST API guideline (ADR 0049): URLs name
    things (commands are noun sub-resources such as `POST /stowages` or
    `POST /reservations/{id}/pick-confirmations`), EVERY `POST` is behind the
    Idempotency-Key middleware (a retry replays the stored answer with the
    response header `Idempotency-Replayed: true`; the same key with a
    different method, path or body is 409 `idempotency-key-reused`; a missing
    key is 400 `idempotency-key-required`), and every collection `GET` is
    keyset-paginated as `{items, nextCursor}` with `limit` and `cursor`.


    Cross-cutting behaviour that applies to every operation: a NUL
    character (U+0000) in the query string or a JSON body is 400
    `malformed-request-body`, and in the path it is 404 `not-found`; a
    request that matches no route (for example a container `lpn` outside
    `[A-Za-z0-9._-]`) is 404 `route-not-found`, as
    `application/problem+json`.
  contact:
    name: Inventory & Storage (Core Bounded Context)
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Stock
    description: >
      Receiving and stowing physical stock. ReceiveStock stages inbound
      goods (item-scan only); StowStock durably records the item at a bin
      (item-scan + location-scan), which is the only way a StockUnit
      aggregate comes into existence. RelocateStock moves usable stock of
      one SKU between two bins of the same site (ADR 0039).
  - name: HeldStock
    description: >
      Stock held out of usable quantity (ADR 0052): the Damaged lines of an
      inbound receipt, which are booked as HELD units instead of being
      dropped. A held unit has no usable quantity and can never be reserved;
      a disposition (RELEASE, RETURN_TO_VENDOR, SCRAP, REWORK) settles it.
  - name: Containers
    description: >
      Sealed cases with an identity (ADR 0045, 0046). A Container is a case
      licence plate (LPN, the carton SSCC) created from inbound-receiving's
      `ReceiptCartonReceived`; it is stowed into a case bin, and broken
      (`BreakCase`) into loose eaches. The ledger stays in eaches. Quantity
      is booked once, by `ReceiptLineReceived`, never by a container.
  - name: Reservations
    description: >
      Revocable bindings of usable stock to demand. A Reservation can be
      revoked (returning its quantity to usable) or confirmed as picked
      (consuming it) — it never permanently binds to one physical bin, so a
      failed pick can be re-satisfied elsewhere.
  - name: Inventory
    description: >
      Read models projected from StockUnits — currently, usable inventory
      by SKU (on-hand minus active reservations minus held/unlocated stock).
  - name: Bins
    description: >
      Bin registration and inspection (declarative, idempotent
      `PUT /bins/{binId}` and `GET /bins/{binId}`, ADR 0025), and cycle
      counting: verifying a bin's physical contents against system records
      and reconciling discrepancies (shortfall marks stock Unlocated;
      overage is flagged for a separate receiving/audit process).
  - name: Products
    description: >
      SKU-level product classification (Hazmat/Fragile/TemperatureSensitive/
      Oversized/HighValue). Owned by product-master since ADR 0034: this
      service keeps a read-only local copy, fed by product-master's
      `ProductClassified` events, that StowStock reads to enforce
      hazmat/temperature placement (ADR 0009) and same-bin DOT segregation
      (ADR 0010). The write endpoint answers 410 and the read endpoint is
      deprecated.
  - name: Health
    description: Liveness and readiness probes.
  - name: Transfers
    description: >-
      Destination transfer receiving custody (ADR 0031): stage a counted
      arrival against a recognized ALLOCATED transfer line (or quarantine
      an unrecognized scan as an inventory exception), then stow the
      received goods into destination-site bins — the only path that
      raises the destination site's usable stock.
  - name: Reports
    description: >
      The read-only "Inventory Flow & Accuracy" analytical data product
      (ADR 0011, ADR 0020). Served by the separate `inventory-reports`
      deployment (cmd/inventory-reports) over its own read-only database
      pool — NOT by the OLTP `inventory` binary this spec's other paths
      describe — so these operations are excluded from the Schemathesis
      contract run, which boots only the OLTP binary.

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: >
        Returns 200 with a static status body if the process is up. Does
        not check downstream dependencies (e.g. Postgres, Kafka) — it is a
        liveness check, not a readiness check.
      tags: [Health]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                example:
                  status: ok

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: >
        Returns 200 `{"status":"ready"}` while the process is accepting
        traffic, and 503 `{"status":"not_ready"}` once graceful shutdown
        has begun (ADR 0020 — readiness is flipped FIRST so a Kubernetes
        readinessProbe stops routing new requests during the drain
        window). Distinct from `/healthz`, which is liveness only and is
        never flipped by shutdown. Checks no downstream dependency.
      tags: [Health]
      responses:
        "200":
          description: Service is ready to receive traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                example:
                  status: ready
        "503":
          description: >
            Not ready: either graceful shutdown has begun (a plain
            `{"status":"not_ready"}` JSON body), or a runtime dependency
            (Postgres, Kafka) is unreachable (an RFC 7807
            `application/problem+json` body of type `dependency-unavailable`
            whose `detail` names the failing dependencies; the verdict is
            cached for a few seconds).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready
                example:
                  status: not_ready
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/dependency-unavailable
                title: A runtime dependency is unavailable
                status: 503
                detail: "not ready: postgres"
                instance: /readyz

  /stock-receipts:
    post:
      operationId: receiveStock
      deprecated: true
      summary: Acknowledge inbound stock for a SKU
      description: >
        Stages a quantity of a SKU as received into the building
        (publishes StockReceived) without assigning it to a bin yet. This
        does NOT create a StockUnit aggregate: a StockUnit requires both an
        item-scan and a location-scan by construction (the
        stow-requires-both invariant), and a staged receipt has no bin yet.
        The durable, addressable record only starts at StowStock — that is
        why this operation returns 202 Accepted rather than 201 Created:
        there is no resource here to hand back a Location for.
        Superseded by the inbound-receiving handover (K24, ADR 0037:
        inbound-receiving publishes
        `com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived`,
        whose Good lines are booked as staged stock through the same
        ReceiveStock use case); this endpoint stays as the documented
        manual fallback; removal planned with the next breaking window.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockRequest"
            example:
              sku: SKU-1
              quantity: 10
      responses:
        "202":
          description: >
            Receipt accepted and staged; not yet stowed to a bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedReceipt"
              example:
                sku: SKU-1
                quantity: 10
                receivedAt: "2026-08-22T14:20:00Z"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: >
            Malformed JSON body, SKU missing/empty, or the Idempotency-Key
            header is absent (ADR 0018).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptySku:
                  summary: SKU missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-sku
                    title: SKU must not be empty
                    status: 400
                    detail: sku must not be empty
                    instance: /stock-receipts
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing (ADR 0018)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /stock-receipts
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "422":
          description: >
            Quantity present but not a positive number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                zeroQuantity:
                  summary: Quantity not positive
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/zero-quantity
                    title: Quantity must be greater than zero
                    status: 422
                    detail: quantity must be greater than zero
                    instance: /stock-receipts
        "500":
          $ref: "#/components/responses/InternalError"

  /stowages:
    post:
      operationId: stowStock
      summary: Stow received stock into a bin
      description: >
        Places a quantity of a SKU into a specific bin, requiring BOTH an
        item-scan (sku) and a location-scan (binId) — this is the only
        path that creates a StockUnit aggregate, and skipping either scan
        is precisely how inventory gets lost, so both are mandatory.
        Respects the bin's capacity: a stow that would exceed
        sum(occupied) <= capacity is rejected with 409. Chaotic storage
        means any SKU may be stowed into any free bin — there is no
        fixed product-to-bin mapping.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StowStockRequest"
            example:
              sku: SKU-1
              quantity: 10
              binId: A-1-1
      responses:
        "201":
          description: Stock unit created and stowed at the given bin.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              description: URI of the newly created StockUnit.
              schema:
                type: string
                example: /stock/su-164710cb-5e14-400b-849c-ed94d8256c6b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockUnit"
              example:
                id: su-164710cb-5e14-400b-849c-ed94d8256c6b
                sku: SKU-1
                binId: A-1-1
                quantity: 10
                reserved: 0
                state: AVAILABLE
        "400":
          description: >
            Malformed JSON body, or SKU/binId missing (either scan absent,
            including the domain-level stow-requires-both invariant).
            A missing or malformed Idempotency-Key header is also a 400 (idempotency-key-required / idempotency-key-invalid).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptyBinId:
                  summary: Bin ID missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-bin-id
                    title: Bin ID must not be empty
                    status: 400
                    detail: bin id must not be empty
                    instance: /stowages
                stowRequiresItemAndLocation:
                  summary: Stow without both an item scan and a location scan
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/stow-requires-item-and-location
                    title: Stow requires both an item scan and a location scan
                    status: 400
                    detail: stow requires both an item scan (sku) and a location scan (bin)
                    instance: /stowages
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /stowages
        "404":
          description: The target bin does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                title: Bin not found
                status: 404
                detail: bin not found
                instance: /stowages
        "409":
          description: >
            The bin does not have enough free capacity for this quantity, or
            the SKU is Hazmat/TemperatureSensitive-classified (ADR 0009) and
            the target bin's zone fails the placement check (not
            hazmat-rated, or a temperature-class mismatch), or the
            facility-layout classification lookup was unavailable for a
            classified, rule-relevant SKU, or the SKU carries a DOT hazard
            class (ADR 0010) that is incompatible with another SKU already
            occupying the target bin (same-bin DOT segregation).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                binFull:
                  summary: Bin capacity exceeded
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-full
                    title: "Bin is full: capacity exceeded"
                    status: 409
                    detail: "bin is full: capacity exceeded"
                    instance: /stowages
                hazmatZoneRequired:
                  summary: Hazmat SKU stowed into a non-hazmat-rated zone
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/hazmat-zone-required
                    title: Hazmat SKU requires a hazmat-rated zone
                    status: 409
                    detail: hazmat sku requires a hazmat-rated zone
                    instance: /stowages
                temperatureClassMismatch:
                  summary: TemperatureSensitive SKU stowed into a mismatched zone
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/temperature-class-mismatch
                    title: Bin temperature class does not match the SKU's required temperature class
                    status: 409
                    detail: bin temperature class does not match the sku's required temperature class
                    instance: /stowages
                locationClassificationUnavailable:
                  summary: facility-layout lookup unavailable for a classified SKU
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/location-classification-unavailable
                    title: Location classification lookup unavailable
                    status: 409
                    detail: location classification lookup unavailable
                    instance: /stowages
                hazmatClassIncompatible:
                  summary: DOT hazard class incompatible with another SKU already in the bin
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/hazmat-class-incompatible
                    title: DOT hazard class incompatible with another SKU already stowed in this bin
                    status: 409
                    detail: dot hazard class incompatible with another sku already stowed in this bin
                    instance: /stowages
                concurrentModification:
                  summary: The bin or stock unit was modified by another request (ADR 0019)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/concurrent-modification
                    title: The resource was modified by another request; re-fetch the latest version and retry
                    status: 409
                    detail: the resource was modified by another request; re-fetch the latest version and retry
                    instance: /stowages
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /stowages
        "422":
          description: Quantity present but not a positive number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/zero-quantity
                title: Quantity must be greater than zero
                status: 422
                detail: quantity must be greater than zero
                instance: /stowages
        "500":
          $ref: "#/components/responses/InternalError"

  /reservations:
    get:
      operationId: getReservationsByDemandRef
      summary: Look up every reservation for a demand reference
      description: >
        Returns every Reservation ever created against a caller-supplied
        demandRef (an external system's order+line reference, e.g. from
        order-management). A demandRef can have MULTIPLE reservations
        across its lifetime — a reservation that was revoked, followed by
        a successful retry — so this returns a collection, not a single
        resource; an unknown demandRef returns 200 with an empty `items`
        array, not 404. The collection is keyset-paginated (REST guideline
        section 3): one page of `{items, nextCursor}` ordered by
        (createdAt, id), `limit` (1-500, default 100) and the opaque
        `cursor` from the previous page's `nextCursor`; `demandRef` is
        repeated on every page request and `nextCursor` is absent on the
        last page. Any query parameter other than `demandRef`, `limit` and
        `cursor` is 400 `unknown-query-parameter` (a retired paging
        parameter such as `after` fails loudly instead of reading page one
        forever). This is the read side backing a cross-service
        order-lifecycle console screen that needs to answer "what did
        inventory-storage do for order X, line N". Side-effect-free.
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/DemandRef"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >
            One page of the reservations created against this demandRef
            (possibly empty), ordered by (createdAt, id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPage"
              example:
                items:
                  - id: res-a1b2c3d4-0000-0000-0000-000000000001
                    sku: SKU-1
                    quantity: 6
                    demandRef: order-42
                    status: REVOKED
                    allocations:
                      - stockUnitId: su-164710cb-5e14-400b-849c-ed94d8256c6b
                        quantity: 6
                    createdAt: "2026-08-22T14:00:00Z"
                    expiresAt: "2026-08-22T14:50:00Z"
                  - id: res-a1b2c3d4-0000-0000-0000-000000000002
                    sku: SKU-1
                    quantity: 6
                    demandRef: order-42
                    status: ACTIVE
                    allocations:
                      - stockUnitId: su-2b6e7e5b-0000-0000-0000-000000000002
                        quantity: 6
                    createdAt: "2026-08-22T14:05:00Z"
                    expiresAt: "2026-08-22T14:55:00Z"
                nextCursor: eyJzIjoiMjAyNi0wOC0yMlQxNDowNTowMFoiLCJpIjoicmVzLWExYjJjM2Q0LTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMiJ9
        "400":
          description: >-
            The demandRef query parameter is missing or empty
            (missing-demand-ref), `limit` is not an integer between 1 and
            500 (invalid-limit), or `cursor` is not a page token this API
            issued (invalid-cursor), or a query parameter other than
            `demandRef`, `limit` and `cursor` was sent
            (unknown-query-parameter).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                missingDemandRef:
                  summary: demandRef query parameter is required
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/missing-demand-ref
                    title: demandRef query parameter is required
                    status: 400
                    detail: demandRef query parameter must not be empty
                    instance: /reservations
                invalidLimit:
                  summary: limit is not an integer between 1 and 500
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-limit
                    title: "limit must be an integer between 1 and 500"
                    status: 400
                    detail: "limit must be an integer between 1 and 500"
                    instance: /reservations
                invalidCursor:
                  summary: cursor was not issued by this API
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-cursor
                    title: "cursor is not a valid page token"
                    status: 400
                    detail: "cursor is not a valid page token"
                    instance: /reservations
                unknownQueryParameter:
                  summary: a query parameter the collection does not declare
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/unknown-query-parameter
                    title: the collection does not declare this query parameter
                    status: 400
                    detail: "unknown query parameter: after"
                    instance: /reservations
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: reserveStock
      summary: Create a revocable reservation against usable inventory
      description: >
        Binds a quantity of a SKU's usable inventory (on-hand minus
        existing reservations, drawn forward-first: a SKU's forward pick face
        before its reserve bins, then smaller usable first, bin id, stock unit
        id (ADR 0050), across whichever StockUnits have
        usable quantity) to a piece of demand identified by demandRef. The
        reservation is NOT permanently bound to one physical StockUnit —
        the specific units/quantities drawn from are recorded as
        Allocations, but a subsequent revoke-and-reserve cycle is free to
        draw from a different holding. This is what lets a failed physical
        pick be retried without stranding the order. The reservation
        expires automatically after a timeout if never confirmed or
        revoked. Idempotent (best-effort) by (demandRef, sku, quantity):
        retrying this call after a dropped response returns the existing
        ACTIVE reservation for the same demandRef, SKU and quantity instead
        of creating a second one (see REST_AUDIT.md's idempotency notes).
        One demandRef (e.g. an order) may hold several ACTIVE reservations
        at once -- one per line/SKU -- so a request for a different SKU or
        quantity under the same demandRef is always a new reservation.
        The optional `lineNo` (ADR 0036) names the order line the
        reservation is for: it is stored, returned, and also taken into
        account by the replay guard (two lines of one order with the same
        SKU and quantity stay two reservations when their `lineNo`
        differ). Replays of the same Idempotency-Key with an identical
        body still return the cached response (with `Idempotency-Replayed:
        true`); adding `lineNo` to a key first used without it is a
        different request (409 `idempotency-key-reused`).
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockRequest"
            example:
              sku: SKU-1
              quantity: 6
              demandRef: order-42
              lineNo: 1
      responses:
        "201":
          description: Reservation created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              description: URI of the newly created Reservation.
              schema:
                type: string
                example: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                id: res-a1b2c3d4-0000-0000-0000-000000000001
                sku: SKU-1
                quantity: 6
                demandRef: order-42
                lineNo: 1
                status: ACTIVE
                allocations:
                  - stockUnitId: su-164710cb-5e14-400b-849c-ed94d8256c6b
                    quantity: 6
                createdAt: "2026-08-22T14:20:00Z"
                expiresAt: "2026-08-22T14:50:00Z"
        "400":
          description: >
            Malformed JSON body (including `cases` sent as null or a
            non-integer), SKU missing/empty, demandRef missing/empty,
            ownerRef malformed (invalid-owner-ref), both `quantity` and
            `cases` sent (quantity-and-cases-exclusive), lineNo present but
            outside 1..2147483647, or the Idempotency-Key header is
            absent (ADR 0018).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptySku:
                  summary: SKU missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-sku
                    title: SKU must not be empty
                    status: 400
                    detail: sku must not be empty
                    instance: /reservations
                quantityAndCasesExclusive:
                  summary: Both quantity and cases were sent
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/quantity-and-cases-exclusive
                    title: quantity and cases are mutually exclusive
                    status: 400
                    detail: send either quantity (eaches) or cases (whole sealed cases), not both
                    instance: /reservations
                invalidOwnerRef:
                  summary: ownerRef is not at most 64 characters of [A-Za-z0-9._-]
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-owner-ref
                    title: ownerRef must be at most 64 characters of [A-Za-z0-9._-]
                    status: 400
                    detail: ownerRef must be at most 64 characters of [A-Za-z0-9._-]
                    instance: /reservations
                missingDemandRef:
                  summary: demandRef missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/missing-demand-ref
                    title: demandRef is required
                    status: 400
                    detail: demandRef must not be empty
                    instance: /reservations
                invalidLineNo:
                  summary: lineNo is 0, negative or above 2147483647 (ADR 0036)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-line-no
                    title: lineNo must be between 1 and 2147483647
                    status: 400
                    detail: lineNo must be an integer between 1 and 2147483647 when present
                    instance: /reservations
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing (ADR 0018)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /reservations
        "409":
          description: >
            Requested quantity exceeds this SKU's currently usable
            inventory across all its StockUnits, or a racing request
            modified the same StockUnit first (ADR 0019 — re-fetch and
            retry).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                insufficientUsable:
                  summary: Requested quantity exceeds usable inventory
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/insufficient-usable
                    title: Requested quantity exceeds usable inventory
                    status: 409
                    detail: requested quantity exceeds usable inventory
                    instance: /reservations
                concurrentModification:
                  summary: A racing request modified the same stock unit first (ADR 0019)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/concurrent-modification
                    title: The resource was modified by another request; re-fetch the latest version and retry
                    status: 409
                    detail: the resource was modified by another request; re-fetch the latest version and retry
                    instance: /reservations
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /reservations
        "422":
          description: >
            Neither `quantity` nor `cases` was sent, or the one sent is not
            a positive number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                zeroQuantity:
                  summary: Quantity (or cases) not positive
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/zero-quantity
                    title: Quantity must be greater than zero
                    status: 422
                    detail: quantity must be greater than zero
                    instance: /reservations
        "500":
          $ref: "#/components/responses/InternalError"

  /reservations/{id}:
    delete:
      operationId: revokeReservation
      summary: Revoke a reservation
      description: >
        Cancels an ACTIVE reservation and returns its full reserved
        quantity to usable inventory on every StockUnit it had allocated
        from. This is the mechanism that makes reservations safe against
        physical delivery failure: revoke, then reserve again — the second
        reservation is free to draw from a different physical holding.
        Idempotent in effect (a resource that no longer exists or is
        already resolved simply can't be revoked again), though a second
        call on an already-resolved reservation is reported as 409, not a
        silent 204.
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "204":
          description: Reservation revoked; quantity returned to usable.
        "404":
          description: No reservation exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/reservation-not-found
                title: Reservation not found
                status: 404
                detail: reservation not found
                instance: /reservations/does-not-exist
        "409":
          description: >
            The reservation is already resolved (confirmed, revoked, or
            expired), or a racing request modified the same reservation
            first (ADR 0019 — re-fetch and retry).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reservationAlreadyResolved:
                  summary: Reservation is already resolved
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/reservation-already-resolved
                    title: Reservation is already resolved
                    status: 409
                    detail: reservation is already resolved (confirmed, revoked, or expired)
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001
                concurrentModification:
                  summary: A racing request modified the same reservation first (ADR 0019)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/concurrent-modification
                    title: The resource was modified by another request; re-fetch the latest version and retry
                    status: 409
                    detail: the resource was modified by another request; re-fetch the latest version and retry
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001
        "500":
          $ref: "#/components/responses/InternalError"

  /reservations/{id}/pick-confirmations:
    post:
      operationId: confirmPick
      deprecated: true
      summary: Confirm a reservation's physical pick
      description: >
        Consumes a reservation: for every Allocation it holds, the
        allocated quantity is physically removed from its StockUnit
        (StockUnit transitions toward PICKED/REMOVED) and the
        corresponding bin capacity is released. This is a terminal,
        one-way command on the resource in the domain command style (not
        forced into PUT/PATCH) — a reservation that is already resolved,
        expired, or has no allocations cannot be confirmed again.
        Superseded by the TaskCompleted consumer (K37: fulfillment-execution's
        TaskCompleted for a PICK task confirms the reservation — ADR 0035 /
        ADR 0036); removal planned with the next breaking window.
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Pick confirmed; reservation consumed.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/IdempotencyKeyRequired"
        "404":
          description: >
            No reservation exists with this id, or (in a data-consistency
            fault) one of its allocated stock units (stock-unit-not-found)
            or bins (bin-not-found) is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reservationNotFound:
                  summary: No reservation with this id
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/reservation-not-found
                    title: Reservation not found
                    status: 404
                    detail: reservation not found
                    instance: /reservations/does-not-exist/pick-confirmations
                stockUnitNotFound:
                  summary: An allocated stock unit is missing (data-consistency fault)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/stock-unit-not-found
                    title: Stock unit not found
                    status: 404
                    detail: stock unit not found
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                binNotFound:
                  summary: An allocated stock unit's bin is missing (data-consistency fault)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                    title: Bin not found
                    status: 404
                    detail: bin not found
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
        "409":
          description: >
            The reservation cannot be confirmed: already resolved,
            expired, has no allocations, or the pick quantity/bin
            release is inconsistent with current stock state — or a
            racing request modified the same reservation, stock unit, or
            bin first (ADR 0019 — re-fetch and retry).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                reservationExpired:
                  summary: Reservation has expired
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/reservation-expired
                    title: Reservation has expired
                    status: 409
                    detail: reservation has expired
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                concurrentModification:
                  summary: A racing request modified the same aggregate first (ADR 0019)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/concurrent-modification
                    title: The resource was modified by another request; re-fetch the latest version and retry
                    status: 409
                    detail: the resource was modified by another request; re-fetch the latest version and retry
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                reservationNoAllocations:
                  summary: Reservation holds no allocations
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/reservation-no-allocations
                    title: Reservation requires at least one allocation
                    status: 409
                    detail: reservation requires at least one allocation
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                insufficientReserved:
                  summary: Pick quantity exceeds what the unit has reserved
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/insufficient-reserved
                    title: Pick quantity exceeds reserved quantity
                    status: 409
                    detail: pick quantity exceeds reserved quantity
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                unitUnlocated:
                  summary: An allocated stock unit is Unlocated
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/unit-unlocated
                    title: Stock unit is unlocated
                    status: 409
                    detail: stock unit is unlocated
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                releaseExceedsOccupancy:
                  summary: Bin release would exceed its occupancy
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/release-exceeds-occupancy
                    title: Release exceeds bin occupancy
                    status: 409
                    detail: cannot release more than is occupied
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /reservations/res-a1b2c3d4-0000-0000-0000-000000000001/pick-confirmations
        "500":
          $ref: "#/components/responses/InternalError"

  /inventory/{sku}/usable:
    get:
      operationId: getUsableInventory
      summary: Get usable inventory for a SKU
      description: >
        Returns the usable-inventory read model for a SKU: on-hand minus
        active reservations minus held/unlocated stock, summed across
        every StockUnit for that SKU. This is a projection, not a stored
        aggregate — it is what constrains ReserveStock, since total
        on-hand is not what's available to promise to new demand.
        Side-effect-free.
      tags: [Inventory]
      parameters:
        - $ref: "#/components/parameters/Sku"
        - name: ownerRef
          in: query
          required: false
          description: >-
            The owner whose stock to count (ADR 0045). Omitted means
            fleet-owned stock only, never "any owner". A malformed value is
            400 `invalid-owner-ref`.
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z0-9._-]*$'
            example: seller-a
      responses:
        "200":
          description: Usable quantity for the SKU and owner (0 if the SKU is unknown).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsableInventory"
              example:
                sku: SKU-1
                usable: 7
                looseUsable: 7
                reservableCases: 0
        "400":
          description: >-
            SKU path segment missing/empty (empty-sku), or `ownerRef`
            malformed (invalid-owner-ref).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptySku:
                  summary: SKU missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-sku
                    title: SKU must not be empty
                    status: 400
                    detail: sku must not be empty
                    instance: /inventory//usable
                invalidOwnerRef:
                  summary: ownerRef is not at most 64 characters of [A-Za-z0-9._-]
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-owner-ref
                    title: ownerRef must be at most 64 characters of [A-Za-z0-9._-]
                    status: 400
                    detail: ownerRef must be at most 64 characters of [A-Za-z0-9._-]
                    instance: /inventory/SKU-1/usable
        "500":
          $ref: "#/components/responses/InternalError"

  /bins/{binId}:
    put:
      operationId: registerBin
      summary: Register a bin, or converge an existing bin to a capacity
      description: >
        Declarative, idempotent bin registration by inventory control
        (ADR 0025). The body states the desired capacity and the bin
        converges to it. An absent bin is created empty (201). A present
        bin with the same capacity is left untouched (200, nothing
        written). A present bin with a different capacity is resized (200),
        as long as the new capacity is not below what the bin already holds
        — shrinking below occupancy is rejected (409
        capacity-below-occupancy) because that stock is physically in the
        slot. Occupancy is never changed by this call; it moves only through
        stow and pick. A resize racing a concurrent stow can surface as 409
        concurrent-modification (re-fetch and retry).
      tags: [Bins]
      parameters:
        - $ref: "#/components/parameters/BinId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBinRequest"
            example:
              capacity: 20
      responses:
        "200":
          description: >
            The bin already existed; it is now at the requested capacity
            (unchanged, or resized).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bin"
              example:
                binId: A-1-1
                capacity: 20
                occupied: 4
                available: 16
        "201":
          description: The bin did not exist and was created, empty.
          headers:
            Location:
              description: Path of the registered bin.
              schema:
                type: string
                example: /bins/A-1-1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bin"
              example:
                binId: A-1-1
                capacity: 20
                occupied: 0
                available: 20
        "400":
          description: Malformed JSON body, or the body omits capacity.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                capacityRequired:
                  summary: capacity omitted
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/capacity-required
                    title: capacity is required
                    status: 400
                    detail: capacity must be present in the request body
                    instance: /bins/A-1-1
                malformedBody:
                  summary: Body is not valid JSON
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/malformed-request-body
                    title: The request body is not valid JSON
                    status: 400
                    detail: invalid character 'n' looking for beginning of object key string
                    instance: /bins/A-1-1
        "409":
          description: >
            The requested capacity is below the bin's current occupancy, or
            the bin was concurrently modified (re-fetch and retry).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                belowOccupancy:
                  summary: Capacity below current occupancy
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/capacity-below-occupancy
                    title: Bin capacity cannot be set below current occupancy
                    status: 409
                    detail: bin capacity cannot be set below current occupancy
                    instance: /bins/A-1-1
                concurrentModification:
                  summary: Concurrent modification
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/concurrent-modification
                    title: The resource was modified by another request; re-fetch the latest version and retry
                    status: 409
                    detail: aggregate was concurrently modified by another writer; re-fetch and retry
                    instance: /bins/A-1-1
        "422":
          description: capacity is zero, negative, or above the int32 range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                zeroCapacity:
                  summary: Zero capacity
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/invalid-bin-capacity
                    title: Bin capacity must be greater than zero
                    status: 422
                    detail: bin capacity must be greater than zero
                    instance: /bins/A-1-1
                negativeCapacity:
                  summary: Negative capacity
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/negative-quantity
                    title: Quantity must not be negative
                    status: 422
                    detail: quantity must not be negative
                    instance: /bins/A-1-1
                capacityOutOfRange:
                  summary: Capacity above the int32 range
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/capacity-out-of-range
                    title: Bin capacity is out of range
                    status: 422
                    detail: capacity must not exceed 2147483647
                    instance: /bins/A-1-1
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getBin
      summary: Get a bin's capacity and occupancy
      description: >
        Returns the bin's capacity, how much of it is occupied, and how much
        is still available for stow. Side-effect-free. An unknown bin is a
        404 (there is no meaningful empty bin to return).
      tags: [Bins]
      parameters:
        - $ref: "#/components/parameters/BinId"
      responses:
        "200":
          description: The bin's current capacity and occupancy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bin"
              example:
                binId: A-1-1
                capacity: 20
                occupied: 4
                available: 16
        "404":
          description: No bin exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                title: Bin not found
                status: 404
                detail: bin not found
                instance: /bins/A-1-1
        "500":
          $ref: "#/components/responses/InternalError"

  /bins/{binId}/cycle-counts:
    post:
      operationId: runCycleCount
      summary: Record a physical cycle count for a bin
      description: >
        Verifies a bin's physical contents against system records. If the
        counted quantity matches system quantity, records a clean
        CycleCountCompleted. A shortfall (counted < system) marks whichever
        StockUnits cover the difference fully Unlocated (not split into
        located/lost sub-quantities — kept simple by design) and publishes
        ItemUnlocated per unit touched. An overage (counted > system) is
        reported as a DiscrepancyDetected/CycleCountCompleted(discrepancy=true)
        pair for a separate receiving/audit process to reconcile — this
        endpoint does not itself create the extra stock. Each call with a
        new Idempotency-Key represents a new physical count event and is
        intentionally repeatable (recounting a bin is a normal operational
        action); a retry with the SAME Idempotency-Key replays the first
        answer and counts nothing again.
      tags: [Bins]
      parameters:
        - $ref: "#/components/parameters/BinId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleCountRequest"
            example:
              countedQuantity: 9
      responses:
        "200":
          description: >
            Cycle count recorded and reconciled (discrepancy indicates
            whether counted quantity differed from system quantity).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountResult"
              example:
                binId: A-1-1
                countedQuantity: 9
                systemQuantity: 10
                discrepancy: true
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: >
            Malformed JSON body, binId path segment missing/empty, or the
            body omits countedQuantity (an explicit 0 is a valid empty-bin
            count; omitting the field is a client mistake).
            A missing or malformed Idempotency-Key header is also a 400 (idempotency-key-required / idempotency-key-invalid).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptyBinId:
                  summary: Bin ID missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-bin-id
                    title: Bin ID must not be empty
                    status: 400
                    detail: bin id must not be empty
                    instance: /bins//cycle-counts
                countedQuantityRequired:
                  summary: countedQuantity omitted (an explicit 0 is valid)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/counted-quantity-required
                    title: countedQuantity is required
                    status: 400
                    detail: countedQuantity must be present; an explicit 0 is a valid empty-bin count, omitting it is not
                    instance: /bins/A-1-1/cycle-counts
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /bins/A-1-1/cycle-counts
        "404":
          description: No bin exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                title: Bin not found
                status: 404
                detail: bin not found
                instance: /bins/A-1-1/cycle-counts
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "422":
          description: countedQuantity present but negative.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/negative-quantity
                title: Quantity must not be negative
                status: 422
                detail: quantity must not be negative
                instance: /bins/A-1-1/cycle-counts
        "500":
          $ref: "#/components/responses/InternalError"

  /transfers/{transferLineId}/receipt:
    post:
      operationId: stageTransferReceipt
      summary: Stage a destination transfer receipt (count an arrival)
      description: >-
        A destination site counted received goods against a transfer line
        (ADR 0031). The transfer_line_id is looked up in the
        transfer_allocations ledger: a recognized ALLOCATED line answers
        201 with a STAGED transfer receipt (expected_quantity from the
        ledger, received_quantity as counted, variance = received -
        expected, SIGNED: positive is over, negative is short) and
        publishes TransferReceiptStaged through the transactional outbox.
        NO usable stock moves at this step.


        An UNRECOGNIZED scan — no ledger row for the line (this service
        never allocated it), a row that was REJECTED, a transfer_id
        mismatch, or a destination equal to the transfer's own origin
        site — is QUARANTINED: an inventory_exceptions row is written
        (kind UNKNOWN_TRANSFER or UNRECOGNIZED_TRANSFER), nothing that
        could raise usable stock is published, and the 422 problem body
        carries the exception's coordinates in its `exception` extension
        member so an operator can resolve it.


        Idempotent on transfer_line_id at the database level: an
        identical replay answers 200 with the ORIGINAL receipt (replay:
        true) and republishes nothing; the same line id with a DIFFERENT
        payload is a 409 transfer-receipt-conflict (the original receipt
        is immutable).
      tags: [Transfers]
      parameters:
        - $ref: "#/components/parameters/TransferLineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageTransferReceiptRequest"
            example:
              transferId: tr-77
              destinationSiteId: SITE-DEST
              sku: SKU-T1
              receivedQuantity: 5
      responses:
        "200":
          description: >-
            Idempotent replay: this exact scan was already staged; the
            ORIGINAL receipt is returned (replay: true) and nothing was
            republished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "201":
          description: >-
            The receipt was staged against a recognized ALLOCATED line.
            No usable stock moved — stow first raises it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
              example:
                transferId: tr-77
                transferLineId: tl-77-1
                destinationSiteId: SITE-DEST
                sku: SKU-T1
                expectedQuantity: 6
                receivedQuantity: 5
                variance: -1
                state: STAGED
                stagedAt: "2026-10-06T12:00:00Z"
                replay: false
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: >-
            Malformed JSON body, transferId/sku/destinationSiteId missing
            or empty, receivedQuantity not positive, or the
            Idempotency-Key header is absent (ADR 0018).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                transferIdRequired:
                  summary: transferId missing
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/transfer-id-required
                    title: transferId is required
                    status: 400
                    detail: transferId must not be empty
                    instance: /transfers/tl-77-1/receipt
                emptySku:
                  summary: SKU missing or empty
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-sku
                    title: SKU must not be empty
                    status: 400
                    detail: sku must not be empty
                    instance: /transfers/tl-77-1/receipt
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /transfers/tl-77-1/receipt
        "409":
          description: >-
            This transfer_line_id already has a receipt staged with a
            DIFFERENT payload; the original receipt stands immutable.
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                transferReceiptConflict:
                  summary: "This transfer line already has a receipt for a different scan"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/transfer-receipt-conflict
                    title: This transfer line already has a receipt for a different scan
                    status: 409
                    detail: transfer line already has a receipt for a different scan
                    instance: /transfers/tl-77-1/receipt
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /transfers/tl-77-1/receipt
        "422":
          description: >-
            The scan could NOT be matched to a recognized ALLOCATED
            transfer line and was QUARANTINED as an inventory exception.
            No stock changed. The `exception` extension member carries
            the quarantine row's coordinates.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/QuarantinedScanProblem"
              examples:
                unknownTransfer:
                  summary: The line was never allocated by this service
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/transfer-scan-quarantined
                    title: Destination scan quarantined
                    status: 422
                    detail: transfer line was never allocated by this service
                    instance: /transfers/tl-ghost/receipt
                    exception:
                      kind: UNKNOWN_TRANSFER
                      transferId: tr-ghost
                      transferLineId: tl-ghost
                      destinationSiteId: SITE-DEST
                      sku: SKU-T1
                      receivedQuantity: 5
                unrecognizedTransfer:
                  summary: The line was REJECTED at allocation time
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/transfer-scan-quarantined
                    title: Destination scan quarantined
                    status: 422
                    detail: "transfer line is not in ALLOCATED state for this scan: line \"tl-rej\" was decided REJECTED (INSUFFICIENT_USABLE), not ALLOCATED"
                    instance: /transfers/tl-rej/receipt
                    exception:
                      kind: UNRECOGNIZED_TRANSFER
                      transferId: tr-r
                      transferLineId: tl-rej
                      destinationSiteId: SITE-DEST
                      sku: SKU-T1
                      receivedQuantity: 5
        "500":
          $ref: "#/components/responses/InternalError"

  /transfers/{transferLineId}/stowages:
    post:
      operationId: stowTransferStock
      summary: Stow a staged transfer receipt into destination bins
      description: >-
        Places a STAGED transfer receipt's goods into destination-site
        bins (ADR 0031) — the ONLY path that raises the destination
        site's usable stock for a transfer, exactly once per
        transfer_line_id. Every requested bin must be registered at the
        receipt's destination site (the site-custody fact fails closed:
        another site's bin or a legacy site-less bin is a 409), and the
        bin quantities must sum EXACTLY to the receipt's
        receivedQuantity. One StockUnit per bin leg is created AT the
        destination site, the receipt moves STAGED -> STOWED, and
        TransferStockStowed is published through the same transactional
        outbox.


        Idempotent at the database level: a replayed stow for an
        already-STOWED receipt answers 200 with the ORIGINAL outcome
        (replay: true, the original allocations), creates NO second
        StockUnit and publishes nothing new. Stowing a line with no
        staged receipt (stow-before-stage) is a 409 receipt-not-staged.
      tags: [Transfers]
      parameters:
        - $ref: "#/components/parameters/TransferLineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StowTransferRequest"
            example:
              bins:
                - binId: BIN-DEST-1
                  quantity: 3
                - binId: BIN-DEST-2
                  quantity: 2
      responses:
        "200":
          description: >-
            The receipt is STOWED; the destination site's usable stock
            rose by exactly receivedQuantity, once. `allocations` names
            the StockUnits created and the bin each went into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StowedTransfer"
              example:
                transferId: tr-77
                transferLineId: tl-77-1
                destinationSiteId: SITE-DEST
                sku: SKU-T1
                expectedQuantity: 6
                receivedQuantity: 5
                variance: -1
                state: STOWED
                stagedAt: "2026-10-06T12:00:00Z"
                stowedAt: "2026-10-06T12:05:00Z"
                replay: false
                stowedQuantity: 5
                allocations:
                  - stockUnitId: su-dest-1
                    binId: BIN-DEST-1
                    quantity: 3
                  - stockUnitId: su-dest-2
                    binId: BIN-DEST-2
                    quantity: 2
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          description: >-
            Malformed JSON body, bins missing/empty, a binId missing or
            empty, a quantity not positive, or the Idempotency-Key
            header absent (ADR 0018).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                binsRequired:
                  summary: "bins is required"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bins-required
                    title: bins is required
                    status: 400
                    detail: bins must contain at least one placement
                    instance: /transfers/tl-77-1/stowages
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /transfers/tl-77-1/stowages
        "409":
          description: >-
            No STAGED receipt for this line (stow-before-stage, or the
            line is unknown), a bin outside the destination site's
            custody, a bin quantity sum mismatch, or the receipt already
            has a DIFFERENT staged scan.
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                receiptNotStaged:
                  summary: Stow before stage
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/receipt-not-staged
                    title: Transfer receipt is not in STAGED state; stage the receipt before stowing
                    status: 409
                    detail: transfer receipt is not in STAGED state; stage the receipt before stowing
                    instance: /transfers/tl-77-1/stowages
                binWrongSite:
                  summary: Bin at another site (or a legacy site-less bin)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-wrong-site
                    title: Bin does not belong to the transfer's destination site
                    status: 409
                    detail: "bin does not belong to the transfer's destination site: bin \"BIN-OTHER\" is not in destination site \"SITE-DEST\"'s custody"
                    instance: /transfers/tl-77-1/stowages
                stowQuantityMismatch:
                  summary: Bin quantities do not sum to receivedQuantity
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/stow-quantity-mismatch
                    title: Stow quantities must sum exactly to the receipt's received quantity
                    status: 409
                    detail: "stow quantities must sum exactly to the receipt's received quantity: bins sum to 3 but the receipt received 5"
                    instance: /transfers/tl-77-1/stowages
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /transfers/tl-77-1/stowages
        "500":
          $ref: "#/components/responses/InternalError"

  /relocations:
    post:
      operationId: relocateStock
      summary: Move stock of one SKU between two bins of the same site
      description: >-
        Records an intra-site relocation (ADR 0039; slotting-optimization
        ADR 0010): quantity units of sku leave fromBin and arrive in toBin,
        both bins of siteCode. Only the usable (unreserved) quantity of the
        SKU in fromBin can move. Both bins' occupancy, every touched
        StockUnit, a new StockUnit in toBin, the relocation record and the
        `StockRelocated` event (transactional outbox) commit in one
        transaction; a concurrent change to either bin or a touched unit is
        a 409 concurrent-modification and nothing moves.


        Behind the Idempotency-Key middleware like the other creating POSTs
        (ADR 0018): a replay with the same key and body returns the original
        201 without moving stock again; the same key with a different body
        is 409 idempotency-key-reused.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelocateStockRequest"
            example:
              siteCode: WH1
              sku: SKU-1
              fromBin: WH1-STOR-AMB-A07-03-02-B
              toBin: WH1-STOR-AMB-A01-01-01-A
              quantity: 12
              reason: SLOTTING
              sourceRef: plan-7/move-2
      responses:
        "201":
          description: The stock moved; the body is the relocation record.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              description: "`/relocations/{id}` of the new relocation."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relocation"
              example:
                id: rel-0b7e2a54-3c1d-4f0e-9a8b-7c6d5e4f3a21
                siteCode: WH1
                sku: SKU-1
                fromBin: WH1-STOR-AMB-A07-03-02-B
                toBin: WH1-STOR-AMB-A01-01-01-A
                quantity: 12
                reason: SLOTTING
                sourceRef: plan-7/move-2
                destinationStockUnitId: su-9a1e0f3c-2b4d-4c6e-8f00-112233445566
                legs:
                  - stockUnitId: su-164710cb-5e14-400b-849c-ed94d8256c6b
                    quantity: 12
                occurredAt: "2026-10-13T12:00:00Z"
        "400":
          description: >-
            Malformed JSON body, an empty siteCode, sku, fromBin or toBin, or
            the Idempotency-Key header absent (ADR 0018).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptySiteId:
                  summary: "Site ID must not be empty"
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/empty-site-id
                    title: Site ID must not be empty
                    status: 400
                    detail: site id must not be empty
                    instance: /relocations
                idempotencyKeyRequired:
                  summary: Idempotency-Key header missing or invalid (REST guideline 2.2)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint changes state and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /relocations
        "404":
          description: fromBin or toBin is not a registered bin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-found
                title: Bin not found
                status: 404
                detail: bin not found
                instance: /relocations
        "409":
          description: >-
            A bin is not in siteCode (bin-not-at-site), the usable quantity
            of the SKU in fromBin is below quantity (insufficient-usable),
            toBin has no room (bin-full), or a concurrent writer changed a
            bin or a touched unit (concurrent-modification).
            The same Idempotency-Key reused with a different method, path or body is also a 409 (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                binNotAtSite:
                  summary: A bin outside the site
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-not-at-site
                    title: Bin is not in the relocation's site
                    status: 409
                    detail: bin is not in the relocation's site
                    instance: /relocations
                insufficientUsable:
                  summary: Not enough unreserved stock in fromBin
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/insufficient-usable
                    title: Requested quantity exceeds usable inventory
                    status: 409
                    detail: reserve quantity exceeds usable quantity
                    instance: /relocations
                binFull:
                  summary: toBin has no room
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/bin-full
                    title: "Bin is full: capacity exceeded"
                    status: 409
                    detail: "bin is full: capacity exceeded"
                    instance: /relocations
                idempotencyKeyReused:
                  summary: Idempotency-Key reused with a different method, path or body (REST guideline 2.3)
                  value:
                    type: https://errors.inventory-storage.warehouse-systems.dev/idempotency-key-reused
                    title: Idempotency-Key was already used with a different request
                    status: 409
                    detail: The Idempotency-Key header on this request was already used with a different method, path or body. Use a new Idempotency-Key for a genuinely different request.
                    instance: /relocations
        "422":
          description: >-
            fromBin equals toBin (same-bin), quantity is not positive
            (zero-quantity), reason is not SLOTTING, CONSOLIDATION or MANUAL
            (invalid-relocation-reason), sourceRef is longer than 200
            characters (source-ref-too-long).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.inventory-storage.warehouse-systems.dev/same-bin
                title: Relocation source and destination bin must differ
                status: 422
                detail: relocation source and destination bin must differ
                instance: /relocations
        "500":
          $ref: "#/components/responses/InternalError"

