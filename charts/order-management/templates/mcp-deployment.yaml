{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-management.mcpFullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "order-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            # cmd/mcp runs the same GetOrder read use case over the same OLTP
            # database as cmd/order, and (like it) applies migrations on
            # start -- idempotent, so both binaries may point at the same
            # directory. MIGRATIONS_PATH/LOG_LEVEL are left to the binary's
            # own env-driven defaults ("migrations" / "info"); no chart value
            # exists for them today, matching cmd/order's own deployment
            # template, which also leaves them unrendered.
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "order-management-mcp"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # cmd/mcp does not serve GET /healthz today (unlike, e.g.,
          # inventory-storage's cmd/mcp, which wires its own healthz mux) --
          # this is a chart-only PR so the Go binary is not touched here.
          # Probing the raw socket is a safe interim signal that the process
          # is up and listening; switch to httpGet /healthz once cmd/mcp
          # grows that route in a follow-up.
          #
          # startupProbe mirrors the shared boot-time-dial-retry fix
          # (order-management's Postgres migrations+ping now retry through
          # internal/bootretry with a ~31s budget instead of crash-looping
          # on the first-dial reset Istio's native sidecars cause): give
          # kubelet a longer, separate probe budget during boot so it
          # doesn't SIGTERM the pod mid-backoff, matching the primary
          # deployment's startupProbe (periodSeconds: 2, failureThreshold:
          # 30 -> a 60s budget, comfortably past the retry helper's own
          # ~31s worst case).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
