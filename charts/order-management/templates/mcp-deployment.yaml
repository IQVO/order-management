{{- if and .Values.mcp.enabled (not (include "order-management.agentsColocated" .)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-management.mcpFullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  annotations:
    # agents.colocate cutover (ADR 0012): ArgoCD prunes this Deployment only after <release>-agents serves
    # (PruneLast); on the un-flip wave -1 recreates it Healthy before the wave-0 Services switch back.
    # Deployment-object annotations: syncing them rolls no pod.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "order-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          # Endpoint-removal drain (capacity step 3 follow-up): Kong routes to pod IPs and drops a terminating
          # pod only on its next config sync, seconds later, while cmd/mcp closes its listener at SIGTERM and an
          # idle process exits at once; without this delay Kong keeps sending to a vanished pod IP (a 502 or a
          # connect timeout through Kong on every roll). The kubelet-native sleep needs no shell (distroless).
          # terminationGracePeriodSeconds must stay above this sleep + the 10 s HTTP drain.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            # cmd/mcp runs the same GetOrder read use case over the same OLTP
            # database as cmd/order, and (like it) applies migrations on
            # start -- idempotent, so both binaries may point at the same
            # directory. MIGRATIONS_PATH/LOG_LEVEL are left to the binary's
            # own env-driven defaults ("migrations" / "info"); no chart value
            # exists for them today, matching cmd/order's own deployment
            # template, which also leaves them unrendered.
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0029: cmd/mcp also runs migrations on start (see the
            # comment above), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "order-management-mcp"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # cmd/mcp does not serve GET /healthz today (unlike, e.g.,
          # inventory-storage's cmd/mcp, which wires its own healthz mux) --
          # this is a chart-only PR so the Go binary is not touched here.
          # Probing the raw socket is a safe interim signal that the process
          # is up and listening; switch to httpGet /healthz once cmd/mcp
          # grows that route in a follow-up.
          #
          # startupProbe mirrors the shared boot-time-dial-retry fix
          # (order-management's Postgres migrations+ping now retry through
          # internal/bootretry (5 attempts, 15s of backoff) instead of crash-looping
          # on the first-dial reset Istio's native sidecars cause): give
          # kubelet a longer, separate probe budget during boot so it
          # doesn't SIGTERM the pod mid-backoff, matching the primary
          # deployment's startupProbe (periodSeconds: 2, failureThreshold:
          # 30 -> a 60s budget, comfortably past the retry helper's own
          # 15s of backoff plus the attempts themselves).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
