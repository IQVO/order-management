{{- if and .Values.analytics.enabled .Values.analytics.reports.route.enabled .Values.analytics.reports.enabled -}}
{{- /*
Analytics reports exposure through Kong — replaces the Terraform-side
null_resource reports HTTPRoutes (services.tf), for the same reason as
kong-plugins.yaml: chart-rendered routes are Helm/ArgoCD-reconciled forever,
kubectl-applied ones silently vanish on rebuild and nothing notices.

Host contract: /api/<context>/reports -> Service <context>-reports:80,
prefix rewritten to /reports (every reports binary registers
GET /reports/<report-name>, not a bare /<name>).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "order-management.reportsFullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: reports
  annotations:
    konghq.com/plugins: {{ include "order-management.kongPluginNames" . | quote }}
spec:
  parentRefs:
    {{- range .Values.analytics.reports.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.analytics.reports.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: {{ include "order-management.reportsFullname" . }}
          port: {{ .Values.analytics.reports.service.port }}
{{- end }}
