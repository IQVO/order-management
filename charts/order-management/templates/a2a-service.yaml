{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-management.a2aFullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type }}
  ports:
    - port: {{ .Values.a2a.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "order-management.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
{{- end }}
