apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-management.fullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
# Mounted by the api Deployment (cmd/order) with `envFrom: configMapRef`
# (gap fix D14): every key below is read by cmd/order. Explicit `env`
# entries in deployment.yaml win over the same key here. The analytics,
# reports and MCP Deployments do NOT mount it: they read their own env.
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  SHUTDOWN_DRAIN_DELAY: {{ .Values.config.shutdownDrainDelay | quote }}
  OUTBOX_RELAY_INTERVAL: {{ .Values.config.outboxRelayInterval | quote }}
  # ADR 0040: failed sends after which the relay stops claiming an outbox
  # row. "0" = unlimited.
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  {{- if or .Values.database.url .Values.database.existingSecret }}
  HOUSEKEEPING_INTERVAL: {{ .Values.config.housekeepingInterval | quote }}
  IDEMPOTENCY_KEY_TTL: {{ .Values.config.idempotencyKeyTtl | quote }}
  OUTBOX_RETENTION: {{ .Values.config.outboxRetention | quote }}
  {{- end }}
  {{- if or (eq .Values.config.eventPublisher "kafka") .Values.plannedCapacity.consumerGroup .Values.productClassification.consumerGroup (eq (.Values.releaseConfirmation.mode | default "") "kafka") }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
  {{- if .Values.productClassification.mode }}
  PRODUCT_CLASSIFICATION_MODE: {{ .Values.productClassification.mode | quote }}
  {{- end }}
  {{- if .Values.productClassification.consumerGroup }}
  PRODUCT_CLASSIFICATION_CONSUMER_GROUP: {{ .Values.productClassification.consumerGroup | quote }}
  {{- end }}
  {{- if eq (.Values.releaseConfirmation.mode | default "") "kafka" }}
  # ADR 0043: confirm each released order line from WorkUnitCreated and flag
  # OrderReleaseUnconfirmed. Rendered only when the mode is "kafka"; the
  # consumer group has a fixed default so a restarted pod resumes.
  RELEASE_CONFIRMATION_MODE: "kafka"
  RELEASE_CONFIRMATION_CONSUMER_GROUP: {{ .Values.releaseConfirmation.consumerGroup | default "order-management-release-confirmation" | quote }}
  RELEASE_CONFIRMATION_TIMEOUT: {{ .Values.releaseConfirmation.timeout | quote }}
  RELEASE_CONFIRMATION_RETENTION: {{ .Values.releaseConfirmation.retention | quote }}
  {{- end }}
  {{- if .Values.plannedCapacity.consumerGroup }}
  PLANNED_CAPACITY_CONSUMER_GROUP: {{ .Values.plannedCapacity.consumerGroup | quote }}
  {{- if .Values.plannedCapacity.siteId }}
  PLANNED_CAPACITY_SITE_ID: {{ .Values.plannedCapacity.siteId | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.demandProjection.siteId }}
  DEMAND_PROJECTION_SITE_ID: {{ .Values.demandProjection.siteId | quote }}
  {{- end }}
  INVENTORY_STORAGE_MODE: {{ .Values.inventoryStorage.mode | quote }}
  {{- if .Values.inventoryStorage.baseUrl }}
  INVENTORY_STORAGE_BASE_URL: {{ .Values.inventoryStorage.baseUrl | quote }}
  {{- end }}
