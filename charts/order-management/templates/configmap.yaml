apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-management.fullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  {{- if or (eq .Values.config.eventPublisher "kafka") .Values.plannedCapacity.consumerGroup }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
  {{- if .Values.plannedCapacity.consumerGroup }}
  PLANNED_CAPACITY_CONSUMER_GROUP: {{ .Values.plannedCapacity.consumerGroup | quote }}
  {{- if .Values.plannedCapacity.siteId }}
  PLANNED_CAPACITY_SITE_ID: {{ .Values.plannedCapacity.siteId | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.demandProjection.siteId }}
  DEMAND_PROJECTION_SITE_ID: {{ .Values.demandProjection.siteId | quote }}
  {{- end }}
  INVENTORY_STORAGE_MODE: {{ .Values.inventoryStorage.mode | quote }}
  {{- if .Values.inventoryStorage.baseUrl }}
  INVENTORY_STORAGE_BASE_URL: {{ .Values.inventoryStorage.baseUrl | quote }}
  {{- end }}
