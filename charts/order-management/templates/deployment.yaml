apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-management.fullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "order-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "order-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.config.shutdownDrainDelay | quote }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            # ADR-0032 housekeeping sweeper: idempotency_keys TTL +
            # published outbox_events retention. Only rendered when a
            # database is configured (the sweeper is Postgres-only); the
            # binary's own defaults match these values.
            - name: HOUSEKEEPING_INTERVAL
              value: {{ .Values.config.housekeepingInterval | quote }}
            - name: IDEMPOTENCY_KEY_TTL
              value: {{ .Values.config.idempotencyKeyTtl | quote }}
            - name: OUTBOX_RETENTION
              value: {{ .Values.config.outboxRetention | quote }}
            {{- end }}
            {{- if or (eq .Values.config.eventPublisher "kafka") .Values.plannedCapacity.consumerGroup .Values.productClassification.consumerGroup }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- end }}
            {{- if .Values.productClassification.mode }}
            # ADR 0036: kafka|permissive ("http" was removed and fails boot).
            - name: PRODUCT_CLASSIFICATION_MODE
              value: {{ .Values.productClassification.mode | quote }}
            {{- end }}
            {{- if .Values.productClassification.consumerGroup }}
            # ADR 0036: stable group of the local classification copy's
            # consumer on warehouse.product-master.events.
            - name: PRODUCT_CLASSIFICATION_CONSUMER_GROUP
              value: {{ .Values.productClassification.consumerGroup | quote }}
            {{- end }}
            {{- if .Values.plannedCapacity.consumerGroup }}
            # ADR 0031: consume warehouse-planning's capacity plans. The
            # group id is a fixed, stable value (a restarted pod resumes
            # from its committed offsets); empty (the default) renders
            # nothing and the integration stays off.
            - name: PLANNED_CAPACITY_CONSUMER_GROUP
              value: {{ .Values.plannedCapacity.consumerGroup | quote }}
            {{- if .Values.plannedCapacity.siteId }}
            - name: PLANNED_CAPACITY_SITE_ID
              value: {{ .Values.plannedCapacity.siteId | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.demandProjection.siteId }}
            # ADR 0035: static demand-site scope for the additive
            # SiteSkuDemandChanged projection. Empty (the default)
            # renders nothing and the projection stays off.
            - name: DEMAND_PROJECTION_SITE_ID
              value: {{ .Values.demandProjection.siteId | quote }}
            {{- end }}
            - name: INVENTORY_STORAGE_MODE
              value: {{ .Values.inventoryStorage.mode | quote }}
            {{- if .Values.inventoryStorage.baseUrl }}
            - name: INVENTORY_STORAGE_BASE_URL
              value: {{ .Values.inventoryStorage.baseUrl | quote }}
            {{- end }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0029: a direct (non-pooled) connection used only for
            # the migration step below, never for the runtime pgxpool.
            # `optional: true` so a secret without this key yet (predates
            # this chart version) still starts the pod -- the binary falls
            # back to DATABASE_URL itself when this env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
