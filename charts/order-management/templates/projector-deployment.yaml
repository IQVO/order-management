{{- if .Values.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-management.projectorFullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  replicas: {{ .Values.analytics.projector.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "order-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/order-projector"]
          ports:
            - name: admin
              containerPort: 8091
              protocol: TCP
          env:
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: ANALYTICS_MIGRATIONS_PATH
              value: {{ .Values.analytics.migrationsPath | quote }}
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "order-management.analyticsSecretName" . }}
                  key: ANALYTICS_DATABASE_URL
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "order-projector"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
          # startupProbe mirrors the shared boot-time-dial-retry fix
          # (order-projector's analytics Postgres migrations+ping now
          # retry through internal/bootretry with a ~31s budget instead
          # of crash-looping on the first-dial reset Istio's native
          # sidecars cause): give kubelet a longer, separate probe budget
          # during boot so it doesn't SIGTERM the pod mid-backoff,
          # matching the primary deployment's startupProbe
          # (periodSeconds: 2, failureThreshold: 30 -> a 60s budget,
          # comfortably past the retry helper's own ~31s worst case).
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
