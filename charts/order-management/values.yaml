# Default values for order-management.

replicaCount: 1

image:
  repository: ghcr.io/claudioed/order-management
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: order-management.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type (plan 3.3 / the HPA + pgxpool-tuning ADR). Every block
# below defaults `enabled: false` so this PR cannot silently change
# production replica behaviour on merge — the fleet turns these on
# deliberately later, after this PR proves the shape is correct. When a
# component's autoscaling.<x>.enabled=true, that Deployment's own
# replicaCount / analytics.<x>.replicaCount value is OMITTED from the
# rendered manifest (see each deployment template's `{{- if not
# .Values.autoscaling.<x>.enabled }}` guard) so the HPA controller is the
# SOLE owner of .spec.replicas — a hardcoded `replicas:` field competing
# with the HPA would otherwise fight it on every reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp)
# keeps a per-process, in-memory `sessions map[string]*sessionInfo`
# keyed by the MCP protocol's own Mcp-Session-Id header (see that
# package's streamable.go) — a real session, not just a TCP/HTTP
# connection. charts/order-management/templates/mcp-service.yaml is a
# plain ClusterIP Service with no sessionAffinity configured, so a
# second request carrying the same Mcp-Session-Id (a multi-call MCP
# session, e.g. initialize then a later tools/call) could be routed by
# kube-proxy to a DIFFERENT pod than the one that created the session,
# which has never heard of that session id and would reject it. This is
# genuine in-memory-only per-replica state, not the OLTP api
# Deployment's read-only/rebuild-from-Kafka kind — mcp is NOT safely
# horizontally scalable as currently built. Making it so would require
# either sessionAffinity: ClientIP (a partial mitigation, not a fix — it
# breaks the moment a client's IP changes, e.g. behind an LB) or a
# shared/external EventStore (mcp.StreamableHTTPOptions.EventStore) for
# session state, which is a real code change out of scope for this
# chart-and-pgxpool-tuning PR. mcp.replicaCount therefore stays a plain,
# un-autoscaled value (see mcp: below); revisit if/when the SDK wiring
# adopts Stateless mode or an external session store.
autoscaling:
  # cmd/order (this Deployment): stateless OLTP HTTP service, no
  # in-memory session state (its only per-process cache -- the
  # PATH_CATALOGUE_SOURCE=kafka local caches -- is read-only and
  # rebuilt from Kafka on start, safe to run N independent copies of).
  # Its RepromiseConsumer inbound Kafka consumer uses a STABLE shared
  # consumer group (kafka.RepromiseConsumerGroup ==
  # "order-management-repromise", ADR-0018) -- the fleet's
  # correctly-scalable pattern (N replicas share partitions via normal
  # Kafka group rebalancing), never a per-process-unique group -- so
  # running multiple api replicas cannot cause the wes-work-planning/
  # e2e-tests consumer-group-collision class of bug. max 4 / target 70%
  # CPU per the plan.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/order-projector: see analytics.projector's own comment below for
  # why max is capped at 2, not 4 -- it is a Kafka consumer under a
  # stable shared group, not a plain stateless HTTP server.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/order-reports: stateless read-only REST reader, same treatment
  # as api.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle):
  # pure static-asset serving, no server-side session or per-request
  # state whatsoever -- the most trivially horizontally scalable
  # workload in this chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka" — gates the outbound domain-event publisher only

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/order/main.go, cmd/mcp/main.go) -- never for the runtime
  # pgxpool, which always uses existingSecretKey/DATABASE_URL above,
  # unchanged. `optional: true` below so a secret that predates this key
  # (local dev, an environment whose Terraform hasn't been rolled yet)
  # still starts the pod: the Go binary's own
  # getenv("MIGRATIONS_DATABASE_URL", databaseURL) fallback then makes
  # migrations run against DATABASE_URL, exactly as before this key
  # existed. See ADR-0029 for the PgBouncer/pg_advisory_lock
  # incompatibility this key exists to route migrations around.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is only rendered when config.eventPublisher is "kafka".
# Unlike fulfillment-execution, order-management has no inbound Kafka
# consumer — this is purely the outbound domain-event publisher toggle
# (cmd/order/main.go: buildRepoAdapters, EVENT_PUBLISHER env var).
kafka:
  brokers: "kafka:9092"

# inventory-storage is this service's outbound HTTP dependency for per-line
# stock allocation (POST/DELETE /reservations). Defaults to "permissive"
# (no-op — AllocateOrder/CancelOrder refuse rather than fabricate a fake
# success), matching the binary's own safe default. Set mode to "http" and
# point baseUrl at a real inventory-storage deployment for allocation to
# actually work (cmd/order/main.go: buildInventoryClient).
inventoryStorage:
  mode: "permissive"
  baseUrl: ""

extraEnv: []

# Gates liveness and readiness until the process is actually serving.
#
# Without it, BOOT WORK RACES THE LIVENESS PROBE and loses: this service
# runs migrations (and, with PATH_CATALOGUE_SOURCE=kafka, three Kafka
# consumer dials) before it starts listening, and in this cluster every
# injected pod's first outbound dial is reset ~10s after start (Istio
# native sidecars, so holdApplicationUntilProxyStarts is a no-op). The
# retried boot work (cmd/order/main.go: retry, ~31s budget) can therefore
# push first-listen past a plain liveness threshold. Observed live as
# CrashLoopBackOff — order-management-8646d859c7-fkvcz sat at 129
# restarts — which reads like an app crash and is not one; see
# network-fulfillment PR #7, the pattern this chart change ports.
#
# 30 x 2s = 60s of grace, comfortably past the ~31s retry budget, after
# which liveness takes over unchanged. A genuinely broken database still
# fails the pod; it just is not mistaken for a slow one.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0025 §graceful shutdown), NOT /healthz: readiness
    # must flip to not-ready during a graceful SIGTERM drain (see
    # cmd/order/main.go's shutdown sequence) so this pod stops
    # receiving NEW traffic while it finishes in-flight requests --
    # /healthz stays a pure liveness signal ("is the process alive")
    # and is deliberately never flipped by shutdown, or Kubernetes
    # would kill the pod mid-drain instead of letting it finish.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Gives cmd/order/main.go's graceful shutdown sequence (readiness flip
# -> HTTP drain -> outbox relay / repromise consumer clean stop with
# final offset commit -> pgx pool close LAST) room to actually finish
# before Kubernetes SIGKILLs the container. 10s (the HTTP Shutdown
# budget) + 10s (the same budget, reused for the relay/consumer stop)
# + margin for the readinessProbe's periodSeconds=5 to have observed
# the not-ready flip before traffic fully stops arriving.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# Deployment environment, exported as the deployment.environment.name OTel
# resource attribute (see the otel block below; now consumed by every
# deployed container in this chart, not just the analytics processes).
environment: "local"

# OpenTelemetry. ADR-0009 (standard-metrics-convention) added
# telemetry.Setup + otelchi HTTP RED instrumentation to cmd/order, so the
# OLTP deployment now reads these env vars exactly like the analytics
# projector/reports/mcp deployments below already did. Enabled by default
# like every other fleet chart (inventory-storage, wes-work-planning,
# etc.) now that this service actually has OTel wiring, replacing the
# previous order-management-only false default that predated it.
otel:
  enabled: true
  endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  serviceName: "order-management"

# --- analytics data product (ADR-0006) ---
# The per-service "Order Funnel & Allocation Health" report: a separate
# analytics topic, a writer (projector) and a read-only reader (reports),
# backed by a separate analytical database. Disabled by default so existing
# releases are unaffected; set analytics.enabled=true to deploy the two extra
# processes.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    # HPA min 1 / max 2, NOT 3: kafka.AnalyticsConsumerGroup
    # ("order-management-analytics") is a STABLE, shared consumer-group
    # name with no per-instance uniqueness -- the fleet's correctly-
    # scalable convention (same shape as the OLTP RepromiseConsumer's
    # group, see the top-level autoscaling.api comment) -- so N
    # replicas legitimately share the analytics topic's 8 partitions via
    # normal Kafka rebalancing, not a collision risk. It is capped at 2,
    # not left at api's 4, because: (a) the analytics topic is keyed by
    # OrderId (kafka.AnalyticsPublisher.marshalData), so ordering is
    # only guaranteed per-order/per-partition, and a wider fan-out buys
    # little extra throughput for what is a lightweight
    # ON CONFLICT-upsert workload; (b) it is a single logical writer of
    # the analytical database (ADR-0006) -- correctness does not depend
    # on staying at 1 (every write is idempotent on event_id via
    # ConsumedEventsRepo.MarkProcessed, so 2 replicas processing
    # concurrently is still exactly-once at the projection layer), but
    # there is no throughput case yet that justifies more than 2. See
    # the top-level autoscaling.projector block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Stateless read-only REST reader over the analytical database (its
    # own read-only pgxpool, analyticsstore.NewReadOnlyPool) -- no
    # in-memory state, safe to run N independent copies of. max 3 /
    # target 70% CPU, same treatment as the OLTP api Deployment per the
    # plan. See the top-level autoscaling.reports block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi


# --- frontend (order_mgmt_mfe Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/order-management/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/order-management-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- MCP server (ADR-0010) ---
# The Model Context Protocol server (cmd/mcp): a second deployable running
# the same GetOrder read use case over the same OLTP database as the HTTP
# service, served over Streamable HTTP. Disabled by default so existing
# releases are unaffected; set mcp.enabled=true to deploy it.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart) — see the top-level autoscaling: block's comment for the full
# reasoning: the SDK's StreamableHTTPHandler keeps in-memory,
# per-process MCP session state keyed by Mcp-Session-Id, and this
# chart's mcp-service.yaml has no session affinity, so a second replica
# could receive a mid-session request its own process never created.
# replicaCount therefore stays a plain, manually-set value.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
